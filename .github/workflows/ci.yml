name: CI

on: [push, pull_request]

# 五个作业：
#   1. examples-validate     5 个示例结构 + 语义校验
#   2. py-syntax             scripts/ 与 tests/ 的 Python 语法
#   3. docs-consistency      4 项最小检查（示例数 / README 引用 / references 计数 / 版本三处）
#   4. tests-static          文件层静态检查：生成器与示例一致（XX-014）+ 无未填占位符（DoD #8）
#   5. container-regression  757 条容器断言（harness 注入页内执行，不需要 CDP）
#
# 未验证项（首次 push 后才能确认）：
#   - Chrome 路径：已改为候选探测（CHROME_BIN / google-chrome / chromium-browser / chromium），
#     任一都找不到时由 `Check Chrome availability` 明确报错，不再单点断言某个固定路径。
#     版本是否够跑 --headless=new --dump-dom 仍需首次真实推送确认。
#   - 中文字体：缺 CJK 字体时中文渲染成 tofu、字宽趋近 0，凡是依赖文案宽度的断言都会假红
#     ——不是容器坏了，是环境没字。已加 `Install CJK fonts` 预防，实际是否够用只有真实推送能定。
# 若第 5 个作业在 runner 上起不来：不要加 continue-on-error 掩盖，
# 按偏差处理（回退到 4 个静态作业 + 本地回归），报 team-lead 裁决。

jobs:
  examples-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 5 examples
        run: |
          for f in assets/examples/example-0*.json; do
            echo "--- $f"
            python3 scripts/validate_prd_json.py "$f"
          done

  py-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile scripts and tests
        run: python3 -m compileall -q scripts tests

  docs-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs consistency (4 checks)
        run: python3 tests/check_docs.py

  tests-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generators match committed examples
        run: python3 tests/check_generators.py
      - name: No unfinished placeholders (DoD #8)
        # 旧写法 `grep -rn "TODO\|TBD\|待补充"`：BSD grep 的 BRE 不支持 `\|`，恒 0 命中（假绿，见 E-02）。
        # 现在用脚本显式匹配；命中要么改掉，要么进 ALLOW 并写明理由（文档说明类属后者，不得靠改写措辞规避）。
        run: python3 tests/check_placeholders.py

  container-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 缺 CJK 字体时中文渲染成 tofu，字宽趋近 0，凡依赖文案宽度的断言都会假红
      # ——不是容器坏了，是环境没字。fc-list 那行是取证：日志里能看到实际装上的字体名，
      # 以后若再出现宽度漂移，可直接对照字体版本排查。
      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
          fc-list :lang=zh | head -3
      # 单点路径一旦 runner 镜像换代就假红，而假红会被误读成"代码坏了"（同 E-01/E-02 的失效模式：
      # 检查本身没被验证过，却拿它的绿灯当证据）。改成候选探测，命中即写 GITHUB_ENV 供下一步复用。
      - name: Check Chrome availability
        run: |
          for c in "${CHROME_BIN:-}" /usr/bin/google-chrome google-chrome /usr/bin/chromium-browser chromium; do
            [ -n "$c" ] && [ -x "$c" ] && { echo "CHROME=$c"; "$c" --version; echo "CHROME_PATH=$c" >> "$GITHUB_ENV"; exit 0; }
          done
          echo "::error::runner 上找不到 Chrome"; exit 1
      - name: Run 6-case container regression
        env:
          CHROME: ${{ env.CHROME_PATH }}
        run: bash tests/run.sh
