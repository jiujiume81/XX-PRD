<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XX-PRD · 需求分析与原型工作台</title>
<style>
/* ============ Design Tokens (Ant Design 5) ============ */
:root,.prototype-canvas,.iprd-scope{
  --ant-primary:#1677ff; --ant-primary-hover:#4096ff; --ant-primary-active:#0958d9; --ant-primary-bg:#e6f4ff;
  --ant-success:#52c41a; --ant-success-bg:#f6ffed; --ant-warning:#faad14; --ant-warning-bg:#fffbe6;
  --ant-error:#ff4d4f; --ant-error-bg:#fff2f0; --ant-info-bg:#e6f4ff;
  --ant-text:rgba(0,0,0,.88); --ant-text-2:rgba(0,0,0,.65); --ant-text-3:rgba(0,0,0,.45); --ant-text-4:rgba(0,0,0,.25);
  --ant-border:#d9d9d9; --ant-border-2:#f0f0f0; --ant-bg-layout:#f5f5f5; --ant-bg-container:#fff; --ant-fill:rgba(0,0,0,.04);
  --ant-radius:6px; --ant-radius-lg:8px; --ant-fs:14px; --ant-fs-sm:12px; --ant-fs-lg:16px;
  --ant-h:32px; --ant-h-lg:40px; --ant-h-sm:24px;
  --ant-shadow-1:0 1px 2px 0 rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02);
  --ant-shadow-2:0 6px 16px 0 rgba(0,0,0,.08),0 3px 6px -4px rgba(0,0,0,.12),0 9px 28px 8px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.5714;color:var(--ant-text);background:var(--ant-bg-layout);overflow:hidden}

/* ============ App Shell ============ */
#app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;background:#fff;
  border-bottom:1px solid var(--ant-border-2);flex:0 0 auto;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;white-space:nowrap}
.brand .dot{width:9px;height:9px;border-radius:3px;background:linear-gradient(135deg,#1677ff,#52c41a)}
.brand small{font-weight:400;color:var(--ant-text-3);font-size:12px}
.actions{display:flex;align-items:center;gap:6px;flex:0 0 auto;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.actions::-webkit-scrollbar{display:none}

/* ============ Generic controls ============ */
.btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:var(--ant-radius);
  border:1px solid var(--ant-border);background:#fff;color:var(--ant-text);cursor:pointer;font-size:13px;
  transition:.15s;white-space:nowrap;font-family:inherit}
.btn:hover{color:var(--ant-primary);border-color:var(--ant-primary)}
.btn.primary{background:var(--ant-primary);border-color:var(--ant-primary);color:#fff}
.btn.primary:hover{background:var(--ant-primary-hover);border-color:var(--ant-primary-hover);color:#fff}
.btn.on{background:var(--ant-primary-bg);border-color:var(--ant-primary);color:var(--ant-primary)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.icon{padding:0 8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* 顶栏下拉：**必须带元素名**（`select.sel`），不能只写 `.sel`。
   只写 `.sel` 时这条规则会命中所有 class 含 sel 的元素 —— 包括分页的 `<span class="pg sel">`，
   于是那个页码拿到 13px，成为页内第 4 档字号（P19 实测 13 就是从这来的，
   改 `.ant-pagination{font-size:12px}` 改不掉它：`.sel`(0,1,0) 直接命中 span 本身，
   而继承值永远输给直接声明）。同一个坑在卡片区已经踩过一次（见下面 co-cur 的注释）。 */
select.sel{height:30px;border-radius:var(--ant-radius);border:1px solid var(--ant-border);background:#fff;
  padding:0 8px;font-size:13px;color:var(--ant-text);font-family:inherit;cursor:pointer;max-width:190px}
select.sel:hover{border-color:var(--ant-primary)}
.badge-warn{display:none;align-items:center;gap:4px;color:var(--ant-warning);font-size:12px;cursor:help}
.badge-warn.show{display:inline-flex}

/* ============ Workspace / panes ============ */
.workspace{flex:1 1 auto;display:flex;min-height:0;background:var(--ant-bg-layout);position:relative}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff}
.pane-head{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-bottom:1px solid var(--ant-border-2);
  font-size:12px;color:var(--ant-text-3);flex:0 0 auto;background:#fafafa}
.pane-head b{color:var(--ant-text);font-size:13px;font-weight:600}
.pane-head .sp{flex:1}
/* 中栏吃掉剩余宽度；右栏 PRD 走「像素制」定宽（JS 维护 --prd-w），
   这样 splitter 拖拽是线性可逆的，不会像百分比 flex-basis 那样在极值处卡死 */
.pane-prototype{flex:1 1 auto;min-width:0}
.pane-prd{flex:0 0 480px;width:480px;min-width:0}
.splitter{width:6px;flex:0 0 auto;cursor:col-resize;background:var(--ant-bg-layout);position:relative;touch-action:none}
.splitter:hover::after,.splitter.drag::after{content:'';position:absolute;left:2px;top:0;bottom:0;width:2px;background:var(--ant-primary)}

/* ============ Nav tree (left rail) ============ */
.pane-nav{flex:0 0 auto;width:252px;background:#fff;min-width:0;overflow:hidden;
  transition:width .16s ease}
.pane-nav.collapsed{width:0}
.pane-nav.collapsed + .splitter{display:none}
.nav-head{display:flex;align-items:center;gap:6px;height:38px;padding:0 8px 0 12px;border-bottom:1px solid var(--ant-border-2);
  font-size:12px;color:var(--ant-text-3);flex:0 0 auto;background:#fafafa}
.nav-head b{color:var(--ant-text);font-size:13px;font-weight:600;white-space:nowrap}
.nav-head .sp{flex:1}
.nav-ico{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:0 0 auto;
  border-radius:4px;border:1px solid transparent;background:transparent;color:var(--ant-text-3);cursor:pointer;
  font-size:13px;line-height:1;font-family:inherit;padding:0}
.nav-ico:hover{background:var(--ant-fill);color:var(--ant-primary)}
.nav-search{padding:8px 10px;border-bottom:1px solid var(--ant-border-2);flex:0 0 auto}
.nav-search input{width:100%;height:28px;border:1px solid var(--ant-border);border-radius:var(--ant-radius);
  padding:0 8px;font-size:12px;font-family:inherit;color:var(--ant-text);outline:none;background:#fff}
.nav-search input:focus{border-color:var(--ant-primary);box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.nav-scroll{flex:1 1 auto;overflow:auto;padding:4px 0 18px}
.nav-grp{margin:1px 0}
.nav-row{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 0;cursor:pointer;font-size:13px;
  color:var(--ant-text-2);transition:background .12s,color .12s;position:relative;user-select:none}
.nav-row:hover{background:var(--ant-fill);color:var(--ant-text)}
.nav-row .caret{width:13px;flex:0 0 auto;text-align:center;font-size:9px;color:var(--ant-text-4);
  transition:transform .15s;display:inline-block}
.nav-row .caret.open{transform:rotate(90deg)}
.nav-row .caret.leaf{visibility:hidden}
.nav-row .nm{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:56px}
.nav-row .rt{font-size:11px;color:var(--ant-text-4);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  flex:0 1 auto;min-width:0;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-row .cnt{font-size:11px;color:var(--ant-text-3);flex:0 0 auto}
.nav-row.grp{font-weight:600;color:var(--ant-text);font-size:12.5px;padding-top:7px;padding-bottom:7px}
.nav-row.sel{background:var(--ant-primary-bg);color:var(--ant-primary);font-weight:500}
.nav-row.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ant-primary)}
.nav-row .ptag{font-size:10px;padding:0 5px;height:16px;line-height:16px;border-radius:3px;
  background:var(--ant-fill);color:var(--ant-text-3);flex:0 0 auto;font-weight:400}
.nav-row .ptag.p0{background:#fff1f0;color:#cf1322}
.nav-row .ptag.p1{background:#fffbe6;color:#d48806}
.nav-row .ptag.p2{background:#f6ffed;color:#389e0d}
.nav-row .nb{min-width:16px;height:16px;padding:0 5px;border-radius:8px;background:var(--ant-warning);color:#fff;
  font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.nav-empty{padding:4px 16px 8px;font-size:12px;color:var(--ant-text-4);line-height:1.6}
.nav-none{padding:18px 16px;font-size:12px;color:var(--ant-text-3);line-height:1.8}
.nav-none code{background:var(--ant-fill);padding:1px 4px;border-radius:3px;font-size:11px}

/* ============ Breadcrumb ============ */
.crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ant-text-3);
  min-width:0;flex:1 1 auto;overflow:hidden}
.crumb .cr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.crumb .sep{color:var(--ant-text-4);flex:0 0 auto}
.crumb b{color:var(--ant-text);font-weight:600;white-space:nowrap;flex:0 0 auto}
.crumb .rt{font-size:11px;color:var(--ant-text-4);flex:0 0 auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (max-width:1080px){ .pane-nav{width:200px} }

/* ============ Prototype ============ */
.prototype-scroll{flex:1 1 auto;overflow:auto;background:var(--ant-bg-layout);padding:16px;position:relative}
.prototype-stage{position:relative;margin:0 auto;padding:14px;overflow:hidden}
/* 注意：不要给 .prototype-wrap 加 min-width:100%。它的布局宽度必须恒等于 JS 设定的
   基准宽 baseW，缩放只由 transform 承担；否则布局宽会随 zoom 增长，
   getBoundingClientRect().width 变成 baseW*z²，标注归一化坐标会被除以 z 而漂移。 */
.prototype-wrap{position:relative;display:block;transform-origin:0 0}
.prototype-scroll.pan{cursor:grab}
.prototype-scroll.panning{cursor:grabbing}
.prototype-scroll.panning .prototype-canvas{pointer-events:none}
.zoom-bar{display:flex;align-items:center;gap:2px;flex:0 0 auto;margin-left:6px}
.zbtn{display:inline-flex;align-items:center;justify-content:center;height:24px;min-width:24px;padding:0 7px;
  border:1px solid transparent;border-radius:4px;background:transparent;color:var(--ant-text-2);cursor:pointer;
  font-size:12px;font-family:inherit;line-height:1;white-space:nowrap;transition:.12s}
.zbtn:hover{background:var(--ant-fill);color:var(--ant-primary)}
.zbtn.zval{min-width:50px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.zbtn.on{background:var(--ant-primary-bg);color:var(--ant-primary);border-color:#91caff}
.zbtn[disabled]{opacity:.35;cursor:not-allowed}
.zbtn[disabled]:hover{background:transparent;color:var(--ant-text-2)}
.prototype-canvas{background:#fff;border-radius:var(--ant-radius-lg);box-shadow:var(--ant-shadow-1);
  overflow:hidden;min-height:400px;min-width:640px}
.anno-layer{position:absolute;inset:0;pointer-events:none;z-index:5}
.bubble{position:absolute;pointer-events:auto;min-width:24px;height:24px;padding:0 7px;border-radius:12px;
  background:#faad14;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 2px 8px rgba(250,173,20,.5);transform:translate(-50%,-50%);transition:.15s;
  border:2px solid #fff;user-select:none}
.bubble:hover{transform:translate(-50%,-50%) scale(1.15)}
.bubble.resolved{background:var(--ant-success);box-shadow:0 2px 8px rgba(82,196,26,.5)}
.bubble.rejected{background:#bfbfbf;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.bubble.active{outline:3px solid rgba(22,119,255,.35)}
#protoCanvas.annotating{outline:2px dashed var(--ant-warning);outline-offset:-2px;cursor:crosshair}
/* scrollTo 页内定位后的短暂高亮（用 outline，不参与布局） */
@keyframes iprdFlash{0%,100%{outline:2px solid rgba(22,119,255,0)}20%,70%{outline:2px solid rgba(22,119,255,.9)}}
.prototype-canvas .iprd-flash{animation:iprdFlash 1.3s ease}

/* ============ AntD-ish component styles ============ */
.prototype-canvas{font-size:var(--ant-fs);color:var(--ant-text);line-height:1.5714}
.ant-layout{display:flex;flex-direction:column}
.prototype-canvas>.ant-layout{min-height:400px}
.ant-layout.h{flex-direction:row}
.ant-header{height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;background:#001529;color:#fff;flex:0 0 auto}
.ant-header .h-title{font-size:16px;font-weight:600;color:#fff}
.ant-header .h-back{display:inline-flex;cursor:pointer;opacity:.85}
.ant-header .h-logo{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#1677ff,#52c41a);flex:0 0 auto}
.ant-header .h-extra{margin-left:auto;display:flex;align-items:center;gap:10px}
.ant-sider{width:200px;background:#001529;flex:0 0 auto;padding:8px 0;overflow:auto}
.ant-content{flex:1 1 auto;padding:24px;min-width:0}
.ant-footer{padding:16px 24px;text-align:center;color:var(--ant-text-3);font-size:12px;border-top:1px solid var(--ant-border-2)}
.ant-row{display:flex;flex-wrap:wrap;width:100%}
.ant-col{min-width:0}
.ant-space{display:inline-flex}
.ant-space.v{flex-direction:column}
.ant-space.wrap{flex-wrap:wrap}
.ant-divider{display:flex;align-items:center;gap:10px;color:var(--ant-text-3);font-size:12px;margin:12px 0}
.ant-divider::before,.ant-divider::after{content:'';flex:1;border-top:1px solid var(--ant-border-2)}
.ant-divider.dashed::before,.ant-divider.dashed::after{border-top-style:dashed}
.ant-divider.plain::before,.ant-divider.plain::after{display:none}

.ant-menu{list-style:none;margin:0;padding:0}
.ant-menu.vertical,.ant-menu.inline{width:100%}
.ant-menu .mi{display:flex;align-items:center;gap:9px;height:40px;padding:0 16px;color:rgba(255,255,255,.65);
  cursor:pointer;font-size:14px;transition:.15s;border-radius:0}
.ant-menu .mi:hover{color:#fff;background:rgba(255,255,255,.08)}
.ant-menu .mi.sel{color:#fff;background:var(--ant-primary)}
.ant-menu .mi.dis{opacity:.4;cursor:not-allowed}
.ant-menu.horizontal{display:flex;background:transparent}
.ant-menu.horizontal .mi{color:var(--ant-text-2);border-bottom:2px solid transparent;height:46px}
.ant-menu.horizontal .mi:hover{color:var(--ant-primary);background:transparent}
.ant-menu.horizontal .mi.sel{color:var(--ant-primary);border-bottom-color:var(--ant-primary);background:transparent}

.ant-breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ant-text-3);margin-bottom:14px}
.ant-breadcrumb .bc{color:var(--ant-text-3);cursor:pointer}
.ant-breadcrumb .bc:last-child{color:var(--ant-text)}
.ant-tabs{display:flex;gap:22px;border-bottom:1px solid var(--ant-border-2);margin-bottom:16px}
.ant-tabs.card{gap:0;border:none}
.ant-tabs .tb{padding:9px 0;font-size:14px;color:var(--ant-text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.ant-tabs.card .tb{padding:8px 16px;border:1px solid var(--ant-border-2);margin-right:-1px;background:#fafafa;border-bottom:none}
.ant-tabs .tb:hover{color:var(--ant-primary)}
.ant-tabs .tb.sel{color:var(--ant-primary);border-bottom-color:var(--ant-primary);font-weight:500}
.ant-tabs .tb.dis{opacity:.4;cursor:not-allowed}

.ant-steps{display:flex;gap:8px;margin:8px 0 20px}
.ant-steps.v{flex-direction:column}
.ant-step{flex:1;display:flex;flex-direction:column;gap:6px;position:relative}
.ant-step .s-num{width:24px;height:24px;border-radius:50%;background:var(--ant-fill);color:var(--ant-text-3);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.ant-step.done .s-num{background:var(--ant-primary-bg);color:var(--ant-primary)}
.ant-step.cur .s-num{background:var(--ant-primary);color:#fff}
.ant-step.err .s-num{background:var(--ant-error);color:#fff}
.ant-step .s-t{font-size:13px;color:var(--ant-text-3)}
.ant-step.cur .s-t,.ant-step.done .s-t{color:var(--ant-text)}
.ant-step .s-d{font-size:12px;color:var(--ant-text-4)}

/* 分页 13 → 12：分页是辅助信息，与页脚同档。
   注意这条**不是**页内 13px 的唯一来源：`.pg.sel`（当前页码）还会被顶栏那条
   `select.sel` 直接命中（见上面 `.sel` 的注释），继承值永远输给直接声明 ——
   所以只改这里，P19 实测仍是 4 档。两处一起改才收口。 */
.ant-pagination{display:flex;gap:6px;align-items:center;margin-top:14px;font-size:12px}
.ant-pagination .pg{min-width:30px;height:30px;padding:0 6px;border:1px solid var(--ant-border);border-radius:var(--ant-radius);
  display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;color:var(--ant-text-2)}
.ant-pagination .pg.sel{border-color:var(--ant-primary);color:var(--ant-primary)}

.ant-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--ant-h);padding:0 15px;
  border-radius:var(--ant-radius);border:1px solid var(--ant-border);background:#fff;color:var(--ant-text);
  font-size:14px;cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap;line-height:1}
.ant-btn:hover{color:var(--ant-primary);border-color:var(--ant-primary)}
.ant-btn.primary{background:var(--ant-primary);border-color:var(--ant-primary);color:#fff}
.ant-btn.primary:hover{background:var(--ant-primary-hover);border-color:var(--ant-primary-hover);color:#fff}
.ant-btn.dashed{border-style:dashed}
.ant-btn.text,.ant-btn.link{border-color:transparent;background:transparent;padding:0 6px}
.ant-btn.link{color:var(--ant-primary)}
.ant-btn.danger{color:var(--ant-error);border-color:var(--ant-error)}
.ant-btn.danger.primary{background:var(--ant-error);border-color:var(--ant-error);color:#fff}
.ant-btn.block{width:100%}
.ant-btn.lg{height:var(--ant-h-lg);padding:0 18px;font-size:15px}
.ant-btn.sm{height:var(--ant-h-sm);padding:0 8px;font-size:12px}
.ant-btn.dis,.ant-btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
/* 命令策略：按业务状态不可用。刻意不用 .dis —— 保留指针事件，点击时能说明「为什么不能点」 */
.ant-btn.cap-blocked{opacity:.45;cursor:not-allowed;background:#f5f5f5;border-color:var(--ant-border);color:var(--ant-text-3)}
.ant-btn.cap-blocked.primary{background:#f5f5f5;border-color:var(--ant-border);color:var(--ant-text-3)}
.ant-btn.cap-blocked:hover{background:#f5f5f5;border-color:var(--ant-border);color:var(--ant-text-3)}
.ant-btn.cap-reject{border-style:dashed;color:var(--ant-warning)}
.ant-td-action .cap-blocked{opacity:.38;cursor:not-allowed;text-decoration:none}
#entitySelect{display:none;max-width:200px}
.cap-matrix{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.cap-matrix th,.cap-matrix td{border:1px solid var(--ant-border-2);padding:5px 7px;text-align:center;line-height:1.45}
.cap-matrix th{background:#fafafa;font-weight:600;color:var(--ant-text-2);white-space:nowrap}
.cap-matrix th:first-child,.cap-matrix td:first-child{text-align:left;white-space:nowrap}
.cap-matrix td.ok{color:var(--ant-success);font-weight:700}
.cap-matrix td.no{color:var(--ant-text-4)}
.cap-matrix th.cur,.cap-matrix td.cur{background:var(--ant-primary-bg)}
.cap-matrix .cap-note{font-size:11px;color:var(--ant-text-3);font-weight:400;display:block}
.ant-btn.loading .ant-btn-ico{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.ant-input,.ant-textarea,.ant-select,.ant-picker{width:100%;height:var(--ant-h);padding:4px 11px;border:1px solid var(--ant-border);
  border-radius:var(--ant-radius);font-size:14px;color:var(--ant-text);background:#fff;font-family:inherit;
  display:flex;align-items:center;transition:.15s;outline:none}
.ant-input:focus-within,.ant-select:hover,.ant-picker:hover{border-color:var(--ant-primary)}
.ant-input input{border:none;outline:none;flex:1;font-size:14px;font-family:inherit;background:transparent;min-width:0}
.ant-textarea{height:auto;min-height:64px;align-items:flex-start;padding:6px 11px;line-height:1.5}
.ant-input .ph,.ant-select .ph,.ant-picker .ph,.ant-textarea .ph{color:var(--ant-text-4)}
.ant-input.err,.ant-textarea.err,.ant-select.err{border-color:var(--ant-error)}
.ant-input.warn{border-color:var(--ant-warning)}
.ant-input.dis,.ant-select.dis,.ant-textarea.dis{background:var(--ant-fill);cursor:not-allowed;opacity:.75}
.ant-input .afx{color:var(--ant-text-3);display:inline-flex}
/* caret 不写死字号：写死 10px 会凭空多开一档（P19 实测的第 4 个值之一就是它），
   而 ▾ 是纯装饰，跟着父级走即可（表格底栏 12 / 表单 14 各自合适）。 */
.ant-select .caret{margin-left:auto;color:var(--ant-text-3)}
.ant-select .tag{margin-left:6px}
.ant-num{display:inline-flex;align-items:center;height:var(--ant-h);border:1px solid var(--ant-border);border-radius:var(--ant-radius);overflow:hidden}
.ant-num span{padding:0 9px;color:var(--ant-text-3);cursor:pointer;line-height:var(--ant-h);background:#fff}
.ant-num b{padding:0 10px;font-weight:400;min-width:44px;text-align:center;border-left:1px solid var(--ant-border-2);border-right:1px solid var(--ant-border-2)}

.ant-check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.ant-check .box{width:16px;height:16px;border:1px solid var(--ant-border);border-radius:4px;background:#fff;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
.ant-check.on .box{background:var(--ant-primary);border-color:var(--ant-primary)}
.ant-check.radio .box{border-radius:50%}
.ant-check-group{display:inline-flex;flex-direction:column;gap:8px}
.ant-check-group.h{flex-direction:row;gap:16px}
.ant-radio-group{display:inline-flex;gap:16px}
.ant-radio-group.btn{gap:0;border:1px solid var(--ant-border);border-radius:var(--ant-radius);overflow:hidden}
.ant-radio-group.btn .ant-check{padding:5px 14px;border-right:1px solid var(--ant-border-2);background:#fff}
.ant-radio-group.btn .ant-check:last-child{border-right:none}
.ant-radio-group.btn .ant-check.on{background:var(--ant-primary);color:#fff}
.ant-radio-group.btn .ant-check.on .box{display:none}

.ant-switch{width:44px;height:22px;border-radius:11px;background:rgba(0,0,0,.25);position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}
.ant-switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.ant-switch.on{background:var(--ant-primary)}
.ant-switch.on::after{left:24px}
.ant-switch.sm{width:34px;height:18px}
.ant-switch.sm::after{width:14px;height:14px}
.ant-switch.sm.on::after{left:18px}

.ant-form-item{margin-bottom:18px}
.ant-form-item .fi-label{display:block;margin-bottom:6px;font-size:14px;color:var(--ant-text)}
.ant-form-item .fi-label .req{color:var(--ant-error);margin-right:3px}
.ant-form-item .fi-help{font-size:12px;margin-top:4px;color:var(--ant-text-3)}
.ant-form-item .fi-help.error{color:var(--ant-error)}
.ant-form-item .fi-help.warning{color:var(--ant-warning)}
.ant-form-item .fi-help.success{color:var(--ant-success)}
.ant-form.inline .ant-form-item{display:inline-block;margin-right:16px}
.ant-form.horizontal .ant-form-item{display:flex;gap:12px}
.ant-form.horizontal .fi-label{width:110px;flex:0 0 auto;text-align:right;margin:0;padding-top:5px}

.ant-upload{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border:1px dashed var(--ant-border);border-radius:var(--ant-radius);padding:16px 24px;cursor:pointer;color:var(--ant-text-2);background:#fafafa}
.ant-upload:hover{border-color:var(--ant-primary);color:var(--ant-primary)}
.ant-slider{position:relative;height:var(--ant-h);display:flex;align-items:center}
.ant-slider .track{height:4px;background:var(--ant-border-2);border-radius:2px;flex:1;position:relative}
.ant-slider .fill{position:absolute;left:0;top:0;bottom:0;background:var(--ant-primary);border-radius:2px}
.ant-slider .knob{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--ant-primary);transform:translate(-50%,-50%)}
.ant-rate{display:inline-flex;gap:3px;color:#fadb14;font-size:17px}
.ant-rate .off{color:var(--ant-border)}
.ant-transfer{display:flex;gap:10px;align-items:center}
.ant-transfer .box{flex:1;border:1px solid var(--ant-border);border-radius:var(--ant-radius);min-height:150px;padding:6px}
.ant-transfer .it{padding:5px 8px;border-radius:4px;font-size:13px}
.ant-transfer .it:hover{background:var(--ant-fill)}

.ant-table-wrap{width:100%;overflow:auto}
.ant-table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.ant-table th{background:#fafafa;color:var(--ant-text);font-weight:600;text-align:left;padding:12px 16px;
  border-bottom:1px solid var(--ant-border-2);white-space:nowrap;font-size:14px}
.ant-table td{padding:12px 16px;border-bottom:1px solid var(--ant-border-2);color:var(--ant-text);vertical-align:middle}
.ant-table tbody tr:hover td{background:#fafafa}
/* 行可点（Table props.rowClick: true）：提示可跳转 */
.ant-table tbody tr.row-click{cursor:pointer}
.ant-table tbody tr.row-click:hover td{background:var(--ant-primary-bg)}
.ant-table td span[data-node-id]{cursor:pointer}
.ant-table td span[data-node-id]:hover{text-decoration:underline}
.ant-table.bordered th,.ant-table.bordered td{border-right:1px solid var(--ant-border-2)}
.ant-table.bordered{border:1px solid var(--ant-border-2);border-radius:var(--ant-radius-lg);overflow:hidden}
.ant-table.sm th,.ant-table.sm td{padding:8px 12px;font-size:13px}
/* ============ 作业型表格：密度与吸附（I-07 D1–D5 / D9 / D12） ============
   为什么新增 .xs 而不是改 .sm：列表页要 32、详情/抽屉子表要 36–39，两档都需要；
   改 .sm 的默认值会静默改变所有已引用 .sm 的页面（含内置 demo 与既有断言基线）。
   密度账见 项目治理/迭代/I-07-形态与密度方案.md §3.6。
   口径变更（与方案 §3.6 的差异）：方案写 font-size:13px，实测那样会引入第 4 档字号，
   与 P19「页内 ≤3 档（18/14/12）」冲突；改为 14px + 上下 5px，既守住密度又不多开一档。
   行高：**32 是设计值（内容盒 5+5+21 + 1px 下边框），34 是实测值**
   （实测 tr.offsetHeight = 34，多出的 2px 来自行内盒余量，即 5+5+21+3）。
   P9 的阈值按实测 34 取 —— 拿设计值当阈值，真实行高会越线。 */
.ant-table.xs th,.ant-table.xs td{padding:5px 12px;font-size:14px;line-height:21px}
.ant-table.xs th{font-size:14px}
/* 密集档的行内动作必须更紧：默认 gap:10 时「详情 开始」= 28+10+28 = 66px，
   而 866 档操作列只有 88（列内 64）→ 必折行 → 该行行高从 34 跳到 63（P9 红）。
   6px 是 28+6+28 = 62 ≤ 64 的最大整数解（再大就折行，再小就贴在一起点错）。
   间距写在 CSS 而不是 inline style：inline 的特异性高于任何选择器，密集档覆盖不掉。 */
.ant-td-action{display:flex;gap:10px;flex-wrap:wrap}
.ant-table.xs .ant-td-action{gap:6px}
/* 固定布局：列宽只由声明决定，不随数据抖。只在 .fixed 下生效，不改全局 td（否则会翻转横向滚动断言） */
.ant-table.fixed{table-layout:fixed}
.ant-table.fixed th,.ant-table.fixed td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 按列开关的省略号：只给会溢出的文本长列（≤3 列），不全局开 */
.ant-table .cell-ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 数值列等宽数字：否则「1286」与「986」宽窄不一，右对齐也扫不齐 */
.ant-table td.num,.ant-stat .s-v{font-variant-numeric:tabular-nums}
/* 吸附：表头 sticky（separate 布局下用 inset 补 1px 线，不用 border 免得双线），分页贴底 */
.ant-table-wrap.sticky{max-height:var(--tw-max,100%);overflow:auto}
.ant-table-wrap.sticky thead th{position:sticky;top:0;z-index:2;background:#fafafa;
  box-shadow:inset 0 -1px 0 var(--ant-border-2)}
.ant-table-root.sticky-pager .ant-table-foot{position:sticky;bottom:0;z-index:2;background:#fff}
/* 横向滚动时的左右固定列（须给 background，否则下层内容会透出来） */
.ant-table .col-fix-l{position:sticky;left:0;z-index:1;background:#fff}
.ant-table .col-fix-r{position:sticky;right:0;z-index:1;background:#fff}
.ant-table.xs .col-fix-l,.ant-table.xs .col-fix-r{box-shadow:inset -1px 0 0 var(--ant-border-2)}
.ant-checkbox{width:16px;height:16px;border:1px solid var(--ant-border);border-radius:4px;background:#fff;display:inline-block}
/* 单选列（Table props.radio）：圆点标记「当前行」，用于主子表的主表 */
.ant-radio-dot{width:14px;height:14px;border:1px solid var(--ant-border);border-radius:50%;background:#fff;display:inline-block;position:relative}
.ant-radio-dot.on{border-color:var(--ant-primary);border-width:4px}
.ant-table th.ant-th-radio,.ant-table td.ant-td-radio{width:44px;padding-left:16px;padding-right:8px}
.ant-table th.ant-th-index,.ant-table td.ant-td-index{width:56px;color:var(--ant-text-3)}
/* 主子表：主表选中行高亮（截图里的浅蓝行） */
.ant-table tbody tr.md-sel td{background:var(--ant-primary-bg)}
.ant-table tbody tr.md-row{cursor:pointer}
/* 表格标题（子表「巡检项」这种小标题） */
.ant-table-title{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:14px;font-weight:600;color:var(--ant-text)}
.ant-table-title .ant-icon{cursor:pointer;color:var(--ant-text-3)}
.ant-table-title .ant-icon:hover{color:var(--ant-primary)}

/* 查询条件区（截图顶部「任务编号 / 状态 / 设置查询字段 / 搜索 / 展开」） */
.ant-query-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 16px;margin-bottom:12px;
  background:#fff;border:1px solid var(--ant-border-2);border-radius:var(--ant-radius-lg)}
.ant-query-bar .qf{display:flex;align-items:center;gap:8px;min-width:260px}
.ant-query-bar .qf-label{color:var(--ant-text-2);font-size:14px;white-space:nowrap}
.ant-query-bar .qf-ctl{flex:1 1 180px;min-width:140px}
.ant-query-bar .qf-ctl>.ant-input,.ant-query-bar .qf-ctl>.ant-select,.ant-query-bar .qf-ctl>.ant-picker{width:100%}
.ant-query-bar .qf-extra{margin-left:auto;display:flex;align-items:center;gap:8px}
.ant-query-bar .qf-link{color:var(--ant-primary);font-size:13px;cursor:pointer;white-space:nowrap}

/* ============ 作业型筛选区：两行三列（I-07 §4.2 / D6） ============
   为什么不给 .ant-query-bar 打补丁：一行式的天花板是「控件只能分到 124px」，
   实测去掉 .qf 的 min-width 后仍是 3 行 90px，标签紧贴控件、每列左边界不齐。
   要的是「3 条竖线 + 295px 控件」，那必须换结构（grid），不是加 CSS。
   成本：比一行式多 99px（139 vs 40），换来全部条件常显 + 控件够宽。
   收益：那一屏的其余 97px 是从统计卡（−272）与行高（48→32）里腾出来的。 */
.ant-filter-bar{background:#fff;border:1px solid var(--ant-border-2);border-radius:var(--ant-radius-lg);
  padding:14px 20px 12px}
.ant-filter-bar .fb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  column-gap:24px;row-gap:10px}
.ant-filter-bar .fb-field{display:flex;align-items:center;gap:8px;min-width:0}
.ant-filter-bar .fb-field .lb{flex:0 0 76px;text-align:right;color:var(--ant-text-2);
  font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 控件宽度由栅格列宽决定，上限 320：再宽就一眼扫不到头，行长难读。
   **不得**声明 min-width —— 那正是旧 .qf{min-width:260} 把 6 个条件挤成 6 行的原因。 */
.ant-filter-bar .fb-field .ctl{flex:1 1 auto;min-width:0;max-width:320px}
.ant-filter-bar .fb-field .ctl>.ant-input,
.ant-filter-bar .fb-field .ctl>.ant-select,
.ant-filter-bar .fb-field .ctl>.ant-picker{width:100%}
.ant-filter-bar .fb-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:10px}
.ant-filter-bar .fb-actions .ant-btn.link{background:transparent;border-color:transparent;color:var(--ant-primary);padding:0 4px}
.ant-filter-bar.collapsed .fb-field.more{display:none}

/* 内容区节奏（I-07 D7）：子块之间只留一个 gap，不再靠每个组件自带 margin-bottom 堆叠。
   加这条之后 .ant-alert 的 margin-bottom 必须归零，否则 12+16=28 的间距会把节奏打乱。 */
.ant-content{display:flex;flex-direction:column;gap:var(--ant-content-gap,16px)}
.ant-content>*{margin-top:0;margin-bottom:0}
/* 列表页标题带（I-07 S11）：h1 取 18/600，与正文 14、辅助 12 构成三档。
   不写这条，h1 会吃浏览器默认 2em = 32px —— 那是"没有设计"的默认值，不是选择；
   而且 32 会跟统计卡的 24 一起把页内字号推到 4 档以上（P19）。
   **特异性**：`.ant-content .ant-typography{14px}` 是 (0,2,0)，比 `.ant-content h1`
   的 (0,1,1) 高 —— 只写后者的话 h1 实际渲染 14px（页面没有标题层级，实测如此）。
   所以这里补 `h1.ant-typography`(0,2,1)，并把下面那条收窄成 `:not(h1)`，两头都堵。 */
.ant-content h1,.ant-content h1.ant-typography{font-size:18px;line-height:26px;font-weight:600;margin:0;color:var(--ant-text)}
.ant-content .ant-typography:not(h1){font-size:14px;line-height:22px}

/* 列表工具条（截图「新增 / 导出 / 发布任务 / 废弃」那一行） */
.ant-list-toolbar{display:flex;align-items:center;gap:8px;padding:8px 0 12px}
.ant-list-toolbar .lt-right{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--ant-text-3)}

/* 表格底部：共 N 条 / 每页显示 / 页码
   font-size 13 → 12：分页是**辅助信息**，不是正文。13 会把页内字号多开一档，
   与 P19「18/14/12 三档」冲突（I-07 §6.2 P19）。 */
.ant-table-foot{display:flex;align-items:center;gap:12px;padding:12px 0 4px;font-size:12px;color:var(--ant-text-2);flex-wrap:wrap}
.ant-table-foot .tf-size{display:inline-flex;align-items:center;gap:6px}
.ant-table-foot .tf-size .ant-select{width:96px;height:28px}
.ant-table-foot .ant-pagination{margin:0 0 0 auto}

/* 主子表容器：主表在上，子表在下，子表可展开收起 */
.ant-md{display:flex;flex-direction:column;gap:0;width:100%;min-width:0}
.ant-md .md-detail{margin-top:14px;border:1px solid var(--ant-border-2);border-radius:var(--ant-radius-lg);
  background:#fff;overflow:hidden;flex:0 0 auto}
.ant-md .md-detail-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fafafa;
  border-bottom:1px solid var(--ant-border-2);font-size:14px;font-weight:600;color:var(--ant-text)}
.ant-md .md-detail-head .md-arrow{color:var(--ant-text-3);cursor:pointer;font-size:11px;width:12px;display:inline-block;text-align:center}
.ant-md .md-detail-head .md-count{font-weight:400;font-size:12px;color:var(--ant-text-3)}
.ant-md .md-detail-head .md-tools{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--ant-text-3)}
.ant-md .md-detail-head .md-tools .ant-icon{cursor:pointer}
.ant-md .md-detail-head .md-tools .ant-icon:hover{color:var(--ant-primary)}
.ant-md .md-detail.collapsed .md-detail-body{display:none}
.ant-md .md-detail-body{padding:0 14px 14px}
.ant-md .md-detail-body .ant-table-wrap{border:none}
.ant-md .md-empty{padding:26px 0;text-align:center;color:var(--ant-text-3);font-size:13px}

.ant-skel-line{height:14px;background:linear-gradient(90deg,#f2f2f2 25%,#e6e6e6 37%,#f2f2f2 63%);
  background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:4px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.ant-empty-inline{display:flex;flex-direction:column;align-items:center;gap:8px;padding:36px 0;color:var(--ant-text-3);font-size:13px}

.ant-list{border-radius:var(--ant-radius-lg);overflow:hidden}
.ant-list.bordered{border:1px solid var(--ant-border-2)}
.ant-list .li{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--ant-border-2);align-items:center}
.ant-list .li:last-child{border-bottom:none}
.ant-list .li:hover{background:#fafafa}
.ant-list .li .li-main{flex:1;min-width:0}
.ant-list .li .li-title{font-size:14px;color:var(--ant-text)}
.ant-list .li .li-desc{font-size:13px;color:var(--ant-text-3);margin-top:3px}

/* 卡片只留一层（I-07 D8）：border + bg + shadow 三层叠在同一个白块上，是「每个块都一样重」
   的直接来源 —— 全页 4 张统计卡就是全页唯一的叠三层元素（P5 量到 4）。AntD 5 默认卡片
   是无边框 + 阴影，这里跟它对齐；需要强分块的地方用 `.bordered` 显式加回边框。 */
.ant-card{background:#fff;border-radius:var(--ant-radius-lg);box-shadow:var(--ant-shadow-1)}
.ant-card.bordered{border:1px solid var(--ant-border-2);box-shadow:none}
.ant-card .c-head{display:flex;align-items:center;gap:8px;padding:14px 20px;border-bottom:1px solid var(--ant-border-2)}
.ant-card .c-head .c-title{font-size:15px;font-weight:600;flex:1}
.ant-card .c-body{padding:20px}
.ant-card.hoverable{cursor:pointer;transition:.2s}
.ant-card.hoverable:hover{box-shadow:var(--ant-shadow-2);transform:translateY(-1px);border-color:transparent}
.ant-card.sm .c-body{padding:14px}
.ant-card .c-cover{background:var(--ant-fill);height:120px;display:flex;align-items:center;justify-content:center;color:var(--ant-text-4)}
.ant-card .c-actions{display:flex;border-top:1px solid var(--ant-border-2)}
.ant-card .c-actions>div{flex:1;text-align:center;padding:11px 0;color:var(--ant-text-2);cursor:pointer;font-size:13px}
.ant-card .c-actions>div:hover{color:var(--ant-primary)}

.ant-desc{display:grid;gap:0}
.ant-desc .d-item{padding:14px 16px;border:1px solid var(--ant-border-2);margin:-1px 0 0 -1px}
.ant-desc .d-label{color:var(--ant-text-3);font-size:13px;margin-bottom:5px}
.ant-desc .d-val{color:var(--ant-text)}
.ant-desc-title{font-size:15px;font-weight:600;margin-bottom:12px}

.ant-tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:4px;font-size:12px;
  background:#fafafa;border:1px solid #d9d9d9;color:var(--ant-text-2);line-height:1}
.ant-tag.blue{background:#e6f4ff;border-color:#91caff;color:#0958d9}
.ant-tag.green,.ant-tag.success{background:#f6ffed;border-color:#b7eb8f;color:#389e0d}
.ant-tag.red,.ant-tag.error{background:#fff2f0;border-color:#ffccc7;color:#cf1322}
.ant-tag.orange,.ant-tag.warning{background:#fffbe6;border-color:#ffe58f;color:#d48806}
.ant-tag.purple{background:#f9f0ff;border-color:#d3adf7;color:#531dab}
.ant-tag.cyan{background:#e6fffb;border-color:#87e8de;color:#08979c}
.ant-tag.processing{background:#e6f4ff;border-color:#91caff;color:#0958d9}
.ant-tag .close{opacity:.55;cursor:pointer}

.ant-badge-wrap{display:inline-flex;align-items:center;gap:6px}
.ant-badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ant-error);color:#fff;
  font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.ant-badge.dot{min-width:0;width:7px;height:7px;padding:0;border-radius:50%}
.ant-badge.s-success{background:var(--ant-success)}
.ant-badge.s-processing{background:var(--ant-primary)}
.ant-badge.s-warning{background:var(--ant-warning)}
.ant-badge.s-default{background:var(--ant-border)}
.ant-avatar{width:32px;height:32px;border-radius:50%;background:var(--ant-primary);color:#fff;display:inline-flex;
  align-items:center;justify-content:center;font-size:14px;flex:0 0 auto;overflow:hidden}
.ant-avatar.square{border-radius:var(--ant-radius)}
.ant-avatar.lg{width:40px;height:40px;font-size:16px}
.ant-avatar.sm{width:24px;height:24px;font-size:12px}

.ant-collapse{border:1px solid var(--ant-border-2);border-radius:var(--ant-radius-lg);overflow:hidden}
.ant-collapse .ci-head{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;background:#fafafa;font-size:14px}
.ant-collapse .ci-head:hover{color:var(--ant-primary)}
.ant-collapse .ci-body{padding:14px 16px;border-top:1px solid var(--ant-border-2)}
.ant-collapse .ci+.ci{border-top:1px solid var(--ant-border-2)}
.ant-timeline{padding-left:4px}
.ant-timeline .ti{display:flex;gap:12px;padding-bottom:18px;position:relative}
.ant-timeline .ti::before{content:'';position:absolute;left:5px;top:14px;bottom:0;border-left:1px solid var(--ant-border-2)}
.ant-timeline .ti:last-child::before{display:none}
.ant-timeline .td{width:11px;height:11px;border-radius:50%;background:var(--ant-border);margin-top:5px;flex:0 0 auto;z-index:1}
.ant-timeline .td.blue{background:var(--ant-primary)}.ant-timeline .td.green{background:var(--ant-success)}
.ant-timeline .td.red{background:var(--ant-error)}.ant-timeline .td.gray{background:var(--ant-border)}
.ant-timeline .tc{flex:1}.ant-timeline .tt{font-size:12px;color:var(--ant-text-3);margin-top:3px}
.ant-tree{font-size:14px}
.ant-tree .tn{padding:4px 0;display:flex;align-items:center;gap:6px}
.ant-tree .tn:hover{background:var(--ant-fill);border-radius:4px}
.ant-tree .tw{color:var(--ant-text-3);width:14px;text-align:center;font-size:10px}
.ant-tree .tch{width:14px;height:14px;border:1px solid var(--ant-border);border-radius:3px;background:#fff}
.ant-stat{display:inline-block}
.ant-stat .s-t{color:var(--ant-text-3);font-size:14px;margin-bottom:4px}
.ant-stat .s-v{font-size:24px;color:var(--ant-text);font-weight:500}
.ant-stat .s-v .pre,.ant-stat .s-v .suf{font-size:14px;color:var(--ant-text-3)}
.ant-stat .up{color:var(--ant-error)}.ant-stat .down{color:var(--ant-success)}
.ant-progress{display:flex;align-items:center;gap:8px}
.ant-progress .track{flex:1;height:8px;background:var(--ant-border-2);border-radius:4px;overflow:hidden}
.ant-progress .bar{height:100%;background:var(--ant-primary);border-radius:4px}
.ant-progress .bar.success{background:var(--ant-success)}
.ant-progress .bar.exception{background:var(--ant-error)}
.ant-progress.circle{flex-direction:column}
.ant-alert{display:flex;gap:10px;padding:9px 14px;border-radius:var(--ant-radius-lg);font-size:14px;margin-bottom:12px;align-items:flex-start}
.ant-alert.info{background:var(--ant-info-bg);border:1px solid #91caff}
.ant-alert.success{background:var(--ant-success-bg);border:1px solid #b7eb8f}
.ant-alert.warning{background:var(--ant-warning-bg);border:1px solid #ffe58f}
.ant-alert.error{background:var(--ant-error-bg);border:1px solid #ffccc7}
.ant-alert .a-main{flex:1}
.ant-alert .a-desc{font-size:13px;color:var(--ant-text-2);margin-top:3px}
.ant-image{background:var(--ant-fill);display:flex;align-items:center;justify-content:center;color:var(--ant-text-4);
  border-radius:var(--ant-radius);border:1px solid var(--ant-border-2);min-height:60px;font-size:12px}
.ant-carousel{position:relative;background:var(--ant-fill);border-radius:var(--ant-radius-lg);padding:40px 20px;text-align:center}
.ant-carousel .dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
.ant-carousel .dots i{width:7px;height:7px;border-radius:50%;background:var(--ant-border);display:block}
.ant-carousel .dots i.on{background:var(--ant-primary)}
.ant-calendar{border:1px solid var(--ant-border-2);border-radius:var(--ant-radius-lg);padding:12px}
.ant-calendar .cal-head{display:flex;justify-content:space-between;margin-bottom:10px;font-weight:600}
.ant-calendar .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.ant-calendar .cal-grid .d{padding:6px 0;border-radius:var(--ant-radius);cursor:pointer}
.ant-calendar .cal-grid .d:hover{background:var(--ant-fill)}
.ant-calendar .cal-grid .d.on{background:var(--ant-primary);color:#fff}
.ant-calendar .cal-grid .wk{color:var(--ant-text-3);font-size:12px}

.ant-typography{margin:0}
h1.ant-typography{font-size:30px;font-weight:600;line-height:1.3;margin:0 0 8px}
h2.ant-typography{font-size:24px;font-weight:600;margin:0 0 8px}
h3.ant-typography{font-size:19px;font-weight:600;margin:0 0 6px}
h4.ant-typography{font-size:16px;font-weight:600;margin:0 0 6px}
h5.ant-typography{font-size:14px;font-weight:600;margin:0 0 4px}
.ant-typography.secondary{color:var(--ant-text-3)}
.ant-typography.success{color:var(--ant-success)}
.ant-typography.warning{color:var(--ant-warning)}
.ant-typography.danger{color:var(--ant-error)}
.ant-typography.code{font-family:ui-monospace,Menlo,monospace;background:var(--ant-fill);padding:1px 5px;border-radius:4px;font-size:13px}
.ant-typography.mark{background:#feffe6;padding:1px 3px}
.ant-typography.del{text-decoration:line-through}
.ant-para{margin:0 0 10px;line-height:1.75}

.ant-icon{display:inline-flex;align-items:center;justify-content:center;vertical-align:-2px}
.ant-placeholder{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 8px,#f5f5f5 8px,#f5f5f5 16px);
  border-radius:var(--ant-radius);color:var(--ant-text-4);font-size:12px;border:1px dashed var(--ant-border)}
.ant-chart{background:#fff;border:1px solid var(--ant-border-2);border-radius:var(--ant-radius-lg);padding:16px}
.ant-chart .ch-t{font-size:14px;font-weight:600;margin-bottom:12px}
.ant-frame{display:inline-block;border:10px solid #1f1f1f;border-radius:22px;background:#1f1f1f;position:relative}
.ant-frame .fr-screen{background:#fff;border-radius:12px;overflow:hidden}
.ant-frame .fr-label{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#1f1f1f;color:#fff;
  font-size:10px;padding:2px 10px;border-radius:0 0 6px 6px}
.ant-unknown{border:1px dashed var(--ant-warning);border-radius:var(--ant-radius);padding:8px;background:#fffbe6}
.ant-unknown-tag{font-size:11px;color:#d48806;font-family:ui-monospace,monospace}
.ant-unknown-body{margin-top:6px}

/* overlays rendered inside canvas */
.ant-modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.ant-modal{background:#fff;border-radius:var(--ant-radius-lg);box-shadow:var(--ant-shadow-2);width:520px;max-width:90%}
.ant-modal .m-head{padding:16px 22px;font-size:16px;font-weight:600;border-bottom:1px solid var(--ant-border-2)}
.ant-modal .m-body{padding:20px 22px;color:var(--ant-text-2)}
.ant-modal .m-foot{padding:12px 22px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--ant-border-2)}
.ant-drawer-mask{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;justify-content:flex-end}
.ant-drawer{background:#fff;width:420px;max-width:90%;display:flex;flex-direction:column;box-shadow:var(--ant-shadow-2)}
/* 详情抽屉加宽档（I-07 D12）：420 放不下 6 列子表，列表页详情用 w-lg。
   为什么是 560：866 档内容宽 866−560=306，刚好还能看到「当前行在列表里的位置」；
   再宽就变成「详情页」而不是「详情抽屉」了（见方案 T-5）。 */
.ant-drawer.w-lg{width:560px}
.ant-drawer .d-head{padding:16px 22px;font-size:16px;font-weight:600;border-bottom:1px solid var(--ant-border-2)}
.ant-drawer .d-body{padding:20px 22px;flex:1;overflow:auto}
.ant-drawer .d-foot{padding:12px 22px;border-top:1px solid var(--ant-border-2);display:flex;justify-content:flex-end;gap:8px}
.ant-spin{display:inline-flex;align-items:center;gap:8px;color:var(--ant-primary)}
.ant-spin .sp-ring{width:18px;height:18px;border:2px solid var(--ant-primary-bg);border-top-color:var(--ant-primary);border-radius:50%;animation:spin .9s linear infinite}
.ant-result{text-align:center;padding:36px 20px}
.ant-result .r-ico{font-size:44px;margin-bottom:14px}
.ant-result .r-t{font-size:22px;font-weight:600;margin-bottom:8px}
.ant-result .r-s{color:var(--ant-text-3);margin-bottom:20px}
.ant-pop{position:relative;display:inline-block}

/* component states */
.st-disabled{opacity:.45;pointer-events:none}
.st-loading{opacity:.75}

/* ============ PRD pane ============ */
.prd-scroll{flex:1 1 auto;overflow:auto;padding:22px 26px 60px}
.prd-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--ant-border-2)}
.prd-h1{font-size:21px;font-weight:700;margin:0 0 4px}
.prd-sub{color:var(--ant-text-3);font-size:13px;margin-bottom:14px}
.prd-sec{margin-bottom:22px}
.prd-sec h3{font-size:15px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.prd-sec h3::before{content:'';width:3px;height:14px;background:var(--ant-primary);border-radius:2px}
.prd-body-txt{font-size:14px;line-height:1.8;color:var(--ant-text);outline:none;border-radius:var(--ant-radius);
  padding:8px 10px;margin:-8px -10px;transition:.15s;white-space:pre-wrap;word-break:break-word}
.prd-body-txt:hover{background:#fafafa}
.prd-body-txt:focus{background:#fff;box-shadow:0 0 0 2px var(--ant-primary-bg)}
.prd-body-txt ul,.prd-body-txt ol{margin:4px 0;padding-left:22px}
/* PRD 正文里的 markdown 表格与行内代码（评审时比一串竖线好读） */
.prd-body-txt .prd-md-table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0;white-space:normal}
.prd-body-txt .prd-md-table th,.prd-body-txt .prd-md-table td{border:1px solid var(--ant-border-2);
  padding:6px 9px;text-align:left;vertical-align:top;white-space:normal}
.prd-body-txt .prd-md-table th{background:#fafafa;font-weight:600}
.prd-body-txt code{background:#f5f5f5;border:1px solid var(--ant-border-2);border-radius:3px;
  padding:0 4px;font-size:12.5px;white-space:nowrap}
.prd-req-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.prd-req-table th{text-align:left;padding:8px 10px;background:#fafafa;border:1px solid var(--ant-border-2);font-weight:600;white-space:nowrap}
.prd-req-table td{padding:8px 10px;border:1px solid var(--ant-border-2);vertical-align:top}
.prd-req-table td.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ant-primary);white-space:nowrap}
.prd-anno{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--ant-border-2);border-radius:var(--ant-radius-lg);margin-bottom:8px;background:#fff}
.prd-anno .n{width:20px;height:20px;border-radius:50%;background:var(--ant-warning);color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:600}
.prd-anno.resolved .n{background:var(--ant-success)}
.prd-anno.rejected .n{background:#bfbfbf}
.prd-anno .c{flex:1;font-size:13px}
.prd-anno .c .r{color:var(--ant-text-3);font-size:12px;margin-top:4px;padding-left:8px;border-left:2px solid var(--ant-border-2)}
.prd-empty{color:var(--ant-text-3);font-size:13px;padding:12px;background:#fafafa;border-radius:var(--ant-radius-lg);text-align:center}

/* ============ Annotation popover ============ */
.anno-pop{position:absolute;z-index:60;width:290px;background:#fff;border-radius:var(--ant-radius-lg);
  box-shadow:var(--ant-shadow-2);padding:12px;pointer-events:auto;font-size:13px}
.anno-pop textarea{width:100%;min-height:70px;border:1px solid var(--ant-border);border-radius:var(--ant-radius);
  padding:7px 9px;font-size:13px;font-family:inherit;resize:vertical;outline:none}
.anno-pop textarea:focus{border-color:var(--ant-primary)}
.anno-pop .ap-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.anno-pop .ap-cat{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--ant-fill);color:var(--ant-text-3);cursor:pointer}
.anno-pop .ap-cat.on{background:var(--ant-primary-bg);color:var(--ant-primary)}
.anno-pop .ap-anchor{font-size:11px;color:var(--ant-text-3);margin-bottom:6px;font-family:ui-monospace,monospace}
.anno-pop .ap-replies{margin-top:8px;border-top:1px solid var(--ant-border-2);padding-top:8px;max-height:120px;overflow:auto}
.anno-pop .ap-reply{font-size:12px;color:var(--ant-text-2);margin-bottom:6px;padding-left:8px;border-left:2px solid var(--ant-border-2)}

/* ============ Toast / Drawer / Canvas overlay ============ */
.toast-wrap{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#fff;border-radius:var(--ant-radius-lg);box-shadow:var(--ant-shadow-2);padding:9px 16px;font-size:14px;
  display:flex;gap:8px;align-items:center;animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.toast.success{color:#389e0d}.toast.error{color:#cf1322}.toast.warning{color:#d48806}.toast.info{color:#0958d9}

.side-drawer{position:fixed;inset:0;z-index:150;display:none}
.side-drawer.on{display:block}
.side-drawer .sd-mask{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.side-drawer .sd-panel{position:absolute;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:#fff;
  box-shadow:var(--ant-shadow-2);display:flex;flex-direction:column}
.side-drawer .sd-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--ant-border-2);font-weight:600}
.side-drawer .sd-body{flex:1;overflow:auto;padding:16px 18px}
.sd-item{border:1px solid var(--ant-border-2);border-radius:var(--ant-radius-lg);padding:12px 14px;margin-bottom:10px}
.sd-item .sd-t{font-weight:600;font-size:13px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.sd-item .sd-x{font-size:13px;color:var(--ant-text-2);line-height:1.7;white-space:pre-wrap}

/* ============ 全局画布：页面关系图 ============ */
.canvas-overlay{position:fixed;inset:0;z-index:150;background:#f0f2f5;display:none;flex-direction:column}
.canvas-overlay.on{display:flex}
.co-head{display:flex;align-items:center;gap:10px;padding:9px 18px;background:#fff;border-bottom:1px solid var(--ant-border-2);flex:0 0 auto;flex-wrap:wrap}
.co-head .t{font-weight:700;font-size:14px}
.co-head .sub{color:var(--ant-text-3);font-size:12px}
.co-head .sp{flex:1}
.co-seg{display:inline-flex;border:1px solid var(--ant-border);border-radius:var(--ant-radius);overflow:hidden}
.co-seg button{height:28px;padding:0 10px;border:0;background:#fff;color:var(--ant-text-2);font-size:12px;
  font-family:inherit;cursor:pointer;border-right:1px solid var(--ant-border)}
.co-seg button:last-child{border-right:0}
.co-seg button.on{background:var(--ant-primary-bg);color:var(--ant-primary);font-weight:600}
.co-scroll{flex:1 1 auto;overflow:auto;position:relative;
  background-image:radial-gradient(circle,#d5dae2 1px,transparent 1px);background-size:22px 22px}
/* 两层结构：
   #coInner = 内容盒（未缩放尺寸，卡片与 SVG 都在这一层，缩放只走它的 transform）
   #coWorld = 缩放盒（尺寸 = 内容盒 × zoom），margin:auto 让它在视口里精确居中，
             同时它的尺寸就是滚动范围 —— 缩放后滚动条范围与实际内容严格一致 */
.co-world{position:relative;transform-origin:0 0;margin:auto}
.co-inner{position:relative;transform-origin:0 0}
.co-svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.co-edge{fill:none;stroke:#98a2b3;stroke-width:1.6}
.co-edge.back{stroke-dasharray:5 4}
.co-edge.hl{stroke:var(--ant-primary);stroke-width:2.4}
.co-edge-hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.co-elabel{font-size:11px;fill:var(--ant-text-2);font-family:inherit;text-anchor:middle;dominant-baseline:middle}
.co-elabel-bg{fill:#fff;stroke:var(--ant-border-2);rx:4}
.co-node{position:absolute;width:236px;background:#fff;border-radius:8px;border:1.5px solid transparent;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px -2px rgba(0,0,0,.09);overflow:hidden;cursor:grab;
  transition:box-shadow .15s,border-color .15s}
.co-node:hover{box-shadow:0 6px 18px rgba(0,0,0,.13)}
.co-node.dragging{cursor:grabbing;box-shadow:0 14px 30px rgba(0,0,0,.22);z-index:6}
/* 注意：这里用 co-cur 而不是 sel —— `.sel` 是顶栏 <select> 的类名
   （.sel{height:30px;max-width:190px}），同优先级下会把卡片压成 190×30。 */
.co-node.co-cur{border-color:var(--ant-primary)}
.co-node .cn-head{padding:7px 10px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  border-bottom:1px solid var(--ant-border-2);background:#fafafa}
.co-node .cn-head .rt{margin-left:auto;font-weight:400;color:var(--ant-text-4);font-size:10.5px;
  font-family:ui-monospace,Menlo,monospace;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co-node .cn-shot{height:148px;overflow:hidden;position:relative;background:#fff}
.co-node .cn-inner{width:1280px;transform:scale(.184);transform-origin:top left;pointer-events:none}
.co-node .cn-foot{padding:5px 10px;border-top:1px solid var(--ant-border-2);font-size:10.5px;color:var(--ant-text-4);
  display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.co-node .cn-badge{background:var(--ant-fill);border-radius:3px;padding:0 5px;height:15px;line-height:15px;white-space:nowrap}
.co-node .cn-badge.blue{background:var(--ant-primary-bg);color:var(--ant-primary)}
.co-node .cn-badge.warn{background:#fffbe6;color:#d48806}
.co-legend{position:absolute;left:16px;bottom:16px;background:rgba(255,255,255,.97);border:1px solid var(--ant-border-2);
  border-radius:8px;padding:9px 13px;font-size:11.5px;color:var(--ant-text-2);line-height:2;box-shadow:var(--ant-shadow-1);z-index:4}
.co-legend .k{display:inline-block;width:26px;border-top:2px solid #98a2b3;vertical-align:middle;margin-right:7px}
.co-legend .k.dash{border-top-style:dashed}
.co-legend .k.hl{border-top-color:var(--ant-primary);border-top-width:3px}
.co-hint{position:absolute;right:16px;bottom:16px;background:rgba(255,255,255,.97);border:1px solid var(--ant-border-2);
  border-radius:8px;padding:8px 13px;font-size:11.5px;color:var(--ant-text-3);line-height:1.9;z-index:4;max-width:280px}
.co-empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--ant-text-3);font-size:13px;text-align:center}

/* ============ PRD 内嵌流程图 ============ */
.flow-diagram{margin:10px 0 4px;padding:12px;background:#fafafa;border:1px solid var(--ant-border-2);
  border-radius:var(--ant-radius-lg);overflow:auto}
.flow-diagram svg{display:block;margin:0 auto}
.fd-node rect{fill:#fff;stroke:var(--ant-border);stroke-width:1.2;rx:6}
.fd-node.start rect{stroke:var(--ant-primary);stroke-width:1.6}
.fd-node.end rect{stroke:var(--ant-success);stroke-width:1.6}
.fd-node.decision rect{fill:#fffbe6;stroke:var(--ant-warning)}
.fd-node.warn rect{stroke:var(--ant-error)}
.fd-node .lbl{font-size:12px;fill:var(--ant-text);font-family:inherit;text-anchor:middle;dominant-baseline:middle}
.fd-node .sub{font-size:10.5px;fill:var(--ant-text-4);font-family:inherit;text-anchor:middle;dominant-baseline:middle}
.fd-edge{fill:none;stroke:#98a2b3;stroke-width:1.4}
.fd-edge.back{stroke-dasharray:5 4}
.fd-edge.hl{stroke:var(--ant-primary);stroke-width:2}
.fd-elabel{font-size:10.5px;fill:var(--ant-text-3);font-family:inherit;text-anchor:middle;dominant-baseline:middle}
.fd-elabel-bg{fill:#fafafa;stroke:var(--ant-border-2);rx:3}
/* 流程图保持「原尺寸」：比 PRD 栏宽就横向滚动，而不是缩到看不清；
   要整体看清时点「放大」走全屏浮层（.flow-zoom） */
.prd-flow-bar{display:flex;align-items:center;gap:8px;margin-top:8px}
.prd-flow-cap{font-size:11.5px;color:var(--ant-text-4);flex:1 1 auto;text-align:center}
.flow-diagram svg{max-width:none;height:auto}
.flow-zoom{position:fixed;inset:0;z-index:160;background:rgba(0,0,0,.45);display:none;flex-direction:column}
.flow-zoom.on{display:flex}
.flow-zoom .fz-head{display:flex;align-items:center;gap:10px;padding:10px 18px;background:#fff;
  border-bottom:1px solid var(--ant-border-2);flex:0 0 auto}
.flow-zoom .fz-head b{font-size:14px}
.flow-zoom .fz-head .sp{flex:1}
.flow-zoom .fz-body{flex:1 1 auto;overflow:auto;display:flex;align-items:center;justify-content:center;padding:26px}
.flow-zoom .fz-body svg{background:#fff;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:none}

/* ============ 数据模型（dataModel）============ */
.dm-entity{border:1px solid var(--ant-border-2);border-radius:6px;padding:10px 12px;margin-top:10px;background:#fff}
.dm-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dm-head b{font-size:13.5px}
.dm-desc{font-size:12.5px;color:var(--ant-text-3);margin-top:3px}
.dm-rel{font-size:11.5px;color:var(--ant-text-3);margin-top:5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.dm-table{margin-top:8px}
.dm-table th,.dm-table td{padding:5px 8px;font-size:12px;word-break:break-word}
.dm-table td.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}

/* ============ 开发交接抽屉 ============ */
.dk-sec{margin-bottom:16px}
.dk-sec h4{margin:0 0 6px;font-size:13px}
.dk-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dk-code{width:100%;min-height:150px;border:1px solid var(--ant-border);border-radius:var(--ant-radius);
  padding:9px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.55;
  color:var(--ant-text);background:#fafafa;resize:vertical;outline:none}
.dk-note{font-size:12px;color:var(--ant-text-3);line-height:1.6}

/* ============ PRD 面板折叠 ============ */
.workspace.prd-collapsed #splitter{display:none}
.pane-prd.collapsed{flex:0 0 0 !important;width:0 !important;min-width:0;overflow:hidden;border-left:0}
.prd-restore{display:none;position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:8;
  background:var(--ant-primary);color:#fff;border:0;border-radius:6px 0 0 6px;padding:16px 5px;cursor:pointer;
  writing-mode:vertical-rl;font-size:12px;font-family:inherit;letter-spacing:3px;box-shadow:var(--ant-shadow-2)}
.prd-restore:hover{background:var(--ant-primary-hover)}
.workspace.prd-collapsed .prd-restore{display:block}
.sd-none{color:var(--ant-text-3);font-size:13px;text-align:center;padding:30px 0}
</style>
</head>

/* ---------- 安全表达式求值 ----------
   仅支持：变量/属性路径、数字与字符串字面量、true/false/null、
   比较（=== !== == != > < >= <=）、逻辑（&& || !）、括号。
   不使用 eval / new Function，杜绝动态代码执行。 */
function tokenizeExpr(s){
  var out=[], re=/\s*(===|!==|==|!=|>=|<=|&&|\|\||[()!<>]|[A-Za-z_$][\w$.]*|-?\d+(?:\.\d+)?|'[^']*'|"[^"]*")/g, m, last=0;
  while((m=re.exec(s))!==null){

    out.push(m[1]); last=re.lastIndex;

}
function parseAtom(t,p,vars){
  var tk=t[p.i];
  if(tk===undefined) throw new Error('unexpected end');
  if(tk==='('){ p.i++; var v=parseOr(t,p,vars); if(t[p.i]!==')') throw new Error('missing )'); p.i++; return v; }
  p.i++;
  if(tk.charAt(0)==="'"||tk.charAt(0)==='"') return tk.slice(1,-1);
  if(tk==='true') return true;
  if(tk==='false') return false;
  if(tk==='null') return null;
  if(/^-?\d/.test(tk)) return Number(tk);
  return tk.split('.').reduce(function(a,k){ return a==null?undefined:a[k]; }, vars);
}
function parseCmp(t,p,vars){
  var l=parseAtom(t,p,vars), op=t[p.i];
  if(op==='==='||op==='!=='||op==='=='||op==='!='||op==='>'||op==='<'||op==='>='||op==='<='){
    p.i++; var r=parseAtom(t,p,vars);
    if(op==='===') return l===r;
    if(op==='!==') return l!==r;
    if(op==='==') return l==r;
    if(op==='!=') return l!=r;
    if(op==='>') return l>r;
    if(op==='<') return l<r;

}
function parseNot(t,p,vars){ if(t[p.i]==='!'){ p.i++; return !parseNot(t,p,vars); } return parseCmp(t,p,vars); }

function parseOr(t,p,vars){ var l=parseAnd(t,p,vars); while(t[p.i]==='||'){ p.i++; var r=parseAnd(t,p,vars); l=l||r; } return l; }
/* 求「值」（保留原始类型）：插值 {{expr}} 需要拿到字符串/数字本身，不能只拿真假 */
function evalValue(expr,vars){

  var v=parseOr(toks,pos,vars);
  if(pos.i!==toks.length) throw new Error('trailing token');
  return v;
}
/* 求「真假」：用于 when / conditions 这类条件判断 */
function evalExpr(expr,vars){
  if(expr==null||expr==='') return true;
  try{ return !!evalValue(expr,vars); }
  catch(e){ warn('条件表达式求值失败，已按 true 处理：'+expr); return true; }
}
function getPath(o,p){ return p.split('.').reduce(function(a,k){ return a==null?undefined:a[k]; },o); }
function subst(v,item,idx){
  if(typeof v!=='string') return v;
  return v.replace(/\{\{\s*item\.([\w.]+)\s*\}\}/g,function(m,k){ var x=getPath(item,k); return x==null?'':String(x); })
          .replace(/\{\{\s*item\s*\}\}/g, typeof item==='object'?JSON.stringify(item):String(item))
          .replace(/\{\{\s*index\s*\}\}/g, String(idx));
}
function cloneTpl(tpl,item,idx){
  var n=deep(tpl);
  (function walk(x){ if(!x||typeof x!=='object')return;
    x.id=(x.id||'tpl')+'-'+idx+'-'+(++uid);
    if(x.props) for(var k in x.props) x.props[k]=subst(x.props[k],item,idx);
    if(x.children) x.children.forEach(walk);
    if(x.slots) for(var s in x.slots) x.slots[s].forEach(walk);
  })(n);
  return n;
}

  if(attrs && (Array.isArray(attrs) || attrs.nodeType===1) && ch===undefined){ ch=attrs; attrs=null; }
  if(attrs) for(var k in attrs){ var v=attrs[k]; if(v==null||v===false) continue;
    if(k==='style') e.setAttribute('style',v);
    else if(k==='text') e.textContent=v;
    else if(k==='html') e.innerHTML=v;
    else e.setAttribute(k,v); }
  if(ch!=null){ (Array.isArray(ch)?ch:[ch]).forEach(function(c){ if(c==null||c===false) return;
    e.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c); }); }

}

var STATUS_MAP={'待办':'default','未开始':'default','草稿':'default','进行中':'processing','处理中':'processing','审核中':'processing',

/* =====================================================================

   ===================================================================== */
function renderChildren(node,ctx){ var out=[]; (node.children||[]).forEach(function(c){ var e=renderNode(c,ctx); if(e) out.push(e); }); return out; }
function renderSlot(node,name,ctx){ var s=node.slots&&node.slots[name]; if(!s) return null;
  return s.map(function(c){return renderNode(c,ctx)}).filter(Boolean); }
function slotFirst(node,name,ctx){ var a=renderSlot(node,name,ctx); return a&&a.length?a[0]:null; }

/* ---------- 文本插值 {{expr}} ----------
   让 navigate 的 params（写入 RT.vars）能在目标页上被看见，而不只是控制 when。
   对渲染结果做一次后置遍历：替换所有文本节点，以及 title/placeholder 属性。 */
function interp(str,vars){
  if(typeof str!=='string'||str.indexOf('{{')<0) return str;
  return str.replace(/\{\{([^{}]+)\}\}/g,function(m,e){
    /* 求不出来时保留原文，让配置错误「看得见」而不是静默变成空白 */
    try{ var v=evalValue(e.trim(),vars); return v==null?m:String(v); }
    catch(err){ return m; }
  });
}
function applyInterp(el,vars){
  if(!HAS_INTERP||!el||el.nodeType!==1||!vars) return el;
  var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null,false), n, list=[];
  while((n=w.nextNode())) list.push(n);
  list.forEach(function(t){ var v=interp(t.nodeValue,vars); if(v!==t.nodeValue) t.nodeValue=v; });
  ['title','placeholder'].forEach(function(a){
    if(el.hasAttribute(a)){ var v=interp(el.getAttribute(a),vars); if(v!==el.getAttribute(a)) el.setAttribute(a,v); }
  });
  return el;
}
/* navigate 的 params 在「源页」求值后再写进 RT.vars。
   若留到目标页求值，会先被目标页 states[].vars 的默认值覆盖，{{expr}} 就取不到源页上下文。 */
function interpParams(params,scope){
  if(!params||typeof params!=='object') return params;
  var out={}, sc=scope||RT.vars;
  for(var k in params){ out[k]=typeof params[k]==='string'?interp(params[k],sc):params[k]; }
  return out;
}
/* 点击上下文：点「表格行 / 行内操作按钮」时把该行数据并入求值作用域。
   这样一条 interaction 就能服务所有行，params 可写 {{row.title}}，无需逐行硬编码。 */
function rowScopeFor(el){
  var row=el&&(el.__iprdRow||(el.parentNode&&el.parentNode.__iprdRow));
  if(!row||typeof row!=='object') return RT.vars;
  var sc={}; for(var k in RT.vars) sc[k]=RT.vars[k];
  sc.row=row;
  for(var k2 in row){ if(!(k2 in sc)) sc[k2]=row[k2]; }
  return sc;
}

function renderNode(node,ctx){
  if(!node||!node.type) return null;
  if(node.when && !evalExpr(node.when,ctx.vars)) return null;
  if(ctx.hidden && ctx.hidden[node.id]) return null;
  if(ctx.visible && ctx.visible.size && !ctx.visible.has(node.id)) return null;
  var ov=(ctx.overrides&&ctx.overrides[node.id])||{};
  var props={}; for(var k in (node.props||{})) props[k]=node.props[k]; for(var k2 in ov) props[k2]=ov[k2];
  var st=ov.state||node.state||'normal';
  var fn=R[node.type], el;
  if(!fn){ warn('未知组件类型: '+node.type); el=h('div','ant-unknown',null,[h('span','ant-unknown-tag',{text:node.type})]);
    var body=h('div','ant-unknown-body'); renderChildren(node,ctx).forEach(function(c){body.appendChild(c)}); el.appendChild(body); }
  else{ try{ el=fn(props,ctx,node); }catch(err){ warn('渲染失败 '+node.type+': '+err.message); el=h('div','ant-unknown',null,node.type); } }
  if(!el) el=h('span');
  if(el.nodeType===1){ el.setAttribute('data-node-id',node.id);
    if(st&&st!=='normal') el.classList.add('st-'+st);
    if(props.visible===false) el.style.display='none';
    if(props.visible===true && el.style.display==='none') el.style.display='';
  }
  return applyInterp(el,ctx.vars);
}

/* --- layout --- */
R.Layout=function(p,ctx,node){
  var lay=p.layout||'blank';
  var wrap=h('div','ant-layout');
  if(lay==='header-sider-content'||lay==='sider-content'){
    var top=null, row=h('div','ant-layout h',{style:'flex:1'});
    renderChildren(node,ctx).forEach(function(c){
      var cls=c.className||'';
      if(cls.indexOf('ant-header')>=0){ if(!top) top=h('div','ant-layout'); top.appendChild(c); }
      else if(cls.indexOf('ant-footer')>=0){ wrap.appendChild(c); }
      else row.appendChild(c);
    });
    if(top) wrap.insertBefore(top,wrap.firstChild);
    wrap.appendChild(row);
  } else if(lay==='header-content'){
    renderChildren(node,ctx).forEach(function(c){ wrap.appendChild(c); });
  } else { wrap.style.padding='0'; renderChildren(node,ctx).forEach(function(c){ wrap.appendChild(c); }); }
  return wrap;
};
R.Header=function(p,ctx,node){

    var bw=h('span','h-back',{title:'返回上一页'},[icon('arrow-left',16)]);
    if(node&&node.id) bw.setAttribute('data-node-id',node.id+'__back');
    kids.push(bw);
  }
  if(p.logo) kids.push(h('span','h-logo'));
  kids.push(h('span','h-title',{text:p.title||''}));
  var ex=renderSlot(node,'extra',ctx); if(ex) kids.push(h('div','h-extra',null,ex));
  return h('div','ant-header',null,kids);
};
R.Sider=function(p,ctx,node){
  var s=h('div','ant-sider',{style:'width:'+((p.width||200))+'px'});
  if(p.title) s.appendChild(h('div','h-title',{style:'color:#fff;padding:8px 16px',text:p.title}));
  renderChildren(node,ctx).forEach(function(c){ s.appendChild(c); });
  return s;
};
R.Content=function(p,ctx,node){ return h('div','ant-content',null,renderChildren(node,ctx)); };
R.Footer=function(p,ctx,node){ return h('div','ant-footer',{text:p.text||''}); };
R.Row=function(p,ctx,node){
  var g=(p.gutter||0);
  /* gutter 写在 Row 上、栅格间距由 Col 承担（AntD 的约定）。Col 自己读不到 p.gutter，
     所以在这里把父级 gutter 挂到子节点上，由 R.Col 回退取用 —— 否则 Col 算的是
     `calc(50% - 0px)`，一行两列各自 50% 再叠上 Row 的 gap，实测溢出 254.75px（I-07 T-1）。 */
  (node&&node.children||[]).forEach(function(c){
    if(c&&typeof c==='object'){ c.__parentGutter=g; }
  });
  var r=h('div','ant-row',{style:'gap:'+g+'px;justify-content:'+(p.justify||'flex-start')+';align-items:'+(p.align||'stretch')});
  renderChildren(node,ctx).forEach(function(c){ r.appendChild(c); });
  return r;
};
R.Col=function(p,ctx,node){
  var g=(p.gutter!=null)?p.gutter:((node&&node.__parentGutter)||0);
  var w=((p.span||24)/24*100);
  return h('div','ant-col',{style:'flex:0 0 calc('+w+'% - '+g+'px);max-width:calc('+w+'% - '+g+'px)'},renderChildren(node,ctx));
};
R.Space=function(p,ctx,node){
  var d=p.direction==='vertical';
  var st='gap:'+((p.size==null?8:p.size))+'px;align-items:'+(p.align||'center');
  /* justify / block：标题带需要「h1 + 计数在左、主操作在右」同一行。
     没有这两个键就只能靠嵌套加占位 div，或者退化成「主操作自己占一行」——
     后者正是表格被推到 476px 的原因之一（I-07 C1b）。 */
  if(p.justify) st+=';justify-content:'+p.justify;
  if(p.block) st+=';width:100%';
  var s=h('div','ant-space'+(d?' v':'')+(p.wrap?' wrap':''),{style:st});
  renderChildren(node,ctx).forEach(function(c){ s.appendChild(c); });
  return s;
};
R.Divider=function(p,ctx,node){
  var cls='ant-divider'+(p.dashed?' dashed':'')+(p.plain?' plain':'');
  if(!p.text&&!p.plain) cls+=' plain';
  return h('div',cls,null,p.text?txt(p.text):null);
};

/* --- navigation --- */

/* 操作列默认按钮；声明 col.actions 可自定义 key/label */
function actionDefs(col){
  var d=col.actions;
  if(Array.isArray(d)&&d.length) return d.filter(function(x){return x&&x.key;});
  return [{key:'edit',label:'编辑'},{key:'delete',label:'删除',type:'danger'}];
}
/* nid/ri 用于给「行」与「操作按钮」生成合成节点 id，供 interactions 精确寻址 */
function cellContent(col,row,nid,ri){
  var v=row[col.dataIndex];
  if(col.type==='index'){ return [txt(String((col.start==null?1:col.start)+ri))]; }
  if(col.type==='tag'){ return [h('span','ant-tag '+statusColor(v),{text:v==null?'':String(v)})]; }
  if(col.type==='avatar'){ return [h('span','ant-badge-wrap',null,[h('span','ant-avatar sm',{text:String(v||'?').slice(0,1)}),txt(v==null?'':String(v))])]; }
  if(col.type==='action'){
    /* 行内动作的间距走 CSS（原来写死 inline `gap:10px`，inline 会盖掉密集档的 6px，
       结果是 866 档操作列里两个动作必折行、行高从 34 跳到 63）。 */
    var box=h('span','ant-td-action');
    actionDefs(col).forEach(function(a){
      var color=a.type==='danger'?'var(--ant-error)':(a.type==='muted'?'var(--ant-text-3)':'var(--ant-primary)');
      var s=h('span',null,{text:a.label||a.key,style:'color:'+color,title:(a.label||a.key)});
      if(nid&&ri!=null) s.setAttribute('data-node-id',nid+'__act_'+ri+'_'+a.key);
      s.__iprdRow=row;                       /* 行上下文：让 params 能用 {{row.title}} 之类的写法 */
      /* 行内动作同样受命令策略约束：状态不允许时置灰/隐藏，而不是照样可点 */
      if(a.capability){
        var cap=capById(a.capability);
        if(cap){
          var cr=capEval(cap,row);
          if(!cr.ok&&cr.policy==='hidden') return;
          s.setAttribute('data-capability',cap.id);
          s.setAttribute('data-cap-state',cr.ok?'on':'off');
          if(!cr.ok){
            s.setAttribute('data-cap-policy',cr.policy);
            s.setAttribute('title',cr.reason);
            if(cr.policy==='reject') s.style.color='var(--ant-warning)';
            else { s.classList.add('cap-blocked'); s.style.color='var(--ant-text-4)'; }
          }
        }
      }
      box.appendChild(s);
    });
    return [box];
  }
  if(col.type==='progress'){ var pc=Number(v)||0; var pr=h('div','ant-progress'); var t=h('div','track'); t.appendChild(h('div','bar',{style:'width:'+pc+'%'})); pr.appendChild(t); pr.appendChild(h('span',null,{text:pc+'%'})); return [pr]; }
  return [txt(v==null?'—':String(v))];
}
/* ---------- 列表页「三件套」：查询条 / 工具条 / 分页脚 ----------
   把 B2B 列表页的标配内建进 Table，让原型看起来就是一张真实列表页，
   而不是孤零零一张表。三者都只在声明了对应 props 时才渲染，不影响既有写法。 */
function renderQueryField(q,ctx,i){
  var tn=q.type||'Input', fn=R[tn];
  if(!fn) return h('span','ph',{text:'未知字段类型 '+tn});
  var pp={placeholder:q.placeholder||('请输入'+(q.label||''))};
  for(var k in (q.props||{})) pp[k]=q.props[k];
  try{ return fn(pp,ctx,{id:'q-'+i,type:tn,props:pp}); }
  catch(e){ warn('查询字段渲染失败 '+tn+': '+e.message); return h('span'); }
}
function buildQueryBar(p,ctx){
  var bar=h('div','ant-query-bar');
  (p.query||[]).forEach(function(q,i){
    var f=h('div','qf');
    if(q.label) f.appendChild(h('span','qf-label',{text:q.label}));
    f.appendChild(h('div','qf-ctl',null,renderQueryField(q,ctx,i)));
    bar.appendChild(f);
  });
  var ex=h('div','qf-extra');
  if(p.queryExtra!==false){
    ex.appendChild(h('span','qf-link',{text:'设置查询字段'}));
    var sb=h('button','ant-btn primary',{type:'button'});
    sb.appendChild(icon('search',14)); sb.appendChild(txt('搜索'));
    ex.appendChild(sb);
    ex.appendChild(h('span','qf-link',{text:'展开 ⌄'}));
  }
  (p.queryActions||[]).forEach(function(a){
    var b=h('button','ant-btn'+(a.type?' '+a.type:''),{type:'button'});
    if(a.icon) b.appendChild(icon(a.icon,14));
    if(a.text) b.appendChild(txt(a.text));
    if(a.id) b.setAttribute('data-node-id',a.id);
    ex.appendChild(b);
  });
  bar.appendChild(ex);
  return bar;

/* 两行三列筛选区（I-07 §4.2 / D6）。结构固定 3 列栅格 + 独立动作行：
   .ant-filter-bar > .fb-grid > .fb-field×N（label 76 右对齐 + 控件）
                  > .fb-actions  重置 → 查询(primary) → ⌃收起
   字段 4–6 个自然成 2 行；≤3 个成 1 行（不强行凑 6 个）。
   `收起` 只折第 4 个起的字段 —— 折的是「不常改的条件」，不是把区整个藏掉。 */
function buildFilterBar(p,ctx){
  var fields=p.query||[];
  var bar=h('div','ant-filter-bar');
  var grid=h('div','fb-grid');
  fields.forEach(function(q,i){
    var f=h('div','fb-field'+(i>=3?' more':''));
    f.appendChild(h('span','lb',{text:(q.label||'')+(q.label?'：':'')}));
    f.appendChild(h('div','ctl',null,renderQueryField(q,ctx,i)));
    grid.appendChild(f);
  });
  bar.appendChild(grid);
  var act=h('div','fb-actions');
  var rb=h('button','ant-btn',{type:'button'});
  rb.appendChild(txt('重置'));
  if(p.resetId) rb.setAttribute('data-node-id',p.resetId);
  act.appendChild(rb);
  var qb=h('button','ant-btn primary',{type:'button'});
  qb.appendChild(icon('search',14)); qb.appendChild(txt('查询'));
  if(p.queryId) qb.setAttribute('data-node-id',p.queryId);
  act.appendChild(qb);
  if(fields.length>3){
    var tg=h('button','ant-btn link fb-toggle',{type:'button'});
    tg.appendChild(txt('收起'));
    tg.onclick=function(){
      var on=bar.classList.toggle('collapsed');
      tg.textContent=on?'展开':'收起';
    };
    act.appendChild(tg);
  }
  bar.appendChild(act);
  return bar;
}
function buildListToolbar(p,ctx,node){

    if(it&&it.type&&R[it.type]){

      var e=renderNode(n,ctx); if(e) bar.appendChild(e); return;

function buildTableFoot(p,ctx){
  var pg=(p.pagination===true)?{}:p.pagination;
  var total=(pg.total==null)?((p.data||[]).length):pg.total;
  var ps=pg.pageSize||10, pages=Math.max(1,Math.ceil(total/ps)), cur=pg.current||1;
  var foot=h('div','ant-table-foot');
  foot.appendChild(h('span',null,{text:'共 '+total+' 条'}));
  var sz=h('span','tf-size'); sz.appendChild(txt('每页显示'));
  var ss=h('span','ant-select',{style:'width:96px'});
  ss.appendChild(txt(ps+' 条/页')); ss.appendChild(h('span','caret',{text:'▾'}));
  sz.appendChild(ss); foot.appendChild(sz);
  var el=h('div','ant-pagination');
  el.appendChild(h('span','pg',{text:'‹'}));
  var maxShow=pg.maxShow||5;
  var start=Math.max(1,Math.min(cur-Math.floor(maxShow/2),pages-maxShow+1));
  for(var i=start;i<=Math.min(pages,start+maxShow-1);i++) el.appendChild(h('span','pg'+(i===cur?' sel':''),{text:String(i)}));
  if(pages>start+maxShow-1){ el.appendChild(h('span','pg',{text:'…'})); el.appendChild(h('span','pg',{text:String(pages)})); }
  el.appendChild(h('span','pg',{text:'›'}));
  if(pg.jump){
    el.appendChild(h('span',null,{style:'margin-left:8px;color:var(--ant-text-3)',text:'跳转至'}));
    el.appendChild(h('span','ant-input',{style:'width:64px;height:28px;display:inline-flex;margin:0 6px'},txt(String(cur))));
    el.appendChild(h('span','pg',{text:'前往'}));
  }
