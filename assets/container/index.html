  return foot;
}

/* 列级修饰：省略号 / 左右固定 / 数值右对齐（I-07 D3/D5/D9）。
   语义写在 props.columns 上，不写全局 CSS —— 全局 `td{text-overflow:ellipsis}` 会让
   28 列里只有 1 列真溢出（C7），其余 27 处是装饰，而真正的溢出列反而看不出来。 */
function colClass(c){
  var s=[];
  if(c.ellipsis) s.push('cell-ellipsis');
  if(c.fix==='left') s.push('col-fix-l');
  if(c.fix==='right') s.push('col-fix-r');
  if(c.align==='right'||c.num) s.push('num');
  return s.join(' ');
}
/* 列宽写进 DOM 时**必须带单位**。
   反面教材（I-07 §3.8 头号缺陷）：`style:'width:'+c.width` 生成 `width:48`，
   这是非法 CSS，浏览器整条声明丢弃 → table-layout:fixed 把 8 列均分
   （866÷8 = 108.25px），声明的 48 / 188 / 125 一列都没生效。
   更坏的是它**看不出来**：P7 读 JSON 声明率、P17 只比 scrollWidth，两条判据同时绿。
   数值补 px；已经带单位的字符串（'20%' / '120px'）原样保留。 */
function colWidthStyle(c){
  var w=c.width;
  if(w===null||w===undefined||w==='') return null;
  var s=String(w).trim();
  if(!s) return null;
  return /^[0-9.]+$/.test(s) ? ('width:'+s+'px') : ('width:'+s);
}

R.Table=function(p,ctx,node){
  var cols=p.columns||[], nid=node&&node.id?node.id:null;
  var sizeCls=(p.size==='xs')?' xs':((p.size==='small')?' sm':'');
  var fixed=!!(p.tableLayout==='fixed'||p.fixed);
  var wrapAttrs=(p.stickyHeader&&p.maxHeight)?{style:'--tw-max:'+p.maxHeight}:null;
  var wrap=h('div','ant-table-wrap'+(p.stickyHeader?' sticky':''),wrapAttrs);
  var t=h('table','ant-table'+(p.bordered?' bordered':'')+sizeCls+(fixed?' fixed':''));
  var thead=h('thead'), tr=h('tr');
  if(p.radio) tr.appendChild(h('th','ant-th-radio',null,[h('span','ant-radio-dot')]));
  if(p.rowSelection) tr.appendChild(h('th','ant-th-check',null,[h('span','ant-checkbox')]));
  cols.forEach(function(c){ tr.appendChild(h('th',colClass(c),{text:c.title,style:colWidthStyle(c)})); });
  thead.appendChild(tr); t.appendChild(thead);
  var tbody=h('tbody');
  if(p.loading){ for(var i=0;i<4;i++){ var r=h('tr'); if(p.radio) r.appendChild(h('td','ant-td-radio',null,h('div','ant-skel-line')));
      if(p.rowSelection) r.appendChild(h('td',null,null,h('div','ant-skel-line')));
      cols.forEach(function(){ r.appendChild(h('td',null,null,h('div','ant-skel-line'))); }); tbody.appendChild(r); } }
  else if(!p.data||!p.data.length||p.empty){
    var span=cols.length+(p.rowSelection?1:0)+(p.radio?1:0);
    var td=h('td',null,{colspan:span});
    /* 空态与零结果是两件事：一件是「还没有数据」，一件是「筛掉了」。
       文案与动作必须不同，否则用户不知道是该去新建，还是该去清空筛选（I-07 §4 / S11）。 */
    var empty=h('div','ant-empty-inline',null,[icon('file',26),
      h('span',null,{text:p.emptyText||(p.query&&p.query.length?'没有符合条件的记录，试试清空筛选':'暂无数据')})]);
    td.appendChild(empty);
    if(p.emptyAction){
      var ea=h('div',null,{style:'margin-top:8px'});
      var eb=h('button','ant-btn'+(p.emptyAction.type?' '+p.emptyAction.type:''),{type:'button'});
      if(p.emptyAction.icon) eb.appendChild(icon(p.emptyAction.icon,14));
      eb.appendChild(txt(p.emptyAction.text||''));
      if(p.emptyAction.id) eb.setAttribute('data-node-id',p.emptyAction.id);
      ea.appendChild(eb); td.appendChild(ea);
    }
    tbody.appendChild(h('tr',null,null,td));
  } else {
    p.data.forEach(function(row,ri){
      var r=h('tr');
      /* 行可点需显式开启：否则会抢走「整张表」的点击目标，破坏既有 interactions */
      if(nid&&p.rowClick){ r.setAttribute('data-node-id',nid+'__row_'+ri); r.className='row-click'; r.title='点击查看详情'; }
      r.__iprdRow=row;                       /* 行上下文（同上） */
      if(p.radio) r.appendChild(h('td','ant-td-radio',null,[h('span','ant-radio-dot')]));
      if(p.rowSelection) r.appendChild(h('td','ant-td-check',null,[h('span','ant-checkbox')]));
      /* 长文本截断后要能把全文读出来，否则「省略号」等于「信息丢失」：给 title 兜底 */
      var titleTip=p.ellipsisTitle?cols.map(function(c){ return row[c.dataIndex]; }).filter(function(v){ return v!=null&&v!==''; }).join(' · '):null;
      cols.forEach(function(c){
        var tt=null;
        if(c.ellipsis&&p.ellipsisTitle!==false){ var v=row[c.dataIndex]; tt=(v==null?'':String(v)); }
        r.appendChild(h('td',colClass(c),{style:c.align?'text-align:'+c.align:null,title:tt},cellContent(c,row,nid,ri)));
      });
      tbody.appendChild(r); });
  }
  t.appendChild(tbody); wrap.appendChild(t);

  var hasShell=(p.query&&p.query.length)||(p.toolbar&&p.toolbar.length)||p.title||p.pagination;
  if(!hasShell) return wrap;               /* 老写法：保持 DOM 原样 */
  var root=h('div','ant-table-root'+(p.stickyFooter?' sticky-pager':''));
  if(p.query&&p.query.length){
    /* 两条筛选区路径并存：filterBar:'grid3' 走新结构（两行三列），
       不写这个键的旧产物继续走 buildQueryBar —— 一次改渲染器不带走所有旧页。 */
    root.appendChild(p.filterBar==='grid3'?buildFilterBar(p,ctx):buildQueryBar(p,ctx));
  }
  if(p.toolbar&&p.toolbar.length) root.appendChild(buildListToolbar(p,ctx,node));
  if(p.title){
    var tt2=h('div','ant-table-title');
    tt2.appendChild(txt(p.title));
    var tl=h('span',null,{style:'display:inline-flex;gap:8px;margin-left:auto'});
    tl.appendChild(icon('setting',15));
    tt2.appendChild(tl);
    root.appendChild(tt2);
  }
  root.appendChild(wrap);
  if(p.pagination) root.appendChild(buildTableFoot(p,ctx));
  return root;
};

/* ---------------------------------------------------------------------
   主子表（MasterDetail）
   children[0] = 主表（Table），children[1] = 子表（Table）。
   点主表某行 → 子表按 `bind` 字段过滤出该行的明细；子表可展开收起。
   主表的 rowClick 会被强制关掉（点行=选中行，不是跳页）；要跳页请用操作列按钮。
   契约见 references/04-container-schema.md §6.7。
   --------------------------------------------------------------------- */
R.MasterDetail=function(p,ctx,node){
  var kids=node.children||[];
  var master=kids[0], detail=kids[1];
  var mdId=node.id||'md';
  var bind=p.bind||'id', bindTo=p.bindTo||bind;
  var readOnly=!!(ctx&&ctx.mdStatic);          /* 画布缩略图：只渲染，不写状态 */
  var ovAll=(ctx&&ctx.overrides)||{};
  var stripOv=function(id){
    if(!ovAll[id]) return ctx;
    var o={}; for(var k in ovAll){ if(k!==id) o[k]=ovAll[k]; }
    return Object.assign({},ctx,{overrides:o});
  };
  var propsOf=function(nd,extra){
    var q={}; for(var k in (nd.props||{})) q[k]=nd.props[k];
    var ov=ovAll[nd.id]||{}; for(var k2 in ov) q[k2]=ov[k2];
    if(extra) for(var k3 in extra) q[k3]=extra[k3];
    return q;
  };
  var wrap=h('div','ant-md');

  /* ---- 主表 ---- */
  var mBox=h('div','md-master');
  var mProps={};
  if(master){
    if((master.props||{}).rowClick) warn('主子表主表不应设 rowClick（点行=选中行）；跳页请改用操作列按钮');
    mProps=propsOf(master,{rowClick:false,radio:((master.props||{}).radio===undefined?true:(master.props||{}).radio)});
    var mEl=renderNode(Object.assign({},master,{props:mProps}),stripOv(master.id));
    if(mEl) mBox.appendChild(mEl);
  }
  wrap.appendChild(mBox);

  /* ---- 子表（可展开收起） ---- */
  var collapsed=(RT.mdCollapsed&&(mdId in RT.mdCollapsed))?!!RT.mdCollapsed[mdId]:!!p.defaultCollapsed;
  var dBox=h('div','md-detail'+(collapsed?' collapsed':''));
  var dHead=h('div','md-detail-head');
  var arrow=h('span','md-arrow',{text:collapsed?'▸':'▾'});
  dHead.appendChild(arrow);
  dHead.appendChild(txt(p.detailTitle||((detail&&detail.props&&detail.props.title)||'明细')));
  var cnt=h('span','md-count',{text:''});
  dHead.appendChild(cnt);
  var tools=h('span','md-tools');
  (p.detailTools||[]).forEach(function(it){
    var b=h('button','ant-btn sm text',{type:'button'});
    if(it.icon) b.appendChild(icon(it.icon,13));
    if(it.text) b.appendChild(txt(it.text));
    if(it.id) b.setAttribute('data-node-id',it.id);
    tools.appendChild(b);
  });
  tools.appendChild(icon('setting',15));
  dHead.appendChild(tools);
  dBox.appendChild(dHead);
  var dBody=h('div','md-detail-body');
  dBox.appendChild(dBody);
  wrap.appendChild(dBox);

  var mData=mProps.data||[];
  if(!readOnly && p.autoSelectFirst!==false && !(mdId in RT.mdSel) && mData.length) RT.mdSel[mdId]=mData[0][bind];

  function paint(){
    var sel=RT.mdSel[mdId];
    var hasSel=(sel!==undefined&&sel!==null&&sel!=='');
    Array.prototype.slice.call(mBox.querySelectorAll('tbody tr')).forEach(function(r2){
      var row=r2.__iprdRow;
      var hit=!!row&&hasSel&&String(row[bind])===String(sel);
      r2.classList.add('md-row');
      r2.classList.toggle('md-sel',hit);
      var dot=r2.querySelector('.ant-radio-dot'); if(dot) dot.classList.toggle('on',hit);
    });
    dBody.innerHTML='';
    if(!detail){ dBody.appendChild(h('div','md-empty',{text:'未配置子表'})); return; }
    var all=(detail.props&&detail.props.data)||[];
    var mine=hasSel?all.filter(function(r){ return String(r[bindTo])===String(sel); }):(p.showAllWhenEmpty?all:[]);
    /* 自检：主表选中行的 bind 值在子表里一条都匹配不到，但子表本身是有数据的
       —— 十有八九是 bind / bindTo 写错（或两表字段同名不同义）。这类错误肉眼很难发现，
       因为页面看起来「正常」，只是子表永远为空。 */
    if(hasSel&&!mine.length&&all.length&&!RT.mdBindWarned[mdId]){
      RT.mdBindWarned[mdId]=1;
      warn('主子表 '+mdId+'：主表 `'+bind+'` 的值（'+sel+'）在子表字段 `'+bindTo+
           '` 中匹配不到任何行，请检查 bind / bindTo 是否写对');
    }
    var dProps=propsOf(detail,{
      data:mine,
      emptyText:hasSel?((detail.props&&detail.props.emptyText)||'该行暂无明细'):(p.emptyText||'请先在上方选择一行')
    });
    var el=renderNode(Object.assign({},detail,{props:dProps}),stripOv(detail.id));
    if(el) dBody.appendChild(el);
    cnt.textContent=hasSel?('· 共 '+mine.length+' 条'):'';
  }

  if(p.collapsible!==false){
    dHead.addEventListener('click',function(e){
      if(e&&e.stopPropagation) e.stopPropagation();
      if(RT.annotate||RT.pan) return;
      var c=!dBox.classList.contains('collapsed');
      dBox.classList.toggle('collapsed',c);
      arrow.textContent=c?'▸':'▾';
      RT.mdCollapsed=RT.mdCollapsed||{}; RT.mdCollapsed[mdId]=c;
    });
  }

  mBox.addEventListener('click',function(e){
    if(RT.annotate||RT.pan) return;              /* 标注 / 平移模式下不抢手势 */
    if(RT.panTrailClick) return;                 /* 刚平移完，这次 click 属于上一次手势 */
    var t=e.target;
    var r2=t&&t.closest?t.closest('tr'):null;
    if(!r2||!r2.__iprdRow) return;
    if(t.closest('span[data-node-id]')) return;  /* 行内操作按钮自己处理，不当作「选行」 */
    if(e.stopPropagation) e.stopPropagation();
    RT.mdSel[mdId]=r2.__iprdRow[bind];
    dBox.classList.remove('collapsed'); arrow.textContent='▾';
    RT.mdCollapsed=RT.mdCollapsed||{}; RT.mdCollapsed[mdId]=false;
    paint();
  });

  paint();
  return wrap;
};

R.List=function(p,ctx,node){
  var d=h('div','ant-list'+(p.bordered?' bordered':''));
  if(p.loading){ for(var i=0;i<3;i++) d.appendChild(h('div','li',null,h('div','li-main',null,h('div','ant-skel-line')))); return d; }
  var data=p.data||[];
  if(!data.length){ d.appendChild(h('div','ant-empty-inline',null,[icon('file',24),h('span',null,{text:p.emptyText||'暂无数据'})])); return d; }
  /* renderItem 的规范位置是 props.renderItem；同时兼容误写在节点级的写法，避免静默渲染成空列表 */
  var tplSrc=p.renderItem||(node&&node.renderItem)||null;
  data.forEach(function(item,idx){
    var tpl=tplSrc?cloneTpl(tplSrc,item,idx):null;
    if(tpl){ var e=renderNode(tpl,ctx); if(e) d.appendChild(e); }
  });
  return d;
};

function treeNodes(list,ctx){
  var out=[];
  (list||[]).forEach(function(n){
    var has=n.children&&n.children.length;
    var row=h('div','tn',{style:'padding-left:'+(0)+'px'});
    row.appendChild(h('span','tw',{text:has?'▾':'·'}));

    row.appendChild(txt(n.title));
    out.push(row);

  });
  return out;
}

R.Empty=function(p,ctx,node){ return h('div','ant-empty-inline',null,[icon('file',34),h('span',null,{text:p.description||'暂无数据'})]); };
R.Progress=function(p,ctx,node){
  var pc=Number(p.percent)||0;
  if(p.type==='circle'){
    var c=document.createElementNS('http://www.w3.org/2000/svg','svg');
    c.setAttribute('width','64'); c.setAttribute('height','64'); c.setAttribute('viewBox','0 0 64 64');
    var bg=document.createElementNS('http://www.w3.org/2000/svg','circle');
    bg.setAttribute('cx','32');bg.setAttribute('cy','32');bg.setAttribute('r','26');bg.setAttribute('fill','none');bg.setAttribute('stroke','#f0f0f0');bg.setAttribute('stroke-width','6');
    var fg=document.createElementNS('http://www.w3.org/2000/svg','circle');
    var C=2*Math.PI*26;
    fg.setAttribute('cx','32');fg.setAttribute('cy','32');fg.setAttribute('r','26');fg.setAttribute('fill','none');
    fg.setAttribute('stroke',p.status==='exception'?'#ff4d4f':(p.status==='success'?'#52c41a':'#1677ff'));
    fg.setAttribute('stroke-width','6'); fg.setAttribute('stroke-linecap','round');
    fg.setAttribute('stroke-dasharray',C); fg.setAttribute('stroke-dashoffset',C*(1-pc/100));
    fg.setAttribute('transform','rotate(-90 32 32)');
    c.appendChild(bg); c.appendChild(fg);
    var wrap=h('div','ant-progress circle'); wrap.appendChild(c); wrap.appendChild(h('span',null,{text:pc+'%'})); return wrap;
  }
  var d=h('div','ant-progress'); var t=h('div','track');
  t.appendChild(h('div','bar'+(p.status?' '+p.status:''),{style:'width:'+pc+'%'})); d.appendChild(t);
  if(p.showInfo!==false) d.appendChild(h('span',null,{text:pc+'%'}));

};

/* --- feedback --- */
R.Modal=function(p,ctx,node){
  var open=p.open||RT.modalOpen[p.modalId||node.id];
  if(!open) return null;
  var foot=h('div','m-foot');
  if(p.footer!==false){
    /* 底部按钮给「合成节点 id」：<Modal 节点 id>__cancel / __ok，可被 interactions 精确寻址。
       否则点按钮只能落到整个 Modal 遮罩上，无法区分「确定」与「取消」。 */
    var bc=h('span','ant-btn',{text:p.cancelText||'取消'}); bc.setAttribute('data-node-id',node.id+'__cancel');
    var bo=h('span','ant-btn primary',{text:p.okText||'确定'}); bo.setAttribute('data-node-id',node.id+'__ok');
    foot.appendChild(bc); foot.appendChild(bo);
  }
  var m=h('div','ant-modal',null,[h('div','m-head',{text:p.title||''}),
    h('div','m-body',null,[p.content?h('div',null,{text:p.content}):null].concat(renderChildren(node,ctx))),
    p.footer!==false?foot:null]);
  return h('div','ant-modal-mask',null,m);
};
R.Drawer=function(p,ctx,node){
  var open=p.open||RT.modalOpen[p.modalId||node.id];
  if(!open) return null;
  var body=h('div','d-body'); renderChildren(node,ctx).forEach(function(c){body.appendChild(c)});
  var foot=slotFirst(node,'footer',ctx);
  /* R10：抽屉宽必须**读声明**。原实现 class 写死 ant-drawer，而 CSS 默认 420、
     `.ant-drawer.w-lg{560}` 又从来没人加 —— 于是「声明 560 / 渲染 420」长期并存，
     而 P11 读的是 JSON 声明，两边一起绿。这和 R1「width:48 缺 px」是同一个模式：
     声明与渲染脱钩，判据锚在声明上。
     口径：≥560 走 CSS 档 w-lg；其它数值用 inline，保证「声明 = 渲染」；
     不写才吃默认 420。作者自己写了 w-lg 就不重复加（class 会重复但不致命，
     这里仍然判断一次，免得 `.ant-drawer.w-lg.w-lg` 这种脏类名进 DOM）。 */
  var cls='ant-drawer';
  var w=Number(p.width);
  var authored=String(p.class||p.className||'');
  var lg=isFinite(w)&&w>=560&&authored.indexOf('w-lg')<0;
  if(lg) cls+=' w-lg';
  var dr=h('div',cls,null,[h('div','d-head',{text:p.title||''}),body,foot?h('div','d-foot',null,foot):null]);
  if(isFinite(w)&&w>0&&!lg&&!(authored.indexOf('w-lg')>=0&&w===560)) dr.style.width=w+'px';

R.Chart=function(p,ctx,node){
  var data=p.data||[], W=520, H=(p.height||200);
  var max=Math.max.apply(null,data.map(function(d){return Number(d.value)||0}).concat([1]));
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width','100%'); svg.setAttribute('height',H); svg.setAttribute('viewBox','0 0 '+W+' '+H);

    var total=data.reduce(function(a,b){return a+(Number(b.value)||0)},0)||1, cx=W/2, cy=H/2, r=Math.min(W,H)/2-16, acc=0;
    var colors=['#1677ff','#52c41a','#faad14','#ff4d4f','#722ed1','#13c2c2'];
    data.forEach(function(it,i){
      var frac=(Number(it.value)||0)/total, a0=acc*2*Math.PI-Math.PI/2, a1=(acc+frac)*2*Math.PI-Math.PI/2; acc+=frac;
      var x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      var large=frac>0.5?1:0;

      path.setAttribute('d','M'+cx+' '+cy+' L'+x0+' '+y0+' A'+r+' '+r+' 0 '+large+' 1 '+x1+' '+y1+' Z');

    if(p.type==='donut'){ var c2=document.createElementNS('http://www.w3.org/2000/svg','circle'); c2.setAttribute('cx',cx);c2.setAttribute('cy',cy);c2.setAttribute('r',r*0.55);c2.setAttribute('fill','#fff'); svg.appendChild(c2); }

    var pad=32, bw=(W-pad*2)/Math.max(data.length,1);
    if(p.type==='line'){

      var pl=document.createElementNS('http://www.w3.org/2000/svg','polyline');
      pl.setAttribute('points',pts.map(function(pt){return pt[0]+','+pt[1]}).join(' '));
      pl.setAttribute('fill','none'); pl.setAttribute('stroke','#1677ff'); pl.setAttribute('stroke-width','2');
      svg.appendChild(pl);
      pts.forEach(function(pt){ var c3=document.createElementNS('http://www.w3.org/2000/svg','circle'); c3.setAttribute('cx',pt[0]);c3.setAttribute('cy',pt[1]);c3.setAttribute('r',3.5);c3.setAttribute('fill','#1677ff'); svg.appendChild(c3); });
    } else {
      data.forEach(function(it,i){ var bh=((Number(it.value)||0)/max)*(H-pad*2);
        var r2=document.createElementNS('http://www.w3.org/2000/svg','rect');
        r2.setAttribute('x',pad+bw*i+bw*0.2); r2.setAttribute('y',H-pad-bh); r2.setAttribute('width',bw*0.6); r2.setAttribute('height',bh);
        r2.setAttribute('rx','4'); r2.setAttribute('fill','#1677ff'); svg.appendChild(r2); });
    }
    data.forEach(function(it,i){ var t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',pad+bw*i+bw/2); t.setAttribute('y',H-10); t.setAttribute('text-anchor','middle');
      t.setAttribute('font-size','12'); t.setAttribute('fill','rgba(0,0,0,.45)'); t.textContent=it.label; svg.appendChild(t); });
  }
  d.appendChild(svg); return d;
};

/* =====================================================================
   Capability（命令策略）：角色 × 业务状态 → 动作可用性
   ---------------------------------------------------------------------
   capabilities[] 描述「谁 / 在什么状态下 / 能执行什么命令 / 不能执行时怎么办」。
   原型里据此把按钮渲染成可用 / 置灰 / 隐藏 / 虚线（点了才拒绝），
   并允许用顶部「单据状态」下拉模拟任意生命周期状态，肉眼即可验证。
   ===================================================================== */
function smByEntity(ent){ if(!ent) return null; return DATA.stateMachines.filter(function(m){return m.entity===ent})[0]||null; }
function curEntState(ent){ var sm=smByEntity(ent); if(!sm) return null; return RT.entState[ent]||sm.initial||null; }
function stateName(sm,id){
  if(id==null) return '';
  var hit=sm&&(sm.states||[]).filter(function(s){return s.id===id})[0];
  return hit?hit.name:String(id);
}
/* 行数据里存的是中文状态名，capabilities.from 里写的是状态 id —— 两边都要认 */
function normStateId(sm,v){
  if(v==null) return null;
  if(!sm) return v;
  var hit=(sm.states||[]).filter(function(s){return s.id===v||s.name===v})[0];
  return hit?hit.id:v;
}
function capById(id){ return DATA.capabilities.filter(function(c){return c.id===id})[0]||null; }
/* subject 为空 = 页面级（用顶部下拉模拟的单据状态）；传 row = 列表行级（读行上的状态字段） */
function capEval(cap,subject){
  if(!cap) return {ok:true};
  var ent=cap.entity||((curPage()||{}).entity);
  var sm=smByEntity(ent);
  var raw=subject?(subject[cap.stateField||'status']):curEntState(ent);
  var cur=normStateId(sm,raw);
  var from=cap.from||[];
  if(!from.length) return {ok:true,cur:cur,ent:ent};
  var ok=from.indexOf(cur)>=0;
  return {ok:ok,cur:cur,ent:ent,policy:cap.policy||'disabled',
    reason:cap.reason||('当前状态「'+stateName(sm,cur)+'」下不可执行「'+(cap.name||cap.id)+'」')};
}
/* 把可用性落到一个可点击元素上；返回 {blocked:bool, hidden:bool, reason:string} */
function applyCap(el,cap,subject){
  if(!el||!cap) return {blocked:false,hidden:false};
  var r=capEval(cap,subject);
  el.setAttribute('data-capability',cap.id);
  el.setAttribute('data-cap-state',r.ok?'on':'off');
  if(r.ok) return {blocked:false,hidden:false};
  el.setAttribute('data-cap-policy',r.policy);
  el.setAttribute('title',r.reason);
  if(r.policy==='hidden'){ el.style.display='none'; return {blocked:true,hidden:true,reason:r.reason}; }
  if(r.policy==='reject'){ el.classList.add('cap-reject'); return {blocked:false,hidden:false,reason:r.reason,reject:true}; }
  el.classList.add('cap-blocked');
  el.setAttribute('aria-disabled','true');
  return {blocked:true,hidden:false,reason:r.reason};
}

/* =====================================================================
   Page render
   ===================================================================== */
function stateOf(page,id){ var s=(page.states||[]).filter(function(x){return x.id===id})[0]; return s||(page.states||[])[0]||{id:'s-default',vars:{},overrides:[]}; }
function applyState(){
  var page=curPage(); if(!page) return;
  var st=stateOf(page,RT.stateId); RT.stateId=st.id;
  RT.vars={}; for(var k in (st.vars||{})) RT.vars[k]=st.vars[k];
  RT.overrides={}; RT.modalOpen={};
  (st.overrides||[]).forEach(function(o){ (RT.overrides[o.target]=RT.overrides[o.target]||{})[o.prop]=o.value; });
}
function buildCtx(page,st){
  var hidden={}, visible=new Set();
  (st.hidden||[]).forEach(function(id){ hidden[id]=1; });
  (st.visible||[]).forEach(function(id){ visible.add(id); });
  /* 页面声明了 entity 时，额外注入两个只读变量，让原型里的「状态标签」能跟着
     顶栏「单据状态」下拉一起变，而不是写死一句「草稿」：
       {{__entState}}   当前单据状态的中文名（草稿 / 待审批 / 已通过 …）
       {{__entStateId}} 当前单据状态的 id（draft / pending / approved …）
     只做浅拷贝，不污染 RT.vars（UI 只读它，写入仍走 RT.vars）。 */
  var vars=RT.vars;
  var sm=page&&page.entity?smByEntity(page.entity):null;
  if(sm){
    vars={};
    for(var k in RT.vars) vars[k]=RT.vars[k];
    vars.__entState=stateName(sm,curEntState(page.entity));
    vars.__entStateId=curEntState(page.entity);
  }
  return { vars:vars, overrides:RT.overrides, hidden:hidden, visible:visible };
}
/* 顶部「单据状态」下拉：页面声明 entity 且存在对应状态机时出现。
   它模拟的是**业务生命周期状态**（草稿/审核中/已通过），与页面状态（默认/加载/空/异常）是两条轴。 */
function refreshEntitySelect(){
  var sel=$('#entitySelect'); if(!sel) return;
  var page=curPage();
  var sm=page&&page.entity?smByEntity(page.entity):null;
  if(!sm||!(sm.states||[]).length){ sel.style.display='none'; sel.innerHTML=''; sel.removeAttribute('data-entity'); return; }
  /* 注意：CSS 里 `#entitySelect{display:none}` 是默认隐藏，这里必须给具体值，
     置空字符串会回落到 CSS 规则而继续隐藏 */
  sel.style.display='inline-block';
  sel.innerHTML='';
  (sm.states||[]).forEach(function(s){
    var o=document.createElement('option');
    o.value=s.id; o.textContent='单据状态：'+s.name;
    sel.appendChild(o);
  });
  sel.value=curEntState(page.entity);
  sel.setAttribute('data-entity',page.entity);
}
function renderProto(){
  var page=curPage(); if(!page) return;
  var st=stateOf(page,RT.stateId);
  var ctx=buildCtx(page,st);
  var canvas=$('#protoCanvas'); canvas.innerHTML='';
  var el=renderNode(page.componentTree||{id:'n-root',type:'Layout',children:[]},ctx);
  if(el) canvas.appendChild(el);
  canvas.classList.toggle('annotating',RT.annotate);
  applyZoom();
  positionBubbles();
  var sm=page.entity?smByEntity(page.entity):null;
  var tag=$('#protoStateTag');
  tag.textContent='当前状态：'+st.name+(sm?(' · 单据：'+stateName(sm,curEntState(page.entity))):'');
  $('#stateSelect').value=st.id;
  refreshEntitySelect();
}

/* =====================================================================
   Prototype zoom & pan
   ===================================================================== */
var ZOOM_MIN=0.25, ZOOM_MAX=3, ZOOM_STEP=1.15, STAGE_PAD=14;
function zoomClamp(z){ return Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,Math.round(z*1000)/1000)); }
function updateZoomUI(){
  var v=$('#zVal'); if(v) v.textContent=Math.round(RT.zoom*100)+'%';
  var o=$('#zOut'); if(o) o.disabled=RT.zoom<=ZOOM_MIN+1e-6;
  var i=$('#zIn');  if(i) i.disabled=RT.zoom>=ZOOM_MAX-1e-6;
  var p=$('#zPan'); if(p) p.classList.toggle('on',!!RT.pan);
}
/* 中栏「可视内容宽」= 滚动容器内容宽 - 舞台左右内边距（两处共用，避免口径不一致） */
function availWidth(){
  var scroll=$('#protoScroll'); if(!scroll) return 640;
  var cs=getComputedStyle(scroll);
  var padX=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  return Math.max(320, scroll.clientWidth-padX-STAGE_PAD*2);
}
/* 测量基准尺寸（未缩放空间）并应用 scale。
   基准宽 = max(可视内容宽, 画布内容自然宽)，保证 100% 时原型铺满中栏、且宽表不被压扁。
   关键：wrap 的布局宽恒等于 baseW，缩放只走 transform —— 这样 wrap 的 rect 宽 = baseW*z，
   与内部元素的 rect 同处缩放坐标系，标注归一化坐标才不会随 zoom 漂移。 */
function applyZoom(){
  var scroll=$('#protoScroll'), stage=$('#protoStage'), wrap=$('#protoWrap'), cv=$('#protoCanvas');
  if(!scroll||!stage||!wrap||!cv) return;
  /* 1) 回到「未缩放 + 尺寸待测」状态 */
  wrap.style.transform='none';
  wrap.style.width=''; wrap.style.minWidth='';
  stage.style.width=''; stage.style.height='';
  /* 2) 基准宽：可视宽 vs 画布内容自然宽（含溢出，如宽表格） */
  var baseW=Math.max(availWidth(), cv.scrollWidth||0, 640);
  wrap.style.width=baseW+'px';
  /* 3) 基准高必须在基准宽生效之后再测，否则宽度不同会换行、高度失真 */
  var baseH=Math.max(wrap.offsetHeight||0, 200);
  RT.baseW=baseW; RT.baseH=baseH;
  /* 4) 应用缩放；舞台按缩放后尺寸撑位，保证滚动条范围正确 */
  var z=RT.zoom;
  wrap.style.transform='scale('+z+')';
  stage.style.width=(baseW*z+STAGE_PAD*2)+'px';
  stage.style.height=(baseH*z+STAGE_PAD*2)+'px';
  updateZoomUI();
}
/* 以 (cx,cy) 为锚点缩放；不传锚点则保持滚动位置 */
function setZoom(z,cx,cy){
  z=zoomClamp(z);
  if(Math.abs(z-RT.zoom)<1e-4) return;
  var scroll=$('#protoScroll'), wrap=$('#protoWrap');
  var ax=null, ay=null;
  if(cx!=null&&wrap){ var r=wrap.getBoundingClientRect(); ax=(cx-r.left)/RT.zoom; ay=(cy-r.top)/RT.zoom; }
  RT.zoom=z;
  applyZoom();
  if(ax!=null&&scroll){
    var r2=wrap.getBoundingClientRect();
    scroll.scrollLeft += (r2.left+ax*z)-cx;
    scroll.scrollTop  += (r2.top +ay*z)-cy;
  }
  positionBubbles();
  lsSave();
}
function zoomBy(f,cx,cy){ setZoom(RT.zoom*f,cx,cy); }
function fitWidth(){
  var scroll=$('#protoScroll'); if(!scroll) return;
  setZoom(RT.baseW?availWidth()/RT.baseW:1);
}
function setPan(v){
  RT.pan=!!v;
  if(RT.pan&&RT.annotate) RT.annotate=false;
  var s=$('#protoScroll'); if(s) s.classList.toggle('pan',RT.pan);
  var c=$('#protoCanvas'); if(c) c.classList.toggle('annotating',RT.annotate);
  updateZoomUI(); syncToolbar();
  toast(RT.pan?'平移模式：按住拖拽移动画布（空格 / 鼠标中键同样可用）':'已退出平移模式','info');
}
function setupZoomPan(){
  var scroll=$('#protoScroll'); if(!scroll) return;

  $('#zOut').onclick=function(){ zoomBy(1/ZOOM_STEP); };
  $('#zIn').onclick=function(){ zoomBy(ZOOM_STEP); };
  $('#zVal').onclick=function(){ setZoom(1); };
  $('#zFit').onclick=fitWidth;
  $('#zPan').onclick=function(){ setPan(!RT.pan); };

  /* 拖拽平移：平移模式 / 空格 / 鼠标中键 */
  var panning=false, sx=0, sy=0, sl=0, st=0, moved=false;
  scroll.addEventListener('mousedown',function(e){
    if(!(RT.pan||RT.spaceDown||e.button===1)) return;
    panning=true; moved=false; sx=e.clientX; sy=e.clientY; sl=scroll.scrollLeft; st=scroll.scrollTop;
    scroll.classList.add('panning'); e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(!panning) return;
    var dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)>2||Math.abs(dy)>2) moved=true;
    scroll.scrollLeft=sl-dx; scroll.scrollTop=st-dy;
  });
  document.addEventListener('mouseup',function(){
    if(!panning) return;
    panning=false; scroll.classList.remove('panning');
    if(moved) RT.panTrailClick=true;
  });
  scroll.addEventListener('auxclick',function(e){ if(e.button===1) e.preventDefault(); });

  /* 平移手势的「尾随 click」抑制 —— 捕获阶段一次性吃掉。
     为什么不用时间窗口：时间窗口与事件是否同属一次手势无关，
     手速快的用户（以及同步执行的自动化测试）会在窗口内误伤后续真实点击。
     这里改成「手势结束后标记一次，被下一个 click 消费掉」，行为与时间无关、完全确定。
     另外在 mousedown 时清标记：中键拖拽不会产生 click，
     若标记一直挂着会误吞用户很久之后的第一次点击。 */
  document.addEventListener('mousedown',function(){ RT.panTrailClick=false; },true);
  document.addEventListener('click',function(e){
    if(!RT.panTrailClick) return;
    RT.panTrailClick=false;
    if(e.stopPropagation) e.stopPropagation();
    if(e.preventDefault) e.preventDefault();
  },true);

  /* Ctrl / ⌘ + 滚轮缩放（锚定光标） */
  scroll.addEventListener('wheel',function(e){
    if(!(e.ctrlKey||e.metaKey)) return;
    e.preventDefault();
    zoomBy(e.deltaY<0?ZOOM_STEP:1/ZOOM_STEP, e.clientX, e.clientY);
  },{passive:false});

  /* 空格临时平移 + 键盘缩放 */
  function inField(t){
    return !!(t&&(t.closest&&t.closest('input,textarea,select,button,[contenteditable="true"]')));
  }
  document.addEventListener('keydown',function(e){
    if(e.code==='Space'&&!inField(e.target)){ RT.spaceDown=true; scroll.classList.add('pan'); e.preventDefault(); return; }
    if(!(e.ctrlKey||e.metaKey)) return;
    if(e.key==='0'){ e.preventDefault(); setZoom(1); }
    else if(e.key==='-'||e.key==='_'){ e.preventDefault(); zoomBy(1/ZOOM_STEP); }
    else if(e.key==='='||e.key==='+'){ e.preventDefault(); zoomBy(ZOOM_STEP); }
  });
  document.addEventListener('keyup',function(e){
    if(e.code==='Space'){ RT.spaceDown=false; scroll.classList.toggle('pan',!!RT.pan); }
  });
}
function positionBubbles(){
  var layer=$('#annoLayer'); layer.innerHTML='';
  if(!RT.annoVisible) return;
  var list=RT.anno[RT.pageId]||[];
  var cv=$('#protoCanvas');
  list.forEach(function(a,i){
    var b=h('div','bubble '+(a.status||'open')+(RT.activeAnno===a.id?' active':''),{text:String(i+1)});
    var x=a.anchor&&a.anchor.x!=null?a.anchor.x:0.5, y=a.anchor&&a.anchor.y!=null?a.anchor.y:0.5;
    if(a.anchor&&a.anchor.nodeId){
      var el=$('[data-node-id="'+a.anchor.nodeId+'"]',cv);
      /* 归一化基准 = 画布盒：分子分母同处缩放坐标系，比值与 zoom 严格无关 */
      if(el){ var cr=cv.getBoundingClientRect(), er=el.getBoundingClientRect();
        x=(er.left-cr.left+er.width/2)/cr.width; y=(er.top-cr.top+er.height/2)/cr.height; }
    }
    b.style.left=(x*100)+'%'; b.style.top=(y*100)+'%';
    b.setAttribute('data-anno-id',a.id);
    layer.appendChild(b);
  });
}

/* =====================================================================
   Interactions
   ===================================================================== */
function runActions(actions,scope){
  var i=0;
  function next(){
    if(i>=actions.length) return;
    var a=actions[i++];
    try{ doAction(a,scope); }catch(e){ warn('交互执行失败: '+e.message); }
    if(a.type==='delay') setTimeout(next,a.ms||300); else next();
  }
  next();
}
function doAction(a,scope){  switch(a.type){
    case 'setState': RT.vars[a.key]=typeof a.value==='string'?interp(a.value,scope||RT.vars):a.value; renderProto(); break;
    case 'setNode': (RT.overrides[a.target]=RT.overrides[a.target]||{})[a.prop]=a.value; renderProto(); break;
    case 'gotoState': RT.stateId=a.stateId; applyState(); renderProto(); break;
    case 'navigate': gotoPage(a.pageId,{stateId:a.stateId,params:interpParams(a.params,scope)}); break;
    case 'back': goBack(); break;
    case 'scrollTo': scrollToNode(a.target); break;
    case 'message': toast(interp(a.text,scope||RT.vars),a.level||'info'); break;
    case 'showModal': case 'showDrawer': RT.modalOpen[a.modalId||a.drawerId||a.target]=true; renderProto(); break;
    case 'hideModal': case 'hideDrawer': RT.modalOpen[a.modalId||a.drawerId||a.target]=false; renderProto(); break;
    case 'reset': applyState(); renderProto(); break;
    case 'delay': break;
    default: warn('未知 action: '+a.type);
  }
}
/* 目标匹配：支持精确 id，也支持 `*` 通配。
   通配让「一条 interaction 服务所有行/所有行内按钮」成为可能，例如：
     n-table__row_*        → 任意一行
     n-table__act_*_view   → 任意一行的「查看」按钮                        */
function targetMatch(pat,id){
  if(pat===id) return true;
  if(!pat||pat.indexOf('*')<0) return false;
  var re=new RegExp('^'+pat.split('*').map(function(s){
    return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  }).join('.*')+'$');
  return re.test(id);
}
function onCanvasClick(e){
  if(RT.pan) return;                                       /* 平移模式只移动，不触发交互 */
  if(RT.panTrailClick) return;                             /* 刚平移完，这次 click 属于上一次手势 */
  /* 归一化基准统一用画布盒 rect（与 positionBubbles / openAnnoPop 同口径） */
  var rect=$('#protoCanvas').getBoundingClientRect();
  if(RT.annotate){
    var el=e.target.closest?e.target.closest('[data-node-id]'):null;
    var nodeId=el?el.getAttribute('data-node-id'):null;
    var x=(e.clientX-rect.left)/rect.width, y=(e.clientY-rect.top)/rect.height;
    var an={id:'an-'+Date.now(),pageId:RT.pageId,anchor:{nodeId:nodeId,x:Math.max(0,Math.min(1,x)),y:Math.max(0,Math.min(1,y))},
      text:'',category:'ui',author:'PM',status:'open',createdAt:new Date().toISOString(),replies:[]};
    (RT.anno[RT.pageId]=RT.anno[RT.pageId]||[]).push(an);
    lsSave(); renderAll(); openAnnoPop(an.id,true);
    /* 阻止冒泡：否则 document 上的「点空白关弹层」会立刻把刚打开的弹层关掉 */
    e.stopPropagation();
    return;
  }
  var t=e.target.closest?e.target.closest('[data-node-id]'):null;
  if(!t) return;
  var id=t.getAttribute('data-node-id');
  /* 被业务状态拦住的动作：点了要说明原因，而不是静默无反应 */
  var capOff=t.getAttribute('data-cap-state')==='off';
  var capPolicy=t.getAttribute('data-cap-policy')||'disabled';
  if(capOff&&capPolicy!=='reject'){
    toast(t.getAttribute('title')||'当前状态不可执行该操作','warning');
    return;
  }
  /* Header 的返回箭头（`<nodeId>__back`）内建返回，优先级高于交互表 */
  if(/__back$/.test(id)){ goBack(); return; }
  /* 弹窗「取消」内建关闭（与 `__back` 同思路）：作者不写 interaction 也不会把弹窗卡住。
     交互表仍会照常执行，作者可额外挂 hideModal / message 等。 */
  var mCancel=/^(.+)__cancel$/.exec(id);
  if(mCancel){
    var hit=findNodeInTree(curPage().componentTree, mCancel[1], null);
    var mid=(hit&&hit.node.props&&hit.node.props.modalId)||mCancel[1];
    if(RT.modalOpen[mid]){ RT.modalOpen[mid]=false; renderProto(); }
  }
  /* 本次点击的行上下文（表格行 / 行内按钮），随 actions 一起传递，延迟动作也不会丢 */
  var scope=rowScopeFor(t);
  var page=curPage();
  var matched=(page.interactions||[]).filter(function(ix){ return ix.on&&ix.on.event==='click'&&targetMatch(ix.on.target,id); });
  matched.forEach(function(ix){
      if(ix.conditions&&ix.conditions.length){ var ok=ix.conditions.every(function(c){return evalExpr(c,scope)}); if(!ok) return; }
      runActions(ix.actions||[],scope);
    });
  /* policy=reject：允许点、点了才拒绝。若作者没写提示交互，这里兜底说明原因 */
  if(capOff&&capPolicy==='reject'&&!matched.length){
    toast(t.getAttribute('title')||'当前状态不可执行该操作','warning');
  }
}

     它与画布盒同宽高、且不受 transform 影响；比值用画布盒 rect 求，二者配合任意缩放下都对齐 */
  var bw=layer.offsetWidth||cv.offsetWidth||600, bh=layer.offsetHeight||cv.offsetHeight||400;

function mdToHtml(s){
  if(!s) return '';
  /* 行内格式：先转义，再处理 **加粗** 与 `代码`（顺序不能反，否则会把标签转义掉） */
  function inline(t){
    return esc(t)
      .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
      .replace(/`([^`]+)`/g,'<code>$1</code>');
  }
  function cells(ln){
    var a=String(ln).trim().replace(/^\|/,'').replace(/\|$/,'').split('|');
    return a.map(function(x){ return x.trim(); });
  }
  var lines=String(s).split('\n'), out='', inUl=false, inOl=false;
  function closeList(){ if(inUl){out+='</ul>';inUl=false;} if(inOl){out+='</ol>';inOl=false;} }
  for(var i=0;i<lines.length;i++){
    var t=lines[i].replace(/\s+$/,'');
    /* markdown 表格：连续的 | 行；第二行是 |---| 分隔行时，第一行当表头 */
    if(/^\s*\|/.test(t)){
      var rows=[];
      while(i<lines.length && /^\s*\|/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      i--;
      closeList();
      var head=null, body=rows;
      if(rows.length>1 && rows[1].every(function(c){ return /^:?-{2,}:?$/.test(c); })){
        head=rows[0]; body=rows.slice(2);
      }
      out+='<table class="prd-md-table">';
      if(head){
        out+='<thead><tr>'+head.map(function(c){ return '<th>'+inline(c)+'</th>'; }).join('')+'</tr></thead>';
      }
      out+='<tbody>'+body.map(function(r){
        return '<tr>'+r.map(function(c){ return '<td>'+inline(c)+'</td>'; }).join('')+'</tr>';
      }).join('')+'</tbody></table>';
      continue;
    }
    if(/^\s*-\s+\[[ x]\]\s+/.test(t)){ if(!inUl){closeList();out+='<ul>';inUl=true;} out+='<li>'+inline(t.replace(/^\s*-\s+\[[ x]\]\s+/,''))+'</li>'; continue; }
    if(/^\s*[-*]\s+/.test(t)){ if(!inUl){closeList();out+='<ul>';inUl=true;} out+='<li>'+inline(t.replace(/^\s*[-*]\s+/,''))+'</li>'; continue; }
    if(/^\s*\d+[.)]\s+/.test(t)){ if(!inOl){closeList();out+='<ol>';inOl=true;} out+='<li>'+inline(t.replace(/^\s*\d+[.)]\s+/,''))+'</li>'; continue; }
    closeList();
    if(t==='') out+='<div style="height:6px"></div>';
    else out+='<div>'+inline(t)+'</div>';
  }
  closeList();
  return out;
}
function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]}); }

function prdBodyText(page,secId){

  if(edits[secId]!=null) return edits[secId];

  return sec?sec.body:'';

/* PRD 内嵌流程图：复用画布那套分层布局引擎（layeredLayout），
   节点/边来自 section.nodes / section.edges；纯 SVG，导出 PNG/MD 都不丢结构。
   section: { type:'flow', heading, caption?, dir?:'LR'|'TB',
              nodes:[{id,label,sub?,kind?:start|end|decision|warn|''}],
              edges:[{from,to,label?}] } */
function renderFlowDiagram(sec){
  var FNW=132, FNH=46, FSUB_H=14;
  var nodes=(sec.nodes||[]).filter(function(n){ return n&&n.id; });
  var byId={}; nodes.forEach(function(n){ byId[n.id]=n; });
  var ids=nodes.map(function(n){ return n.id; });
  var edges=(sec.edges||[]).filter(function(e){ return e&&byId[e.from]&&byId[e.to]; });
  var sizeOf=function(id){
    var n=byId[id]||{};
    var txtW=Math.max(String(n.label||'').length,String(n.sub||'').length)*7.4+30;
    return {w:Math.max(FNW,Math.min(240,Math.round(txtW))),h:n.sub?FNH+FSUB_H:FNH};
  };
  var lay=layeredLayout(ids,edges,{dir:sec.dir==='TB'?'TB':'LR',gapMain:56,gapCross:26,sizeOf:sizeOf});
  var pad=8;
  var W=Math.ceil(lay.w+pad*2), H=Math.ceil(lay.h+pad*2);
  var svg=svgEl('svg',{width:W,height:H,viewBox:'0 0 '+W+' '+H,'aria-label':sec.heading||'流程图'});
  ensureArrowMarker(svg,'fd-arrow','#98a2b3');
  var eg=svgEl('g');
  edges.forEach(function(e){
    var pa=lay.pos[e.from], pb=lay.pos[e.to]; if(!pa||!pb) return;
    var sa=sizeOf(e.from), sb=sizeOf(e.to);
    var ra={x:pa.x+pad,y:pa.y+pad,w:sa.w,h:sa.h}, rb={x:pb.x+pad,y:pb.y+pad,w:sb.w,h:sb.h};
    var ac={x:ra.x+ra.w/2,y:ra.y+ra.h/2}, bc={x:rb.x+rb.w/2,y:rb.y+rb.h/2};
    var p1=sideAnchor(ra,bc.x,bc.y), p2=sideAnchor(rb,ac.x,ac.y);
    var geo=edgePath(p1,p2);
    var isBack=!!lay.backEdges[e.from+'>'+e.to];
    eg.appendChild(svgEl('path',{d:geo.d,class:'fd-edge'+(isBack?' back':''),'marker-end':'url(#fd-arrow)'}));
    if(e.label){
      var w=String(e.label).length*6+12;
      eg.appendChild(svgEl('rect',{x:geo.mx-w/2,y:geo.my-8.5,width:w,height:17,rx:3,class:'fd-elabel-bg'}));
      eg.appendChild(svgEl('text',{x:geo.mx,y:geo.my+0.5,class:'fd-elabel'},String(e.label)));
    }
  });
  svg.appendChild(eg);
  nodes.forEach(function(n){
    var p=lay.pos[n.id]; if(!p) return;
    var s=sizeOf(n.id);
    var g=svgEl('g',{class:'fd-node'+(n.kind?' '+n.kind:'')});
    g.appendChild(svgEl('rect',{x:p.x+pad,y:p.y+pad,width:s.w,height:s.h,rx:6}));
    var cx=p.x+pad+s.w/2, cy=p.y+pad+s.h/2;
    if(n.sub){
      g.appendChild(svgEl('text',{x:cx,y:cy-6,class:'lbl'},String(n.label||n.id)));
      g.appendChild(svgEl('text',{x:cx,y:cy+10,class:'sub'},String(n.sub)));
    }else{
      g.appendChild(svgEl('text',{x:cx,y:cy,class:'lbl'},String(n.label||n.id)));
    }
    svg.appendChild(g);
  });
  var wrap=h('div','flow-diagram');
  wrap.appendChild(svg);
  var bar=h('div','prd-flow-bar');
  bar.appendChild(h('span','prd-flow-cap',{text:sec.caption||''}));
  var zb=h('span','ant-btn sm text',{text:'⤢ 放大'});
  zb.onclick=function(e){ if(e&&e.stopPropagation) e.stopPropagation(); openFlowZoom(sec); };
  bar.appendChild(zb);
  wrap.appendChild(bar);
  return wrap;
}

var PROMPT_OPTS = { scope: 'page', onlyOpen: true };

function findNodeInTree(node, id, parent){
  if(!node || typeof node!=='object') return null;
  if(node.id===id) return { node:node, parent:parent };
  var kids=(node.children||[]).slice();
  for(var s in (node.slots||{})) kids=kids.concat(node.slots[s]||[]);
  for(var i=0;i<kids.length;i++){ var r=findNodeInTree(kids[i], id, node); if(r) return r; }
  return null;
}
function propsSummary(node){
  var p=node.props||{}, keys=Object.keys(p), parts=[];
  for(var i=0;i<keys.length && parts.length<6;i++){
    var k=keys[i], v=p[k];
    if(v==null||v===''||v===false) continue;
    var s;
    if(Array.isArray(v)) s='['+v.length+' 项]';
    else if(typeof v==='object') s='{…}';
    else s=String(v);
    if(s.length>44) s=s.slice(0,44)+'…';
    parts.push(k+'='+s);
  }
  return parts.join('，')||'（无显式属性）';
}
function buildAnnotationPrompt(scope, onlyOpen){

    if(list.length){ groups.push({ page:pg, list:list }); total+=list.length; }
  });

  L.push('# XX-PRD · 标注修改指令');

  L.push('- 本次范围：'+(scope==='all' ? '全部页面' : '当前页「'+(curPage().name||'')+'」')
         +'，共 '+total+' 条标注（全部页面待处理合计 '+openAll+' 条）');
  L.push('');
  if(!total){

  }
  L.push('## 标注清单');
  L.push('');
  groups.forEach(function(g){
    L.push('### 页面：'+(g.page.name||'')+'  `'+g.page.id+'`'+(g.page.route ? ('　路由 `'+g.page.route+'`') : ''));
    L.push('');
    g.list.forEach(function(a){
      var idx=(RT.anno[g.page.id]||[]).indexOf(a)+1;

          if(f.node.when) L.push('  - 渲染条件 when：`'+f.node.when+'`');
          if(f.node.state && f.node.state!=='normal') L.push('  - 当前状态：'+f.node.state);
        } else {

  L.push('1. 逐条给出处理结论（采纳 / 部分采纳 / 需澄清），每条一句话说明理由。');

  L.push('3. 每条已处理的标注：把 `status` 改为 `"resolved"`，并在 `replies` 追加 `{ "author": "AI", "text": "<具体改了什么>" }`。');
  L.push('4. 若改动影响需求条目（`requirements`），同步更新对应 REQ 的 `rule` / `expected` / `acceptance`。');
  L.push('5. 若某条标注意图不明确，**不要猜**：保留 `status: "open"`，并在回复中提出一个具体问题。');
  L.push('6. 新增或修改组件时，`type` 必须在 `references/05-component-states.md` 的白名单内。');
  L.push('7. 改完后运行 `python3 scripts/validate_prd_json.py XX-PRD.data.json`，确保 0 error 再交付。');
  L.push('8. 只输出改动部分，不要重贴整个 JSON。');
  return L.join('\n');

/* =====================================================================
   图布局引擎（全局画布 + PRD 流程图共用）
   ---------------------------------------------------------------------
   分层（layered / Sugiyama 简化版）：
     1) 有向边去重后，用 DFS 找出「回边」（指向栈上节点的边）并从图中摘掉 → 得到 DAG；
     2) 在 DAG 上 Kahn 拓扑 + 最长路径分层（所有节点都能处理到，层号即最短合法层）；
     3) 摘掉的那些边标记为回边（画虚线，不参与分层）；
     4) 同层内用重心法（barycenter）排 2 轮，减少连线交叉；
     5) 落坐标：主方向按层累加（用该层最大主尺寸对齐），交叉方向居中。
   纯函数，不碰 DOM，方便测试与复用。
   ===================================================================== */
function layeredLayout(ids, edges, opt){
  opt=opt||{};
  var dir=opt.dir||'LR';
  var gapMain=opt.gapMain==null?110:opt.gapMain;
  var gapCross=opt.gapCross==null?36:opt.gapCross;
  var sizeOf=opt.sizeOf||function(){ return {w:236,h:206}; };
  var index={}, adj={}, i, k;
  ids.forEach(function(id,ix){ index[id]=ix; adj[id]=[]; });
  var clean=[], seen={};
  (edges||[]).forEach(function(e){
    if(!e||index[e.from]===undefined||index[e.to]===undefined||e.from===e.to) return;
    k=e.from+'>'+e.to; if(seen[k]) return; seen[k]=1;
    adj[e.from].push(e.to); clean.push(e);
  });
  /* --- 1) 先用 DFS 断环：把「回边」摘掉，剩下的就是 DAG ---
     少了这一步，环上节点在「最长路径松弛」里会每轮 +1、永不收敛，
     层号一路涨到迭代上限 —— 画出来就是一张巨宽的图 + 横贯全屏的连线。 */
  var color={}, back={};
  ids.forEach(function(root){
    if(color[root]) return;
    var stack=[{id:root,i:0}]; color[root]=1;
    while(stack.length){
      var top=stack[stack.length-1], nb=adj[top.id];
      if(top.i<nb.length){
        var v=nb[top.i++];
        if(color[v]===1) back[top.id+'>'+v]=1;          /* 指向栈上节点 = 回边 */
        else if(!color[v]){ color[v]=1; stack.push({id:v,i:0}); }
      }else{ color[top.id]=2; stack.pop(); }
    }
  });
  /* --- 2) DAG 上做拓扑 + 最长路径分层（此时能处理到所有节点，层号即最短合法层） --- */
  var dagAdj={}, dagDeg={};
  ids.forEach(function(id){ dagAdj[id]=[]; dagDeg[id]=0; });
  clean.forEach(function(e){
    if(back[e.from+'>'+e.to]) return;
    dagAdj[e.from].push(e.to); dagDeg[e.to]++;
  });
  var layer={}, queue=[];
  ids.forEach(function(id){ if(dagDeg[id]===0){ layer[id]=0; queue.push(id); } });
  while(queue.length){
    var u=queue.shift();
    dagAdj[u].forEach(function(v){
      var cand=layer[u]+1;
      if(layer[v]===undefined||cand>layer[v]) layer[v]=cand;
      if(--dagDeg[v]<=0) queue.push(v);
    });
  }
  ids.forEach(function(id){ if(layer[id]===undefined) layer[id]=0; });
  /* --- 4) 同层重心排序 --- */
  var maxLayer=0;
  ids.forEach(function(id){ if(layer[id]>maxLayer) maxLayer=layer[id]; });
  var byLayer=[];
  for(i=0;i<=maxLayer;i++) byLayer[i]=[];
  ids.forEach(function(id){ byLayer[layer[id]].push(id); });
  var idx={};
  byLayer.forEach(function(arr){ arr.forEach(function(id,n){ idx[id]=n; }); });
  for(var round=0; round<2; round++){
    for(i=1;i<=maxLayer;i++){
      var bary={};
      byLayer[i].forEach(function(v,n){
        var sum=0,cnt=0;
        clean.forEach(function(e){
          if(e.to===v&&layer[e.from]===i-1&&idx[e.from]!==undefined){ sum+=idx[e.from]; cnt++; }
        });
        bary[v]=cnt?sum/cnt:n;
      });
      byLayer[i].sort(function(a,b){ return (bary[a]-bary[b])||(idx[a]-idx[b]); });
      byLayer[i].forEach(function(id,n){ idx[id]=n; });
    }
  }
  /* --- 5) 落坐标 --- */
  var layerMain=[], layerCross=[];
  for(i=0;i<=maxLayer;i++){
    var m=0,c=0;
    byLayer[i].forEach(function(id){
      var s=sizeOf(id), ms=(dir==='LR'?s.w:s.h), cs=(dir==='LR'?s.h:s.w);
      if(ms>m) m=ms;
      c+=cs+gapCross;
    });
    layerMain[i]=m; layerCross[i]=c>0?c-gapCross:0;
  }
  var off=[], acc=0;
  for(i=0;i<=maxLayer;i++){ off[i]=acc; acc+=layerMain[i]+gapMain; }
  var crossTotal=0;
  layerCross.forEach(function(c){ if(c>crossTotal) crossTotal=c; });
  var pos={};
  for(i=0;i<=maxLayer;i++){
    var cross=0;
    byLayer[i].forEach(function(id){
      var s=sizeOf(id), ms=(dir==='LR'?s.w:s.h), cs=(dir==='LR'?s.h:s.w);
      var mp=off[i]+(layerMain[i]-ms)/2;
      var cp=cross+(crossTotal-layerCross[i])/2;
      pos[id]= dir==='LR' ? {x:mp,y:cp} : {x:cp,y:mp};
      cross+=cs+gapCross;
    });
  }
  return { pos:pos, layer:layer, byLayer:byLayer, backEdges:back,
    w: dir==='LR' ? Math.max(0,acc-gapMain) : crossTotal,
    h: dir==='LR' ? crossTotal : Math.max(0,acc-gapMain),
    maxLayer:maxLayer };
}

/* 三次贝塞尔：按锚点所在边给出控制点方向，出线自然 */
function edgePath(p1,p2){
  var dx=p2.x-p1.x, dy=p2.y-p1.y;
  var len=Math.sqrt(dx*dx+dy*dy)||1;
  var k=Math.max(36,Math.min(150,len*0.45));
  var c1x=p1.x,c1y=p1.y,c2x=p2.x,c2y=p2.y;
  if(p1.s==='r') c1x+=k; else if(p1.s==='l') c1x-=k; else if(p1.s==='b') c1y+=k; else c1y-=k;
  if(p2.s==='r') c2x+=k; else if(p2.s==='l') c2x-=k; else if(p2.s==='b') c2y+=k; else c2y-=k;
  return { d:'M'+p1.x+','+p1.y+' C'+c1x+','+c1y+' '+c2x+','+c2y+' '+p2.x+','+p2.y,
    mx:(p1.x+3*c1x+3*c2x+p2.x)/8, my:(p1.y+3*c1y+3*c2y+p2.y)/8 };
}
/* 选矩形朝向目标的那条边的中点作为锚点 */
function sideAnchor(r,tx,ty){
  var cx=r.x+r.w/2, cy=r.y+r.h/2, dx=tx-cx, dy=ty-cy;
  if(Math.abs(dx)>=Math.abs(dy)*0.85) return dx>=0?{x:r.x+r.w,y:cy,s:'r'}:{x:r.x,y:cy,s:'l'};
  return dy>=0?{x:cx,y:r.y+r.h,s:'b'}:{x:cx,y:r.y,s:'t'};
}

/* =====================================================================
   Canvas overlay — 全局画布（页面关系图）
   ===================================================================== */
var CANVAS_SHOT_W=1280, CANVAS_SHOT_SCALE=0.184, CANVAS_NODE_W=236, CANVAS_NODE_H=206;
/* 卡片不能拖到内容盒左上角之外（负坐标不可达，会被滚动容器裁掉） */
var CANVAS_PAD=60;
var SVGNS='http://www.w3.org/2000/svg';

/* 从 interactions 抽出「页面 → 页面」有向边；entryFrom 作为弱边补充（虚线） */
function buildNavGraph(){
  var nodes=[], edges=[], map={};
  DATA.pages.forEach(function(p){ nodes.push(p.id); });
  DATA.pages.forEach(function(p){
    (p.interactions||[]).forEach(function(ix){
      (ix.actions||[]).forEach(function(a){
        if(a.type!=='navigate'||!a.pageId||!pageById(a.pageId)) return;
        var key=p.id+'>'+a.pageId;
        var lbl=ix.name||'';
        if(!lbl){
          var t=(ix.on||{}).target, hit=t?findNodeInTree(p.componentTree,t,null):null;
          lbl=(hit&&hit.node.props&&(hit.node.props.text||hit.node.props.title))||t||'';
        }
        if(map[key]){ if(lbl&&map[key].labels.indexOf(lbl)<0) map[key].labels.push(lbl); return; }
        var e={id:key,from:p.id,to:a.pageId,labels:lbl?[lbl]:[]};
        map[key]=e; edges.push(e);
      });
    });
    (p.entryFrom||[]).forEach(function(src){
      if(!pageById(src)) return;
      var key=src+'>'+p.id;
      if(map[key]) return;
      var e={id:key,from:src,to:p.id,labels:['入口'],weak:true};
      map[key]=e; edges.push(e);
    });
  });
  return {nodes:nodes,edges:edges};
}

function svgEl(tag,attrs,text){
  var e=document.createElementNS(SVGNS,tag);
  for(var k in (attrs||{})) e.setAttribute(k,attrs[k]);
  if(text!=null) e.textContent=text;
  return e;
}
function ensureArrowMarker(svg,id,color){
  var defs=svg.querySelector('defs');
  if(!defs){ defs=svgEl('defs'); svg.appendChild(defs); }
  if(defs.querySelector('#'+id)) return;
  var m=svgEl('marker',{id:id,viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'6',
    markerHeight:'6',orient:'auto-start-reverse'});
  m.appendChild(svgEl('path',{d:'M0,1 L9,5 L0,9 z',fill:color}));
  defs.appendChild(m);
}

function renderCanvas(){
  var overlay=$('#canvasOverlay'); overlay.classList.add('on');
  var world=$('#coWorld'), innerBox=$('#coInner'), svg=$('#coSvg'), scroll=$('#coScroll');
  Array.prototype.slice.call(innerBox.querySelectorAll('.co-node')).forEach(function(n){ n.remove(); });
  svg.innerHTML='';
  var graph=buildNavGraph();
  var strong=graph.edges.filter(function(e){ return !e.weak; }).length;
  $('#coSub').textContent=DATA.pages.length+' 个页面 · '+strong+' 条跳转'
    +(graph.edges.length-strong?(' + '+(graph.edges.length-strong)+' 条入口关系'):'');
  if(!DATA.pages.length){
    var em=h('div','co-empty',{text:'未检测到页面数据'});
    scroll.appendChild(em); return;
  }
  var sizeOf=function(){ return {w:CANVAS_NODE_W,h:CANVAS_NODE_H}; };
  var auto=layeredLayout(graph.nodes, graph.edges, {
    dir:RT.coDir, gapMain:RT.coDir==='LR'?110:80, gapCross:40, sizeOf:sizeOf });

  /* 位置：自动布局打底，人工拖过的位置覆盖上来（自动排列会清空人工位置）。
     坐标一律以内容盒左上角为原点、pad 为最小边距 —— 拖拽落盘的是同一套坐标，
     不能再用「pad - minX」做归一化：那样一旦被拖的卡片变成最左上，
     偏移量会跟着变，落盘坐标就会被二次平移（表现为「拖完一刷新又弹回去」）。 */
  var saved=(LS.canvasPos&&typeof LS.canvasPos==='object')?LS.canvasPos:{};
  var pos={};
  graph.nodes.forEach(function(id){
    var s=saved[id];
    var q=(RT.coAuto||!s)?auto.pos[id]:{x:s.x,y:s.y};
    pos[id]={x:Math.max(0,q.x||0), y:Math.max(0,q.y||0)};
  });

  var pad=CANVAS_PAD;
  RT.coOx=pad; RT.coOy=pad;

  /* 卡片：真实渲染该页组件树，缩到 18.4% 当缩略图 */
  var nodeEls={};
  graph.nodes.forEach(function(id){
    var page=pageById(id); if(!page) return;
    var p=pos[id]||{x:0,y:0};
    var card=h('div','co-node'+(id===RT.pageId?' co-cur':''));
    card.style.left=(p.x+pad)+'px'; card.style.top=(p.y+pad)+'px';
    card.setAttribute('data-page-id',id);
    var head=h('div','cn-head');
    head.appendChild(txt(page.name||id));
    head.appendChild(h('span','rt',{text:page.route||''}));
    card.appendChild(head);
    var shot=h('div','cn-shot'), inner=h('div','cn-inner');
    var st=stateOf(page,page.defaultStateId);
    var sv=RT.vars, so=RT.overrides;
    RT.vars={}; for(var k in (st.vars||{})) RT.vars[k]=st.vars[k];
    RT.overrides={}; (st.overrides||[]).forEach(function(o){ (RT.overrides[o.target]=RT.overrides[o.target]||{})[o.prop]=o.value; });
    try{
      var el=renderNode(page.componentTree||{type:'Layout'}, {vars:RT.vars,overrides:RT.overrides,hidden:{},visible:new Set(),mdStatic:true});
      if(el) inner.appendChild(el);
    }catch(e){ warn('画布缩略图渲染失败 '+id+': '+e.message); }
    RT.vars=sv; RT.overrides=so;
    inner.style.width=CANVAS_SHOT_W+'px'; inner.style.transform='scale('+CANVAS_SHOT_SCALE+')';
    shot.appendChild(inner); card.appendChild(shot);
    var foot=h('div','cn-foot');
    var nOpen=(RT.anno[id]||[]).filter(function(a){ return a.status==='open'; }).length;
    foot.appendChild(h('span','cn-badge',{text:'状态 '+(page.states||[]).length}));
    foot.appendChild(h('span','cn-badge',{text:'交互 '+(page.interactions||[]).length}));
    if(nOpen) foot.appendChild(h('span','cn-badge warn',{text:'待处理 '+nOpen}));
    if(id===RT.pageId) foot.appendChild(h('span','cn-badge blue',{text:'当前页'}));
    card.appendChild(foot);
    innerBox.appendChild(card);
    nodeEls[id]=card;
  });

  /* 内容盒尺寸：按真实卡片 rect 反推（人工拖拽后也成立），四周留 pad */
  syncCoContentBox();
  ensureArrowMarker(svg,'co-arrow','#98a2b3');
  ensureArrowMarker(svg,'co-arrow-hl',getComputedStyle(document.documentElement).getPropertyValue('--ant-primary').trim()||'#1677ff');

  /* 边：用真实 DOM 尺寸算锚点，画在卡片下层 */
  var rects={};
  graph.nodes.forEach(function(id){
    var el=nodeEls[id]; if(!el) return;
    rects[id]={x:el.offsetLeft,y:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight};
  });
  var edgeLayer=svgEl('g');
  graph.edges.forEach(function(e){
    var a=rects[e.from], b=rects[e.to]; if(!a||!b) return;
    var ac={x:a.x+a.w/2,y:a.y+a.h/2}, bc={x:b.x+b.w/2,y:b.y+b.h/2};
    var p1=sideAnchor(a,bc.x,bc.y), p2=sideAnchor(b,ac.x,ac.y);
    var geo=edgePath(p1,p2);
    var isBack=!!auto.backEdges[e.id]||!!e.weak;
    var hl=(e.from===RT.pageId||e.to===RT.pageId);
    var g=svgEl('g');
    g.appendChild(svgEl('path',{d:geo.d,class:'co-edge'+(isBack?' back':'')+(hl?' hl':''),
      'marker-end':'url(#'+(hl?'co-arrow-hl':'co-arrow')+')'}));
    g.appendChild(svgEl('path',{d:geo.d,class:'co-edge-hit'}));
    var label=e.labels&&e.labels.length?e.labels.slice(0,2).join(' / '):'';
    if(label){
      var w=label.length*6.6+12;
      g.appendChild(svgEl('rect',{x:geo.mx-w/2,y:geo.my-9,width:w,height:18,rx:4,
        fill:'#fff',stroke:'#f0f0f0','stroke-width':1}));
      g.appendChild(svgEl('text',{x:geo.mx,y:geo.my+0.5,class:'co-elabel'},label));
    }
    edgeLayer.appendChild(g);
  });
  svg.appendChild(edgeLayer);

  /* 图例 */
  var lg=$('#coLegend'); lg.innerHTML='';
  lg.appendChild(h('div',null,null,[h('span','k',{text:''}),txt('页面跳转（navigate）')]));
  lg.appendChild(h('div',null,null,[h('span','k dash',{text:''}),txt('入口关系 / 回边（虚线）')]));
  lg.appendChild(h('div',null,null,[h('span','k hl',{text:''}),txt('与当前页相关的跳转（高亮）')]));

  /* 拖拽移动卡片（位置写 localStorage） */
  if(!RT.coBound){
    RT.coBound=true;
    var drag=null;
    world.addEventListener('mousedown',function(e){
      var card=e.target.closest?e.target.closest('.co-node'):null;
      if(!card) return;
      e.preventDefault();
      /* 每次按下都重置「拖拽抑制点击」标记：它是一次性的，
         由本次按下的 mousemove 决定要不要吃掉紧随的 click */
      RT.coSuppressClick=false;
      drag={el:card,id:card.getAttribute('data-page-id'),
        sx:e.clientX, sy:e.clientY,
        ox:parseFloat(card.style.left)||0, oy:parseFloat(card.style.top)||0, moved:false};
      card.classList.add('dragging');
    });
    document.addEventListener('mousemove',function(e){
      if(!drag) return;
      var z=RT.coZoom||1;
      var dx=(e.clientX-drag.sx)/z, dy=(e.clientY-drag.sy)/z;
      if(Math.abs(dx)+Math.abs(dy)>3){ drag.moved=true; RT.coSuppressClick=true; }
      /* 钳到内容盒左上角之内，避免卡片被拖到不可达的负坐标区 */
      drag.el.style.left=Math.max(CANVAS_PAD,drag.ox+dx)+'px';
      drag.el.style.top=Math.max(CANVAS_PAD,drag.oy+dy)+'px';
      if(drag.moved) renderCanvasEdgesOnly();
    });
    document.addEventListener('mouseup',function(e){
      if(!drag) return;
      var d=drag; drag=null;
      d.el.classList.remove('dragging');
      if(!d.moved) return;
      LS.canvasPos=LS.canvasPos||{};
      LS.canvasPos[d.id]={x:(parseFloat(d.el.style.left)||0)-CANVAS_PAD,
        y:(parseFloat(d.el.style.top)||0)-CANVAS_PAD};
      RT.coAuto=false; lsSave();
      syncCoContentBox();      /* 拖到右/下时把内容盒撑大，保证滚得到 */
    });
    /* 点击卡片进入该页 */
    world.addEventListener('click',function(e){
      /* 拖完卡片，浏览器还会在 mouseup 后补一个 click（mousedown/mouseup 同一元素）。
         不吃掉它的话，「调整卡片位置」会被当成「点击卡片」—— 顺手跳页并关掉关系图。 */
      if(RT.coSuppressClick){ RT.coSuppressClick=false; return; }
      var card=e.target.closest?e.target.closest('.co-node'):null;
      if(!card) return;
      var id=card.getAttribute('data-page-id');
      if(!id) return;
      overlay.classList.remove('on');
      gotoPage(id);
      toast('已进入「'+((pageById(id)||{}).name||id)+'」','info');
    });
  }
  /* 缩放 / 平移 */
  applyCoZoom();
  scroll.scrollTop=0; scroll.scrollLeft=0;
}
/* 只重画连线（拖拽过程中调用，避免整块重建） */
function renderCanvasEdgesOnly(){
  var svg=$('#coSvg'), world=$('#coWorld');
  var g=svg.querySelector('g'); if(g) g.remove();
  var cards=Array.prototype.slice.call(world.querySelectorAll('.co-node'));
  var rects={};
  cards.forEach(function(el){ rects[el.getAttribute('data-page-id')]={x:el.offsetLeft,y:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight}; });
  var graph=buildNavGraph();
  var auto=layeredLayout(graph.nodes, graph.edges, {dir:RT.coDir,gapMain:110,gapCross:40,
    sizeOf:function(){return {w:CANVAS_NODE_W,h:CANVAS_NODE_H};}});
  var layer=svgEl('g');
  graph.edges.forEach(function(e){
    var a=rects[e.from], b=rects[e.to]; if(!a||!b) return;
    var ac={x:a.x+a.w/2,y:a.y+a.h/2}, bc={x:b.x+b.w/2,y:b.y+b.h/2};
    var p1=sideAnchor(a,bc.x,bc.y), p2=sideAnchor(b,ac.x,ac.y);
    var geo=edgePath(p1,p2);
    var isBack=!!auto.backEdges[e.id]||!!e.weak;
    var hl=(e.from===RT.pageId||e.to===RT.pageId);
    var gg=svgEl('g');
    gg.appendChild(svgEl('path',{d:geo.d,class:'co-edge'+(isBack?' back':'')+(hl?' hl':''),
      'marker-end':'url(#'+(hl?'co-arrow-hl':'co-arrow')+')'}));
    var label=e.labels&&e.labels.length?e.labels.slice(0,2).join(' / '):'';
    if(label){
      var w=label.length*6.6+12;
      gg.appendChild(svgEl('rect',{x:geo.mx-w/2,y:geo.my-9,width:w,height:18,rx:4,fill:'#fff',stroke:'#f0f0f0','stroke-width':1}));
      gg.appendChild(svgEl('text',{x:geo.mx,y:geo.my+0.5,class:'co-elabel'},label));
    }
    layer.appendChild(gg);
  });
  svg.appendChild(layer);
}
/* 内容盒尺寸 = 卡片包围盒 + 四周 pad。拖拽后卡片可能超出原包围盒，需要重算，
   否则拖到右/下的卡片会落到滚动范围之外（看得见但滚不到）。 */
function syncCoContentBox(){
  var inner=$('#coInner'), svg=$('#coSvg');
  if(!inner) return;
  var cards=Array.prototype.slice.call(inner.querySelectorAll('.co-node'));
  if(!cards.length) return;
  var maxX=0,maxY=0;
  cards.forEach(function(el){
    var r=el.offsetLeft+el.offsetWidth, b=el.offsetTop+el.offsetHeight;
    if(r>maxX) maxX=r; if(b>maxY) maxY=b;
  });
  var w=Math.ceil(maxX+CANVAS_PAD), h=Math.ceil(maxY+CANVAS_PAD);
  if(w===RT.coW&&h===RT.coH) return;
  RT.coW=w; RT.coH=h;
  inner.style.width=w+'px'; inner.style.height=h+'px';
  if(svg){ svg.setAttribute('width',w); svg.setAttribute('height',h); svg.setAttribute('viewBox','0 0 '+w+' '+h); }
  applyCoZoom();
}

/* 缩放：内容盒只改 transform；缩放盒尺寸 = 内容盒 × zoom，
   由 margin:auto 在视口里居中，同时它的尺寸就是滚动范围（不多不少） */
function applyCoZoom(){
  var z=RT.coZoom||1;
  var inner=$('#coInner'), world=$('#coWorld');
  if(inner) inner.style.transform='scale('+z+')';
  var w=RT.coW||0, h=RT.coH||0;
  if(world&&w){ world.style.width=Math.ceil(w*z)+'px'; world.style.height=Math.ceil(h*z)+'px'; }
  var zl=$('#coZoom'); if(zl) zl.textContent=Math.round(z*100)+'%';
}
function setCoZoom(z,cx,cy){
  var scroll=$('#coScroll');
  z=Math.max(0.2,Math.min(2.5,z));
  var old=RT.coZoom||1;
  if(cx!=null&&scroll){
    var sr=scroll.getBoundingClientRect();
    var px=(scroll.scrollLeft+cx-sr.left)/old, py=(scroll.scrollTop+cy-sr.top)/old;
    RT.coZoom=z; applyCoZoom();
    scroll.scrollLeft=px*z-(cx-sr.left); scroll.scrollTop=py*z-(cy-sr.top);
  } else { RT.coZoom=z; applyCoZoom(); }
  LS.coZoom=RT.coZoom; lsSave();
}
function fitCoCanvas(){
  var scroll=$('#coScroll'), world=$('#coWorld');
  /* 按「内容包围盒」取景，而不是世界盒：世界盒按布局坐标算，末尾会多留一档 pad，
     直接用它会向右下角留白；用真实卡片 rect 反推才能让内容刚好铺满。 */
  var cards=Array.prototype.slice.call(world.querySelectorAll('.co-node'));
  var maxX=0,maxY=0;
  cards.forEach(function(el){
    var r=el.offsetLeft+el.offsetWidth, b=el.offsetTop+el.offsetHeight;
    if(r>maxX) maxX=r; if(b>maxY) maxY=b;
  });
  if(!maxX||!maxY){ maxX=parseFloat(world.style.width)||1; maxY=parseFloat(world.style.height)||1; }
  var w=maxX+44, h=maxY+44;
  var z=Math.min((scroll.clientWidth-32)/w,(scroll.clientHeight-32)/h);
  setCoZoom(Math.max(0.2,Math.min(1,z)));
  scroll.scrollTop=0; scroll.scrollLeft=0;
}

function download(blob,name){
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
}
function collectCss(){
  var out='';
  try{ Array.prototype.slice.call(document.styleSheets).forEach(function(ss){
    try{ Array.prototype.slice.call(ss.cssRules).forEach(function(r){ out+=r.cssText+'\n'; }); }catch(e){}
  }); }catch(e){}
  return out;
}

/* 把任意元素连同样式序列化成 PNG（SVG foreignObject + canvas）。画布「导出全图」也走这里。 */
function exportElementPng(canvas, name){
  if(!canvas){ toast('导出失败：找不到目标元素','error'); return; }
  var w=Math.ceil(canvas.scrollWidth||canvas.offsetWidth||600);
  var hgt=Math.ceil(canvas.scrollHeight||canvas.offsetHeight||400);
  var clone=canvas.cloneNode(true);
  /* 去掉 transform，导出用真实尺寸 */
  clone.style.transform='none';
  var css=collectCss();
  var doc=document.implementation.createHTMLDocument('');
  var wrapper=doc.createElement('div');
  wrapper.setAttribute('class',canvas.className||'');
  wrapper.setAttribute('style','width:'+w+'px;height:'+hgt+'px;background:#f0f2f5;position:relative;overflow:hidden');
  var styleEl=doc.createElement('style'); styleEl.textContent=css;
  wrapper.appendChild(styleEl); wrapper.appendChild(clone);
  var xhtml;
  try{ xhtml=new XMLSerializer().serializeToString(wrapper); }catch(e){ toast('导出失败：序列化异常','error'); return; }
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+hgt+'"><foreignObject x="0" y="0" width="100%" height="100%">'+xhtml+'</foreignObject></svg>';
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var img=new Image();
  img.onload=function(){
    var c=document.createElement('canvas'); c.width=w*2; c.height=hgt*2;
    var g=c.getContext('2d'); g.scale(2,2); g.fillStyle='#fff'; g.fillRect(0,0,w,hgt); g.drawImage(img,0,0);
    URL.revokeObjectURL(url);
    c.toBlob(function(b){ download(b,name+'.png'); toast('已导出 '+name+'.png','success'); });
  };
  img.onerror=function(){ URL.revokeObjectURL(url); toast('导出失败，请改用浏览器打印为 PDF','warning'); };
  img.src=url;
}

/* 流程图在纯文本里降级成箭头链路，保证 Markdown 导出不丢结构 */
function flowToText(sec){
  var nodes=(sec.nodes||[]), edges=(sec.edges||[]);
  if(!nodes.length) return '（无流程节点）';
  var byId={}; nodes.forEach(function(n){ byId[n.id]=n; });
  var out=[];
  out.push('**节点**：'+nodes.map(function(n){ return (n.label||n.id)+(n.sub?('('+n.sub+')'):''); }).join(' → '));
  if(edges.length){
    out.push('');
    out.push('**流转**：');
    edges.forEach(function(e){
      var a=byId[e.from], b=byId[e.to];
      out.push('- '+(a?(a.label||e.from):e.from)+' —'+(e.label?('['+e.label+']'):'')+'→ '+(b?(b.label||e.to):e.to));
    });
  }
  return out.join('\n');
}

/* =====================================================================
   开发交接包（AI 可消费）
   ---------------------------------------------------------------------
   产出两份文件，配套使用：
   · <product>.devspec.json —— 机器可读的**唯一真源**：产品/模块/页面/组件树/
     状态/交互/需求/状态机/数据模型/页面图 + devNotes（待确认项）。
     AI 据此直接生成路由、页面骨架、mock 数据与接口契约。
   · AGENT.md —— 给 AI 开发者/评审者的阅读指引与实现约定。
   另有「AI 交接指令」一段可直接粘进对话，让 AI 按 devspec 落地。
   ===================================================================== */
function slug(s){
  return String(s||'product').replace(/[^\w\u4e00-\u9fa5\-]+/g,'-').replace(/^-+|-+$/g,'')||'product';
}
function buildPageGraph(){
  var g=buildNavGraph();
  return {
    nodes:g.nodes.map(function(id){
      var p=pageById(id)||{};
      return {id:id,name:p.name||id,route:p.route||'',moduleId:p.moduleId||'',
        parentId:p.parentId||null,goal:p.goal||'',entryFrom:p.entryFrom||[],exitTo:p.exitTo||[]};
    }),
    edges:g.edges.map(function(e){ return {from:e.from,to:e.to,labels:e.labels||[],kind:e.weak?'entry':'navigate'}; })
  };
}
function devNotes(){
  var out=[];
  (DATA.openQuestions||[]).forEach(function(q){
    if(q.status==='resolved') return;
    out.push({level:q.status==='assumed'?'assumption':'open',text:(q.question||'')+(q.answer?('　→ 暂定：'+q.answer):'')});
  });
  (DATA.requirements||[]).forEach(function(r){
    if(r.status==='draft') out.push({level:'draft-requirement',text:(r.id||'')+'「'+(r.title||'')+'」尚未确认'});
    if(r.source==='inferred') out.push({level:'inferred',text:(r.id||'')+'「'+(r.title||'')+'」为 AI 推断，需人工确认'});
  });
  if(!((DATA.dataModel&&DATA.dataModel.entities)||[]).length)
    out.push({level:'missing',text:'未提供 dataModel，后端建模与接口契约需自行补全'});
  (DATA.pages||[]).forEach(function(p){
    if(!(p.interactions||[]).length && DATA.pages.length>1)
      out.push({level:'missing',text:'页面「'+(p.name||p.id)+'」没有任何 interactions，无法验证跳转'});
  });
  (DATA.stateMachines||[]).forEach(function(m){
    var cs=(DATA.capabilities||[]).filter(function(c){ return (c.entity||m.entity)===m.entity; });
    if(!cs.length)
      out.push({level:'missing',text:'状态机「'+(m.name||m.id)+'」没有任何命令策略（capabilities），各状态下按钮该可用还是置灰无从判断'});
  });
  return out;
}
function buildDevSpec(){
  return {
    '$schema':'XX-PRD/devspec@1',
    generatedAt:new Date().toISOString(),
    meta:deep(DATA.meta||{}),
    product:DATA.product||{},
    users:DATA.users||[],
    userFlows:DATA.userFlows||[],
    modules:DATA.modules||[],
    dataModel:DATA.dataModel||{entities:[]},
    components:DATA.components||[],
    stateMachines:DATA.stateMachines||[],
    capabilities:DATA.capabilities||[],
    requirements:DATA.requirements||[],
    boardPlan:DATA.boardPlan||[],
    glossary:DATA.glossary||[],
    openQuestions:DATA.openQuestions||[],
    pageGraph:buildPageGraph(),
    devNotes:devNotes(),
    pages:(DATA.pages||[]).map(function(p){
      return {
        id:p.id, name:p.name||'', route:p.route||'', moduleId:p.moduleId||'', parentId:p.parentId||null,
        goal:p.goal||'', layout:p.layout||'', defaultStateId:p.defaultStateId||'',
        entity:p.entity||null, contract:p.contract||null,
        entryFrom:p.entryFrom||[], exitTo:p.exitTo||[],
        componentTree:p.componentTree||null,
        states:p.states||[], interactions:p.interactions||[],
        prd:p.prd||null,
        annotations:(RT.anno[p.id]||[]).map(function(a){
          return {id:a.id,nodeId:(a.anchor||{}).nodeId||'',text:a.text||'',category:a.category||'',
            status:a.status||'open',author:a.author||'',replies:a.replies||[]};
        })
      };
    })
  };
}

/* 复制到剪贴板：优先 Clipboard API，降级 execCommand */
function copyText(text,okMsg){
  var done=function(){ toast(okMsg||'已复制','success'); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,function(){ fallback(); });
  }else{ fallback(); }
  function fallback(){
    try{
      var ta=document.createElement('textarea'); ta.value=text;
      ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove(); done();
    }catch(e){ toast('复制失败，请手动选中文本复制','warning'); }
  }
}

/* =====================================================================
   Navigation & toolbar
   ---------------------------------------------------------------------
   页面切换统一由 URL hash（#/page-id）驱动：
   · gotoPage() 入栈并写 hash；applyPage() 只做状态与渲染，不碰历史
   · 浏览器前进/后退 → hashchange → applyPage(noPush)
   · 容器内「返回」→ back 动作 / Header 返回箭头 → goBack()（优先自有栈，
     栈空则回退到信息架构上的入口页 entryFrom[0]，绝不跳出容器）
   ===================================================================== */
function pageIdFromHash(){
  var m=/^#\/?([A-Za-z0-9_\-]+)/.exec(location.hash||'');
  return m?m[1]:null;
}
function setHash(id){
  var want='#/'+id;
  if(location.hash!==want){ try{ location.hash=want; }catch(e){} }
}
/* 真正切页：只负责状态与渲染。opts.stateId 指定目标状态，opts.params 写入 RT.vars */
function applyPage(id,opts){
  opts=opts||{};
  var page=pageById(id); if(!page) return false;
  RT.pageId=id;
  var want=opts.stateId;
  var okState=!!(want&&(page.states||[]).some(function(s){return s.id===want;}));
  RT.stateId=okState?want:(page.defaultStateId||((page.states||[])[0]||{}).id);
  try{ applyState(); }catch(e){ warn('状态应用失败: '+e.message); }
  if(opts.params&&typeof opts.params==='object'){ for(var k in opts.params) RT.vars[k]=opts.params[k]; }
  revealCurrent();
  renderAll();
  setHash(id);
  /* hash 是当前页的第一真源；LS 仅作为「hash 被抹掉」时的兜底 */
  LS.pageId=RT.pageId; LS.stateId=RT.stateId;
  lsSave();
  /* F6：切到作业型列表页就折 PRD（不写 LS）。放在 renderAll 之后 ——
     pane 的 offsetWidth 要在布局出来后才量得准。 */
  try{ maybeAutoFoldPrd(); }catch(e){}
  return true;
}
/* 跳转页面（默认入栈）。opts.noPush=true 用于返回/外部驱动，避免污染栈 */
function gotoPage(id,opts){
  opts=opts||{};
  if(!pageById(id)){ warn('跳转目标不存在: '+id); return; }
  if(id!==RT.pageId&&!opts.noPush) RT.navStack.push(RT.pageId);
  applyPage(id,opts);
}
/* 返回：优先自有栈；栈空则回退到 IA 入口页；都没有就提示 */
function goBack(){
  var prev=null, c;
  while(RT.navStack.length){ c=RT.navStack.pop(); if(c&&c!==RT.pageId&&pageById(c)){ prev=c; break; } }
  if(!prev){
    var p=curPage();
    prev=((p&&p.entryFrom)||[]).filter(function(x){return pageById(x)})[0]||null;
  }
  if(!prev){ toast('已是起始页，没有可返回的页面','info'); return; }
  applyPage(prev,{noPush:true});
  toast('已返回：'+pageById(prev).name,'info');
}
/* 页内定位：把画布滚到某节点并短暂高亮（配合放大查看） */
function scrollToNode(nodeId){
  var scroll=$('#protoScroll'), cv=$('#protoCanvas');
  if(!scroll||!cv) return;
  var el=nodeId?$('[data-node-id="'+nodeId+'"]',cv):null;
  if(!el){
    scroll.scrollTop=0; scroll.scrollLeft=0;
    toast(nodeId?('页内定位失败：找不到节点 '+nodeId):'已回到画布顶部','warning');
    return;
  }
  var sr=scroll.getBoundingClientRect(), er=el.getBoundingClientRect();
  var top=scroll.scrollTop+(er.top-sr.top)-Math.max(0,(scroll.clientHeight-er.height)/2);
  var left=scroll.scrollLeft+(er.left-sr.left)-Math.max(0,(scroll.clientWidth-er.width)/2);
  scroll.scrollTop=Math.max(0,top); scroll.scrollLeft=Math.max(0,left);
  el.classList.add('iprd-flash');
  setTimeout(function(){ el.classList.remove('iprd-flash'); },1300);
}

/* =====================================================================
   Left nav tree  (模块 → 页面 → 子页面)
   ===================================================================== */
var NAV_NONE='__none__';
function navOpenMap(){ if(!LS.navOpen||typeof LS.navOpen!=='object') LS.navOpen={}; return LS.navOpen; }
function navOpen(id){ var m=navOpenMap(); return m[id]===undefined ? true : !!m[id]; }
function setNavOpen(id,v){ var m=navOpenMap(); m[id]=!!v; lsSave(); }

/* 页面归属模块：优先 page.moduleId，其次反查 modules[].pageIds */
function pageModuleId(p){
  if(p.moduleId && DATA.modules.some(function(m){return m.id===p.moduleId})) return p.moduleId;
  var m=DATA.modules.filter(function(mm){ return (mm.pageIds||[]).indexOf(p.id)>=0; })[0];
  return m ? m.id : NAV_NONE;
}
/* 祖先链（根 → 父），带环保护 */
function pageChain(p){
  var out=[], seen={}, cur=p, guard=0;
  while(cur && cur.parentId && guard++<20){
    var par=pageById(cur.parentId);
    if(!par || seen[par.id]) break;
    seen[par.id]=1; out.unshift(par); cur=par;
  }
  return out;
}
/* 构建导航模型：模块（含空模块）+ 未分组；页面按 parentId 递归成树 */
function buildNavModel(){
  var groups=DATA.modules.map(function(m){
    return {id:m.id,name:m.name||m.id,priority:m.priority||'',root:[]};
  });
  var byMod={}; groups.forEach(function(g){ byMod[g.id]=g; });
  var none={id:NAV_NONE,name:'未分组',priority:'',root:[]};
  var childrenOf={};
  DATA.pages.forEach(function(p){ if(p.parentId){ (childrenOf[p.parentId]=childrenOf[p.parentId]||[]).push(p); } });
  function wrap(p,depth){
    var kids=(depth<6?(childrenOf[p.id]||[]):[]).map(function(c){ return wrap(c,depth+1); });
    return {page:p,kids:kids};
  }
  DATA.pages.forEach(function(p){
    var par=p.parentId?pageById(p.parentId):null;
    if(par) return;                       /* 非顶级，作为子节点挂载 */
    var g=byMod[pageModuleId(p)]||none;
    g.root.push(wrap(p,1));
  });
  var out=groups.slice();
  if(none.root.length) out.push(none);
  return out;
}
function pageHit(p,f){
  return ((p.name||'')+' '+(p.route||'')+' '+(p.id||'')+' '+(p.goal||'')).toLowerCase().indexOf(f)>=0;
}
function openAnnoCount(pid){ return (RT.anno[pid]||[]).filter(function(a){return a.status==='open'}).length; }

function navPageRow(node,depth,vis,modHit){
  var p=node.page, hasKids=node.kids.length>0, open=navOpen(p.id);
  var row=h('div','nav-row'+(p.id===RT.pageId?' sel':''));
  row.setAttribute('data-page-id',p.id);
  row.title=(p.name||p.id)+(p.route?('　'+p.route):'')+(p.goal?('\n'+p.goal):'');
  row.style.paddingLeft=(8+depth*13)+'px';
  var care=h('span','caret'+(hasKids?(open?' open':''):' leaf'),{text:'▶'});
  if(hasKids) care.onclick=function(e){ e.stopPropagation(); setNavOpen(p.id,!navOpen(p.id)); renderNav(); };
  row.appendChild(care);
  row.appendChild(h('span','nm',{text:p.name||p.id}));
  if(p.route) row.appendChild(h('span','rt',{text:p.route}));
  var oc=openAnnoCount(p.id);
  if(oc) row.appendChild(h('span','nb',{text:String(oc),title:oc+' 条待处理标注'}));
  row.onclick=function(){ if(p.id!==RT.pageId) gotoPage(p.id); };
  return row;
}
function appendPageRows(box,list,depth,vis,modHit){
  list.forEach(function(node){
    var p=node.page;
    if(vis && !modHit && !vis[p.id]) return;
    box.appendChild(navPageRow(node,depth,vis,modHit));
    if(navOpen(p.id) && node.kids.length) appendPageRows(box,node.kids,depth+1,vis,modHit);
  });
}
function subtreeHit(node,vis){
  if(vis[node.page.id]) return true;
  return node.kids.some(function(k){ return subtreeHit(k,vis); });
}
function countNodes(list){ var n=0; (function w(l){ l.forEach(function(x){ n++; w(x.kids); }); })(list); return n; }
function renderNav(){
  var box=$('#navTree'); if(!box) return;
  var model=buildNavModel();
  var f=($('#navFilter').value||'').trim().toLowerCase();
  box.innerHTML='';

  /* 筛选：命中页面 + 其祖先 + 命中模块 */
  var vis=null, modHit={};
  if(f){
    vis={};
    model.forEach(function(g){
      if(g.name.toLowerCase().indexOf(f)>=0){ modHit[g.id]=true; return; }
      (function w(list,anc){
        list.forEach(function(n){
          if(pageHit(n.page,f)){ vis[n.page.id]=true; anc.forEach(function(a){vis[a]=true;}); }
          w(n.kids,anc.concat([n.page.id]));
        });
      })(g.root,[]);
    });
  }
  var total=0; model.forEach(function(g){ total+=countNodes(g.root); });
  var nc=$('#navCount'); if(nc) nc.textContent=total+' 页';

  var shown=0;
  model.forEach(function(g){
    var hasModHit=!!modHit[g.id];
    if(f && !hasModHit && !g.root.some(function(n){ return subtreeHit(n,vis); })) return;
    var open = f ? true : navOpen(g.id);
    var gEl=h('div','nav-grp');
    var head=h('div','nav-row grp');
    head.appendChild(h('span','caret'+(open?' open':''),{text:'▶'}));
    head.appendChild(h('span','nm',{text:g.name}));
    if(g.priority) head.appendChild(h('span','ptag '+String(g.priority).toLowerCase(),{text:g.priority}));
    var gc=countNodes(g.root);
    if(gc) head.appendChild(h('span','cnt',{text:gc+' 页',title:'含子页面共 '+gc+' 页'}));
    head.onclick=function(){ setNavOpen(g.id,!navOpen(g.id)); renderNav(); };
    gEl.appendChild(head);
    if(open){
      if(!g.root.length) gEl.appendChild(h('div','nav-empty',{text:'该模块暂无页面'}));
      else appendPageRows(gEl,g.root,1,vis,hasModHit);
    }
    box.appendChild(gEl); shown++;
  });
  if(!shown){
    var n=h('div','nav-none');
    n.appendChild(h('div',null,{text:'没有匹配的页面'}));
    n.appendChild(h('div',null,{html:'试试清空筛选，或检查 <code>pages[].moduleId</code> / <code>modules[].pageIds</code>'}));
    box.appendChild(n);
  }
  var sel=box.querySelector('.nav-row.sel');
  if(sel && sel.scrollIntoView){ try{ sel.scrollIntoView({block:'nearest'}); }catch(e){ try{ sel.scrollIntoView(false); }catch(e2){} } }
}
