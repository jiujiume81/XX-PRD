/* =====================================================================
   F6 · A 层：作业型列表页自动折叠 PRD（保留导航）
   ---------------------------------------------------------------------
   为什么要有它：P15 量的是「默认态评审面板宽」——三栏全开时 pane 只有 856
   （1600 档）/ 696（1440 档），目标 1342 / 1182。作业型列表页的价值在「一屏多行」，
   默认就摆一块 PRD 等于把 480px 永久租给一个还没看的文档。
   折叠后保留导航（P15 的目标数就是「保留 nav」下算出来的）。
   ===================================================================== */
function contentDirectTables(page){
  /* 与 tests/check_ui_shape.py 的 content_direct_tables **同口径**：
     只下钻 Space/Row/Col/Divider/Content，不钻 Card/Form/Drawer/Table ——
     详情页的明细表被 Card 包着，不该算「列表页」。
     改这里必须同时改判据，否则「今天几个列表页」两边会各说各的。 */
  if(!page) return [];
  var C=null;
  (function find(n){
    if(!n||C) return;
    if(n.type==='Content'){ C=n; return; }
    (n.children||[]).forEach(find);
  })(page.componentTree||{});
  if(!C) return [];
  var out=[], stack=(C.children||[]).slice();
  while(stack.length){
    var n=stack.shift();
    if(!n||typeof n!=='object') continue;
    if(n.type==='Table') out.push(n);
    else if(n.type==='Space'||n.type==='Row'||n.type==='Col'||n.type==='Divider'||n.type==='Content'){
      stack=stack.concat(n.children||[]);
    }
  }
  return out;
}
function isWorkListPage(page){
  /* 取判据口径里**更严的那一半**：Content 直属有 Table 且带 pagination。
     check_ui_shape 还允许「≥5 行数据」兜底（给没有分页的老产物），容器不采用 ——
     自动折叠是主动行为，宁可少折一次，也不要在详情页上突然把 PRD 收走。 */
  return contentDirectTables(page).some(function(t){
    return !!(t.props&&t.props.pagination);
  });
}
var PRD_AUTOFOLD_HINTED=false;   /* 每个产物只提示一次；内存变量，**不落 localStorage**（D-1） */
/* 每页只做一次「初态」：key 是 pageId。为什么要记这个 ——
   F6 只决定「首次进入这类页面时谁折叠」，不决定「用户显式展开之后的结果」。
   不记的话，用户手动点开 PRD、切到新建页再切回来，PRD 又会被自动收走，
   看起来像「点了没用」。同理，第二次进入也不该再弹一次提示。 */
var PRD_AUTOFOLD_SEEN={};
function maybeAutoFoldPrd(){
  var page=curPage();
  if(!page) return;
  var pid=page.id||'';
  if(PRD_AUTOFOLD_SEEN[pid]) return;          /* 本页已初始化：之后的开/合全由用户决定 */
  if(!isWorkListPage(page)) return;           /* 非列表页不记账：将来若改成列表页，仍能折一次 */
  PRD_AUTOFOLD_SEEN[pid]=true;
  var pane=$('#panePrd');
  if(!pane) return;
  if(pane.classList.contains('collapsed')) return;   /* 已经折了（含用户手动折的）就别再动 */
  setPrdCollapsed(true,false);
  if(!PRD_AUTOFOLD_HINTED){
    PRD_AUTOFOLD_HINTED=true;
    toast('已切到全宽：列表页默认收起 PRD，点右上角「PRD」可展开','info');
  }
}
/* 「全宽预览」：一键折 nav + PRD，用于临时换到最大画布（再点退出） */
var FULLW_ON=false, FULLW_PRV=null;
function setFullWidth(v){
  var on=!!v;
  if(on&&!FULLW_ON){
    /* 进来前先记住两侧原状，退出时按**原样**还原，不按「页面类型的默认态」还原：
       用户如果先手动展开了 PRD 再点全宽，退出时不该被收走。 */
    var pn=document.querySelector('#paneNav'), pp=document.querySelector('#panePrd');
    FULLW_PRV={nav:!!(pn&&pn.classList.contains('collapsed')),
               prd:!!(pp&&pp.classList.contains('collapsed'))};
  }
  FULLW_ON=on;
  setNavCollapsed(FULLW_ON,false);
  setPrdCollapsed(FULLW_ON?true:(FULLW_PRV?FULLW_PRV.prd:isWorkListPage(curPage())),false);
  if(!FULLW_ON&&FULLW_PRV) setNavCollapsed(FULLW_PRV.nav,false);
  var b=$('#fullWidth');
  if(b){ b.classList.toggle('on',FULLW_ON); b.textContent=FULLW_ON?'退出全宽':'全宽预览'; }
}

/* ---------- 右栏 PRD 面板：像素制定宽 + 折叠 ----------
   历史 bug：旧实现把中栏写成 `flex:0 0 <ratio>%` 且 ratio 钳在 [0.25,0.8]，
   一旦拖到极值，中栏拿到的是百分比基准，右栏又是 `flex:1 1 auto`（基准=内容宽，
   宽表格时内容宽很大），两者互相挤压后 splitter 的实际位置与鼠标位置脱钩，
   表现为「拖到最小后拖不回来」。改为：右栏像素定宽 + 双侧最小宽钳制 + 落盘，
   拖拽就是线性可逆的，且双击 splitter 可一键复位。 */
var PRD_MIN_W=300, PRD_MAX_RATIO=0.72, PRD_DEFAULT_W=480;
function wsAvail(){
  var ws=document.querySelector('.workspace');
  var w=ws?ws.getBoundingClientRect().width:1200;
  var navW=$('#paneNav')&&$('#paneNav').classList.contains('collapsed')?0:($('#paneNav')?$('#paneNav').offsetWidth+6:0);
  return {w:w, navW:navW, avail:Math.max(1,w-navW)};
}
function clampPrdWidth(px){
  var a=wsAvail();
  /* 上限：既不超过可用宽的 72%，也要给中栏留出至少 320px */
  var byRatio=Math.floor(a.avail*PRD_MAX_RATIO);
  var byPrototype=a.avail-6-320;
  var max=Math.max(PRD_MIN_W,Math.min(byRatio,byPrototype));
  return Math.max(PRD_MIN_W,Math.min(max,Math.round(px||0)));
}
function setPrdWidth(px,persist){
  var pane=$('#panePrd'); if(!pane) return;
  if(pane.classList.contains('collapsed')){ if(persist!==false){ LS.prdWidth=clampPrdWidth(px); lsSave(); } return; }
  var w=clampPrdWidth(px);
  pane.style.flex='0 0 '+w+'px'; pane.style.width=w+'px';
  if(persist!==false){ LS.prdWidth=w; lsSave(); }
}
function setPrdCollapsed(v,persist){
  var ws=document.querySelector('.workspace'), pane=$('#panePrd'); if(!ws||!pane) return;
  if(v){
    if(!pane.classList.contains('collapsed')){ LS.prdWidth=pane.offsetWidth||LS.prdWidth||PRD_DEFAULT_W; }
    pane.classList.add('collapsed'); ws.classList.add('prd-collapsed');
  }else{
    pane.classList.remove('collapsed'); ws.classList.remove('prd-collapsed');
    setPrdWidth(LS.prdWidth||PRD_DEFAULT_W,false);
  }
  /* persist===false 时不写 LS —— F6 的「自动折叠」用它：
     默认折叠是每次打开都一致的体验（D-1），不是用户偏好，落盘会让下次打开别的页也保持折叠。 */
  if(persist!==false){ LS.prdCollapsed=!!v; lsSave(); }
  var t=$('#prdToggle'); if(t) t.textContent=v?'PRD ›':'PRD ‹';
  try{ applyZoom(); positionBubbles(); }catch(e){}
}

function renderAll(){
  /* 分块容错：任一区域渲染失败不影响其余区域，并计入警告角标 */
  try{ renderNav(); }catch(e){ warn('页面导航渲染失败: '+e.message); }
  try{ renderCrumb(); }catch(e){ warn('面包屑渲染失败: '+e.message); }
  try{ renderProto(); }catch(e){ warn('原型渲染失败: '+e.message); }
  try{ renderPrd(); }catch(e){ warn('PRD 渲染失败: '+e.message); }
  try{ syncToolbar(); }catch(e){ warn('工具栏同步失败: '+e.message); }
}

/* =====================================================================
   Init
   ===================================================================== */
function init(){
  lsLoad();
  /* 页面来源优先级：URL hash（可分享/可后退）> localStorage > meta.currentPageId > 首个页面 */
  RT.pageId=pageIdFromHash()||LS.pageId||DATA.meta.currentPageId||(DATA.pages[0]||{}).id;
  if(!pageById(RT.pageId)) RT.pageId=(DATA.pages[0]||{}).id;
  /* 建立 hash 基线：避免浏览器后退键直接退出容器 */
  if(RT.pageId){ try{ history.replaceState(null,'','#/'+RT.pageId); }catch(e){} }
  RT.review=!!LS.review;
  RT.annoVisible=LS.annoVisible!==false;
  RT.zoom=(typeof LS.zoom==='number'&&LS.zoom>=ZOOM_MIN&&LS.zoom<=ZOOM_MAX)?LS.zoom:1;
  DATA.pages.forEach(function(p){ RT.anno[p.id]=deep(p.annotations||[]); });
  if(LS.anno){ for(var pid in LS.anno){ RT.anno[pid]=LS.anno[pid]; } }
  try{ applyState(); }catch(e){ warn('状态初始化失败: '+e.message); }
  /* 左侧导航：恢复宽度 / 折叠态，并展开当前页所在路径 */
  if(LS.navWidth){ var w=parseInt(LS.navWidth,10); if(w>=160&&w<=460) $('#paneNav').style.width=w+'px'; }
  revealCurrent();
  setNavCollapsed(!!LS.navCollapsed);
  /* 右栏 PRD：恢复宽度 / 折叠态 */
  setPrdWidth(typeof LS.prdWidth==='number'?LS.prdWidth:PRD_DEFAULT_W,false);
  setPrdCollapsed(!!LS.prdCollapsed);
  /* 全局画布：恢复缩放与排布方向 */
  RT.coZoom=(typeof LS.coZoom==='number'&&LS.coZoom>=0.2&&LS.coZoom<=2.5)?LS.coZoom:1;
  if(LS.coDir==='TB'||LS.coDir==='LR') RT.coDir=LS.coDir;
  $$('#coDir button').forEach(function(x){ x.classList.toggle('on',x.getAttribute('data-dir')===RT.coDir); });
  if(LS.canvasPos&&typeof LS.canvasPos==='object'&&Object.keys(LS.canvasPos).length) RT.coAuto=false;
  renderAll();
  /* F6：首屏若是作业型列表页，进页即折 PRD（与 applyPage 里的同一处理） */
  try{ maybeAutoFoldPrd(); }catch(e){}
  try{ setupZoomPan(); }catch(e){ warn('缩放/平移初始化失败: '+e.message); }

  $('#stateSelect').onchange=function(){ RT.stateId=this.value; applyState(); renderProto(); renderPrd(); };
  $('#entitySelect').onchange=function(){
    var p=curPage(); if(!p||!p.entity) return;
    RT.entState[p.entity]=this.value;
    renderProto(); renderPrd();
  };
  $('#protoCanvas').addEventListener('click',onCanvasClick);
  /* 浏览器前进/后退 → 切页。由 hash 驱动，故清空自有栈避免与历史栈打架 */
  window.addEventListener('hashchange',function(){
    var id=pageIdFromHash();
    if(!id||id===RT.pageId) return;
    /* URL 指向不存在的页面：把 hash 拉回当前页，保证「URL = 当前页」这条不变量成立，
       否则刷新会落到一个坏 URL 上；同时不白屏、不切页。 */
    if(!pageById(id)){
      warn('URL 指向的页面不存在: '+id);
      toast('页面不存在：'+id,'warning');
      try{ history.replaceState(null,'','#/'+RT.pageId); }catch(e){}
      return;
    }
    RT.navStack=[];
    applyPage(id,{noPush:true});
  });
  $('#annoLayer').addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('[data-anno-id]'):null;
    if(b){ openAnnoPop(b.getAttribute('data-anno-id'),false); }
  });
  document.addEventListener('click',function(e){
    var pop=e.target.closest?e.target.closest('.anno-pop'):null;
    var bub=e.target.closest?e.target.closest('[data-anno-id]'):null;
    if(!pop&&!bub&&RT.activeAnno) closeAnnoPop();
  });

  $('#btnAnnotate').onclick=function(){ RT.annotate=!RT.annotate; if(!RT.annotate) closeAnnoPop();
    if(RT.annotate&&RT.pan) setPan(false);
    renderProto(); syncToolbar();
    toast(RT.annotate?'标注模式已开启：点击原型任意位置提意见':'标注模式已关闭','info'); };
  $('#btnReview').onclick=function(){ RT.review=!RT.review; LS.review=RT.review; lsSave(); renderAll();
    toast(RT.review?'审核模式：已隐藏过程产物':'已退出审核模式','info'); };
  $('#btnShaping').onclick=function(){ openDrawer('过程产物（Shaping Docs）',shapingNodes()); };
  $('#btnAnnoList').onclick=function(){ openDrawer('当前页标注（'+((RT.anno[RT.pageId]||[]).length)+'）',annoListNodes()); };
  $('#btnPrompt').onclick=openPromptDrawer;
  $('#btnDevkit').onclick=openDevkitDrawer;
  /* ---------- 全局画布（页面关系图） ---------- */
  $('#btnCanvas').onclick=function(){ renderCanvas(); };
  $('#coClose').onclick=function(){ $('#canvasOverlay').classList.remove('on'); };
  $('#coArrange').onclick=function(){
    RT.coAuto=true; LS.canvasPos={}; lsSave(); renderCanvas();
    toast('已按信息架构重新排列','success');
  };
  $('#coFit').onclick=fitCoCanvas;
  $('#coOut').onclick=function(){ setCoZoom((RT.coZoom||1)/1.15); };
  $('#coIn').onclick=function(){ setCoZoom((RT.coZoom||1)*1.15); };
  $('#coDir').addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('button[data-dir]'):null; if(!b) return;
    RT.coDir=b.getAttribute('data-dir'); RT.coAuto=true; LS.canvasPos={}; lsSave();
    $$('#coDir button').forEach(function(x){ x.classList.toggle('on',x===b); });
    renderCanvas();
  });
  /* 导出用未缩放的内容盒，拿到的是全分辨率整图（不受当前 zoom 影响） */
  $('#coPng').onclick=function(){ exportElementPng($('#coInner'),(DATA.meta.product||'product')+'-页面关系图'); };
  /* 滚轮：默认平移；⌘/Ctrl + 滚轮缩放（锚点为指针位置） */
  $('#coScroll').addEventListener('wheel',function(e){
    if(e.ctrlKey||e.metaKey){
      e.preventDefault();
      var k=e.deltaY<0?1.1:1/1.1;
      setCoZoom((RT.coZoom||1)*k,e.clientX,e.clientY);
    }else{
      var sc=e.currentTarget;
      if(e.shiftKey){ sc.scrollLeft+=e.deltaY; }
      else{ sc.scrollLeft+=e.deltaX; sc.scrollTop+=e.deltaY; }
      if(e.deltaX||e.deltaY) e.preventDefault();
    }
  },{passive:false});
  $('#coScroll').addEventListener('mousedown',function(e){
    if(e.target.closest&&e.target.closest('.co-node')) return;
    /* 空白处按住拖动 = 平移视图 */
    var sc=e.currentTarget, sx=e.clientX, sy=e.clientY, l=sc.scrollLeft, t=sc.scrollTop, moved=false;
    RT.coSuppressClick=false;
    sc.style.cursor='grabbing';
    var mv=function(ev){
      if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>3) moved=true;
      sc.scrollLeft=l-(ev.clientX-sx); sc.scrollTop=t-(ev.clientY-sy);
    };
    var up=function(){
      sc.style.cursor='';
      /* 从空白处起手、拖到卡片上松手时，click 会落到卡片上 —— 同样要吃掉 */
      if(moved) RT.coSuppressClick=true;
      document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up);
    };
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  });
  $('#btnPng').onclick=exportPng;
  /* 流程图放大浮层：按钮 / 点遮罩 / Esc 均可关闭 */
  var fz=$('#flowZoom');
  if(fz){
    fz.addEventListener('click',function(e){ if(e.target===fz) closeFlowZoom(); });
    var fzc=$('#fzClose'); if(fzc) fzc.onclick=closeFlowZoom;
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape'&&fz.classList.contains('on')){ closeFlowZoom(); }
    });
  }
  $('#btnMd').onclick=exportMd;
  $('#btnReset').onclick=function(){
    if(!confirm('将清空本地编辑与标注，恢复 AI 初始版本。确定？')) return;
    try{ localStorage.removeItem(LSKEY); }catch(e){} location.reload();
  };
  $$('[data-close]').forEach(function(el){ el.onclick=closeDrawer; });

  /* 左侧导航交互 */
  $('#navCollapse').onclick=function(){ setNavCollapsed(true); };
  $('#btnNav').onclick=function(){ setNavCollapsed(!$('#paneNav').classList.contains('collapsed')); };
  var nf=$('#navFilter');
  nf.addEventListener('input',function(){ renderNav(); });
  nf.addEventListener('keydown',function(e){ if(e.key==='Escape'){ nf.value=''; renderNav(); } });
  $('#navTree').addEventListener('click',function(e){ /* 行内点击已各自绑定，这里兜底阻止冒泡到 document */ });

  /* 导航栏宽度拖拽 */
  var spn=$('#splitterNav'), navDrag=false;
  spn.addEventListener('mousedown',function(e){ navDrag=true; spn.classList.add('drag'); e.preventDefault(); });
  document.addEventListener('mousemove',function(e){
    if(!navDrag) return;
    var ws=document.querySelector('.workspace').getBoundingClientRect();
    var w=Math.max(160,Math.min(460,e.clientX-ws.left));
    $('#paneNav').style.width=w+'px';
  });
  document.addEventListener('mouseup',function(){
    if(!navDrag) return;
    navDrag=false; spn.classList.remove('drag');
    LS.navWidth=$('#paneNav').offsetWidth; lsSave(); applyZoom(); positionBubbles();
  });

  /* splitter（中栏 / 右栏）：像素制拖拽，线性可逆 */
  var sp=$('#splitter'), dragging=false;
  sp.addEventListener('mousedown',function(e){ dragging=true; sp.classList.add('drag'); e.preventDefault(); });
  sp.addEventListener('dblclick',function(){ setPrdWidth(PRD_DEFAULT_W,true); applyZoom(); positionBubbles(); });
  document.addEventListener('mousemove',function(e){
    if(!dragging) return;
    var ws=document.querySelector('.workspace').getBoundingClientRect();
    setPrdWidth(ws.right-e.clientX,false);   /* 右栏宽度 = 鼠标到工作区右边的距离 */
  });
  document.addEventListener('mouseup',function(){
    if(!dragging) return;
    dragging=false; sp.classList.remove('drag');
    LS.prdWidth=$('#panePrd').offsetWidth; lsSave();
    applyZoom(); positionBubbles();
  });

  /* 右栏 PRD 折叠 / 展开 */
  var pt=$('#prdToggle'); if(pt) pt.onclick=function(){ setPrdCollapsed(!$('#panePrd').classList.contains('collapsed')); };
  var pc=$('#prdCollapse'); if(pc) pc.onclick=function(){ setPrdCollapsed(true); };
  var pr=$('#prdRestore'); if(pr) pr.onclick=function(){ setPrdCollapsed(false); };
  /* 全宽预览：折 nav + PRD（再点恢复）。不写 LS —— 它是临时视图，不是默认态。 */
  var fw=$('#fullWidth'); if(fw) fw.onclick=function(){ setFullWidth(!FULLW_ON); };
  window.addEventListener('resize',function(){
    applyZoom(); positionBubbles();
    try{ setPrdWidth($('#panePrd').offsetWidth||LS.prdWidth||PRD_DEFAULT_W,false); }catch(e){}
  });

  if(!DATA.pages.length) toast('未检测到页面数据，请把 JSON 写入 #iprd-data','warning');
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
